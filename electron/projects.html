<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; script-src file:; img-src data:;" />
<title>Projects</title>
<link rel="stylesheet" href="aither-tokens.css" />
<style>
  /* aither://projects -- your repositories: state from awgit, the branch's PR and CI from
     gh, and doors into the Terminal page. projects-client.cjs does the reading. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--font-sans); }
  body { overflow-y: auto; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 18px 20px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 14px; }
  form { display: flex; gap: 8px; margin-bottom: 14px; }
  #dir { flex: 1; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
    padding: 0 10px; font: inherit; }
  button { height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--btn);
    color: var(--fg); cursor: pointer; font: inherit; font-size: 12px; }
  #status { color: var(--muted); min-height: 18px; margin-bottom: 8px; }
  #status.err { color: var(--destructive); }
  .p { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: var(--panel); }
  .p .top { display: flex; align-items: baseline; gap: 10px; }
  .p .name { font-size: 15px; font-weight: 700; }
  .p .dir { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .p .facts { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
  .chip.warn { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 50%, var(--line)); }
  .chip.bad { color: var(--destructive); border-color: color-mix(in srgb, var(--destructive) 50%, var(--line)); }
  .chip.ok { color: var(--success, #3c9); border-color: color-mix(in srgb, var(--success, #3c9) 50%, var(--line)); }
  .p .pr { font-size: 12px; margin: 4px 0 8px; }
  .p .pr a { color: var(--primary, #7cd); }
  .p .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .p .acts a { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--btn); color: var(--fg); text-decoration: none; font-size: 12px; }
  .empty { color: var(--muted); padding: 20px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Projects</h1>
    <div class="sub">Your repositories: the folders you add here, plus every folder an awsh session has worked in.</div>
    <form id="form" autocomplete="off">
      <input id="dir" spellcheck="false" placeholder="Add a repository folder (full path)" aria-label="Repository folder" />
      <button type="submit">Add</button>
      <button type="button" id="refresh">Refresh</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="list"></div>
  </div>
  <script src="projects-page.js"></script>
</body>
</html>
