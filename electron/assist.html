<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Aither</title>
<style>
  :root {
    --bg: rgba(20, 22, 28, 0.97);
    --edge: rgba(255, 255, 255, 0.14);
    --ink: #e8eaee;
    --muted: #98a0ae;
    --field: #2a3144;
    --chip: rgba(255, 255, 255, 0.05);
    --accent: #8ab4ff;
    --good: #5bd08a;
    --bad: #ff8a8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    font: 13px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  #card { height: 100%; padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;
    background: var(--bg); border: 1px solid var(--edge); border-radius: 22px; }
  #row { display: flex; gap: 8px; align-items: center; background: var(--field); border-radius: 999px; padding: 4px 6px 4px 16px; }
  #prompt { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--ink); font: inherit; font-size: 14px; padding: 8px 0; }
  #prompt::placeholder { color: #9aa6c4; }
  button { font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--edge); border-radius: 999px;
    padding: 5px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #0d1220; border-color: transparent; font-weight: 600; }
  #go { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; background: var(--accent); color: #0d1220; border: 0; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 5px 12px; border-radius: 12px; color: #c3cbe0; }
  .verbs .chip { border-radius: 999px; font-size: 12px; padding: 3px 10px; color: var(--muted); }
  #notice { color: var(--bad); padding: 6px 4px; }
  #ctx { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  #result { flex: 1; min-height: 0; display: none; flex-direction: column; gap: 6px; }
  #out { flex: 1; min-height: 70px; resize: none; width: 100%; background: rgba(255,255,255,.04); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 12px; padding: 8px 10px; font: inherit; outline: 0; }
  #out:focus { border-color: var(--accent); }
  #actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #actions .sp { flex: 1; }
  #route { display: none; gap: 6px; align-items: center; }
  #route input { flex: 1; min-width: 0; background: var(--field); color: var(--ink); border: 1px solid var(--edge); border-radius: 999px; padding: 5px 12px; font: inherit; outline: 0; }
  #tools { display: none; flex-wrap: wrap; gap: 6px; }
  #foot { color: var(--muted); font-size: 11.5px; padding: 0 4px; margin-top: auto; }
  #status { min-height: 16px; padding: 0 4px; font-size: 12px; color: var(--muted); }
  #status.err { color: var(--bad); } #status.ok { color: var(--good); }
  .spin::after { content: ""; display: inline-block; width: 10px; height: 10px; margin-left: 6px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: s .8s linear infinite; vertical-align: -1px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="card">
  <div id="row">
    <input id="prompt" type="text" autocomplete="off" spellcheck="false" placeholder="Ask Aither to help me write">
    <button id="tools-btn" title="Utilities (PowerToys / Sysinternals)">Tools</button>
    <button id="go" title="Send (Enter)">&#8593;</button>
  </div>
  <div id="notice" hidden></div>
  <div id="ctx"></div>
  <div class="chips" id="chips"></div>
  <div class="chips verbs" id="verbs"></div>
  <div id="route"><span id="route-label"></span><input id="route-input" type="text" autocomplete="off" spellcheck="false"><button id="route-go" class="primary">Send</button></div>
  <div id="tools"></div>
  <div id="result">
    <textarea id="out" spellcheck="true"></textarea>
    <div id="actions">
      <button id="accept" class="primary">Accept</button>
      <button id="retry">Retry</button>
      <button id="undo" disabled>Undo</button>
      <button id="copy">Copy</button>
      <span class="sp"></span>
      <button id="close">Close</button>
    </div>
  </div>
  <div id="status"></div>
  <div id="foot"></div>
</div>
<script>
(() => {
  const api = window.aitherAssist;
  const $ = (id) => document.getElementById(id);
  let state = null, last = null, busy = false, pendingRoute = null, pendingRename = null;

  function status(text, kind) { const s = $("status"); s.textContent = text || ""; s.className = kind || ""; if (kind === "spin") s.className = "spin"; }
  function chip(label, onClick, extra) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label; b.addEventListener("click", onClick);
    if (extra) b.title = extra;
    return b;
  }
  function render() {
    if (!state || !state.ok) return;
    $("notice").hidden = !state.refused; $("notice").textContent = state.refused || "";
    $("row").style.display = state.refused ? "none" : "flex";
    $("ctx").textContent = [state.app, state.title].filter(Boolean).join(" · ") + (state.hasSelection ? " — selection: “" + state.selectionPreview + "”" : "");
    $("accept").textContent = state.hasSelection ? "Replace selection" : "Insert";
    $("accept").disabled = !state.canInsert;
    $("accept").title = state.canInsert ? "" : "Aither cannot type into this field. Use Copy.";
    const chips = $("chips"); chips.textContent = "";
    (state.chips || []).forEach((c) => chips.appendChild(chip(c.text, () => { $("prompt").value = c.text; submit(c.verb || "write", c.text); })));
    const verbs = $("verbs"); verbs.textContent = "";
    (state.verbs || []).forEach((v) => verbs.appendChild(chip(v.label, () => pick(v))));
    if (state.file) renderFile();
    $("foot").textContent = state.send ? state.send.text : "";
    $("tools-btn").style.display = (state.utils && state.utils.length) ? "" : "none";
    const tools = $("tools"); tools.textContent = "";
    (state.utils || []).forEach((u) => {
      const b = chip(u.label, () => runUtil(u), u.hint || ""); b.disabled = !u.available; if (!u.available) b.title = u.missing || "Not installed";
      tools.appendChild(b);
    });
    if (state.autoRun) { const a = state.autoRun; state.autoRun = null; autoRunNow(a); }
    if (state.initialVerb) { const v = state.initialVerb; state.initialVerb = null; const found = (state.verbs || []).find((x) => x.id === v); if (found) pick(found); }
    $("prompt").focus();
  }
  // File mode (the Explorer right-click): the verbs are about ONE file or folder.
  function renderFile() {
    const f = state.file;
    $("ctx").textContent = "File Explorer · " + f.name + (f.kind === "dir" ? " (folder, " + f.count + " items)" : f.size ? " (" + Math.max(1, Math.round(f.size / 1024)) + " KB)" : "");
    $("prompt").placeholder = "Ask Aither about this " + (f.kind === "dir" ? "folder" : "file");
    $("accept").disabled = true; $("tools-btn").style.display = "none";
    const chips = $("chips"); chips.textContent = "";
    const add = (label, fn, title) => chips.appendChild(chip(label, fn, title));
    add("Summarize", () => fileRun("summarize", ""), f.why || "");
    if (f.kind === "file") add("Rename smartly", renameProposal);
    if (f.kind === "file" && f.conversions && f.conversions.length) add("Convert…", showConversions);
    add("Send to knowledge", () => fileRun("pipeline", ""), "Documents / data pipeline");
    add("Run a tool pack…", () => openRoute({ id: "pack", label: "Tool pack", route: "pack" }));
    const iv = state.initialVerb; state.initialVerb = null;
    // Only READ-ONLY, proposal-style verbs start by themselves. A verb that sends the file somewhere
    // (knowledge, an agent's tool pack) always waits for its own click.
    if (iv === "summarize") fileRun("summarize", ""); else if (iv === "rename") renameProposal(); else if (iv === "convert") showConversions();
    else if (iv === "pipeline") status("Press \u201CSend to knowledge\u201D to confirm.", ""); else if (iv === "pack") openRoute({ id: "pack", label: "Tool pack", route: "pack" });
  }
  function showConversions() {
    const verbs = $("verbs"); verbs.textContent = "";
    (state.file.conversions || []).forEach((c) => { const b = chip(c.label, () => fileRun("convert", c.id), c.available ? "" : c.missing); b.disabled = !c.available; verbs.appendChild(b); });
  }
  async function fileRun(action, arg) {
    if (busy) return; busy = true; status("Working", "spin"); pendingRename = null;
    const res = await api.file(action, arg || "");
    busy = false;
    if (!res.ok) { status(res.error || "Failed", "err"); return; }
    last = res.verb ? { id: res.id, verb: res.verb, prompt: arg || "", arg: "", kind: "answer" } : null;
    show(res.text || "Done.", null, action);
    status(res.destination ? "Answer from " + res.destination : "Done.", "ok");
  }
  async function renameProposal() {
    if (busy) return; busy = true; status("Thinking of a name", "spin");
    const res = await api.file("rename-propose", "");
    busy = false;
    if (!res.ok) { status(res.error || "Failed", "err"); return; }
    pendingRename = { from: res.from };
    show(res.name, null, "rename");
    $("accept").style.display = ""; $("accept").textContent = "Rename"; $("accept").disabled = false; $("retry").disabled = false;
    status("Proposed: " + res.name + res.extension + " (nothing renamed yet)", "ok");
  }
  function pick(v) {
    if (v.kind === "route") { openRoute(v); return; }
    if (v.id === "translate") { openRoute({ id: "translate", label: "Translate to", route: "lang" }); return; }
    submit(v.id, "");
  }
  function openRoute(v) {
    pendingRoute = v;
    $("route").style.display = "flex";
    const ri = $("route-input");
    if (v.route === "lang") { $("route-label").textContent = "Translate to"; ri.value = ""; ri.placeholder = "English, Spanish, ..."; ri.removeAttribute("list"); }
    else if (v.route === "pack") { $("route-label").textContent = "Tool pack"; ri.value = ""; ri.placeholder = "pack id, e.g. dgg-research"; ri.removeAttribute("list"); }
    else if (v.route === "workflow") { $("route-label").textContent = "Workflow"; ri.value = ""; ri.placeholder = "workflow / swarm name"; ri.removeAttribute("list"); }
    else if (v.kind === "route") { $("route-label").textContent = v.label + ":"; ri.value = state.agent || "aither"; ri.placeholder = "agent"; ri.setAttribute("list", "agents"); }
    ri.focus(); ri.select();
  }
  async function routeGo() {
    const v = pendingRoute; if (!v || busy) return;
    const val = $("route-input").value.trim();
    if (v.route === "lang") { $("route").style.display = "none"; submit("translate", "", val || "English"); return; }
    if (v.route === "pack") { $("route").style.display = "none"; fileRun("pack", val); return; }
    busy = true; status("Sending", "spin");
    const res = await api.route({ verb: v.id, agent: v.route === "workflow" ? "" : val, name: v.route === "workflow" ? val : "" });
    busy = false;
    if (!res.ok) { status(res.error || "Failed", "err"); return; }
    $("route").style.display = "none";
    if (res.text) show(res.text, null, v.id);
    status(res.text ? "Answer from " + res.destination : "Done: sent to " + res.destination, "ok");
  }
  function show(text, run, verb) {
    $("result").style.display = "flex"; $("out").value = text; last = run || last;
    $("accept").textContent = state && state.hasSelection ? "Replace selection" : "Insert";
    $("retry").disabled = !(last && last.verb);
    $("undo").disabled = true;
    // Answers (explain, summarize, an agent's reply, a utility's text) are read, not typed into the field.
    $("accept").style.display = (run && run.kind === "transform") ? "" : "none";
    void verb;
    $("out").focus();
  }
  // From Alt+Space: the verb starts at once; a transform result is put in place with Undo ready.
  async function autoRunNow(a) {
    await submit(a.verb, a.prompt || "", "");
    if (a.insert && last && last.kind === "transform" && $("out").value.trim() && !$("accept").disabled) $("accept").click();
  }
  async function submit(verb, prompt, arg) {
    if (busy) return; busy = true;
    const text = prompt != null && prompt !== "" ? prompt : $("prompt").value.trim();
    status("Thinking", "spin"); $("go").disabled = true;
    const res = await api.run({ verb, prompt: text, arg: arg || "" });
    busy = false; $("go").disabled = false;
    if (!res.ok) { status(res.error || "Failed", "err"); return; }
    last = { id: res.id, verb: res.verb, prompt: text, arg: arg || "", kind: res.kind };
    show(res.text, last);
    status("From " + (res.model || "your model") + " via " + res.destination, "ok");
  }
  async function runUtil(u) {
    if (busy) return; busy = true; status("Running " + u.label, "spin");
    // The prompt box doubles as the argument for a utility: "2h" for Awake, "800" for the resizer.
    const res = await api.util(u.id, $("prompt").value.trim());
    busy = false;
    if (!res.ok) { status(res.error || "Failed", "err"); return; }
    if (res.text) show(res.text, null, "util");
    status(res.note || "Done", "ok");
  }
  const go = () => { if (state && state.file) { const q = $("prompt").value.trim(); if (q) fileRun("ask", q); else status("Type your question first", "err"); } else submit("write", ""); };
  $("go").addEventListener("click", go);
  $("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); go(); } if (e.key === "Escape") api.close(); });
  $("route-input").addEventListener("keydown", (e) => { if (e.key === "Enter") routeGo(); if (e.key === "Escape") $("route").style.display = "none"; });
  $("route-go").addEventListener("click", routeGo);
  $("tools-btn").addEventListener("click", () => { const t = $("tools"); t.style.display = t.style.display === "flex" ? "none" : "flex"; });
  $("accept").addEventListener("click", async () => {
    if (pendingRename) {
      status("Renaming", "spin");
      const r = await api.file("rename-apply", $("out").value);
      if (!r.ok) { status(r.error || "Could not rename", "err"); return; }
      pendingRename = { done: true, from: r.from }; $("undo").disabled = false; $("accept").disabled = true;
      status("Renamed to " + r.to.split("\\").pop() + ". Undo puts the old name back.", "ok");
      return;
    }
    status("Inserting", "spin");
    const res = await api.accept($("out").value);
    if (!res.ok) { status(res.error || "Could not insert", "err"); return; }
    $("undo").disabled = false; status("Inserted. Undo if it is not right.", "ok");
  });
  $("retry").addEventListener("click", () => {
    if (pendingRename && !pendingRename.done) { renameProposal(); return; }
    if (state && state.file && last && last.verb) { fileRun(last.verb, last.prompt); return; }
    if (last && last.verb) submit(last.verb, last.prompt, last.arg);
  });
  $("undo").addEventListener("click", async () => {
    if (pendingRename && pendingRename.done) {
      const r = await api.file("rename-undo", "");
      if (!r.ok) { status(r.error || "Could not undo", "err"); return; }
      pendingRename = null; $("undo").disabled = true; status("Old name restored.", "ok");
      return;
    }
    const res = await api.undo();
    if (!res.ok) { status(res.error || "Could not undo", "err"); return; }
    $("undo").disabled = true; status("Undone.", "ok");
  });
  $("copy").addEventListener("click", async () => { await api.copy($("out").value); status("Copied.", "ok"); });
  $("close").addEventListener("click", () => api.close());
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") api.close(); });

  const dl = document.createElement("datalist"); dl.id = "agents"; document.body.appendChild(dl);
  function reset() { pendingRename = null; $("verbs").textContent = ""; $("result").style.display = "none"; $("route").style.display = "none"; $("tools").style.display = "none"; $("prompt").value = ""; $("out").value = ""; last = null; status(""); }
  api.onState(async (s) => {
    reset(); state = s; dl.textContent = "";
    (s.agents || []).forEach((a) => { const o = document.createElement("option"); o.value = a; dl.appendChild(o); });
    render();
    if (s.ok && !s.refused && s.chips) {
      const r = await api.refine();
      if (r && r.ok && r.chips && r.chips.length) { state.chips = r.chips; render(); }
    }
  });
  api.state().then((s) => { if (s && s.ok) { state = s; render(); } });
})();
</script>
</body>
</html>
