<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline' file:; script-src 'unsafe-inline';" />
<title>Send feedback</title>
<link rel="stylesheet" href="aither-tokens.css" />
<!-- One-click feedback to the company app's support (desk-support.cjs). The message, and only
     what the person ticks below, is sent; passwords, keys and e-mail addresses are removed
     from the log lines before anything leaves this PC. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--panel); color: var(--fg); font: 14px/1.5 var(--font-sans); }
  main { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 18px; margin: 0; }
  p { margin: 0; color: var(--muted); }
  textarea { width: 100%; height: 150px; resize: none; padding: 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--btn); color: var(--fg); font: inherit; }
  label { display: flex; gap: 8px; align-items: center; }
  img { max-width: 100%; max-height: 120px; border: 1px solid var(--line); border-radius: 6px; display: none; }
  button { padding: 9px 16px; border-radius: 10px; border: 0; background: var(--accent); color: var(--on-accent, #fff); font: 600 14px var(--font-sans); cursor: pointer; }
  #status { min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <h1>Send feedback</h1>
  <p>Tell us what happened or what you need. It goes straight to the support team.</p>
  <textarea id="msg" placeholder="What happened?" autofocus></textarea>
  <label><input type="checkbox" id="logs" checked /> Include recent Aither log lines (<span id="nlogs">0</span>)</label>
  <label><input type="checkbox" id="shot" /> Attach a screenshot of my screen</label>
  <img id="preview" alt="Screenshot that would be attached" />
  <div><button id="send">Send</button></div>
  <p id="status" role="status"></p>
  <p>Passwords, keys and e-mail addresses are removed from log lines before sending.</p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  window.deskFeedback.state().then((s) => {
    if (!s) return;
    $("nlogs").textContent = String(s.logs);
    if (!s.hasShot) { $("shot").disabled = true; $("shot").parentElement.title = "No screenshot available"; }
    else $("preview").src = s.shotPreview;
  });
  $("shot").addEventListener("change", () => { $("preview").style.display = $("shot").checked ? "block" : "none"; });
  $("send").addEventListener("click", async () => {
    $("send").disabled = true;
    $("status").textContent = "Sending…";
    const r = await window.deskFeedback.send({ message: $("msg").value, includeLogs: $("logs").checked, includeShot: $("shot").checked });
    if (!r || !r.ok) { $("status").textContent = (r && r.error) || "Could not send."; $("send").disabled = false; return; }
    $("status").textContent = r.sent ? "Sent. Thank you." : "Saved. It will be sent as soon as this PC is online and listed in your company app.";
    if (r.sent) setTimeout(() => window.close(), 1500);
  });
</script>
</body>
</html>
