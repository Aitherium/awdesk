<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; script-src file:; img-src data:; font-src file:;" />
<title>Terminal</title>
<link rel="stylesheet" href="aither-tokens.css" />
<link rel="stylesheet" href="vendor/xterm/xterm.css" />
<style>
  /* aither://terminal -- the awsh layer: terminal tabs over the awsh harness daemon
     (terminal-client.cjs). One xterm per tab; only the active one is shown. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 13px/1.4 var(--font-sans); }
  body { display: flex; flex-direction: column; }
  .strip { flex: none; height: 38px; display: flex; align-items: flex-end; gap: 2px; padding: 4px 8px 0;
    background: var(--bg-deep, var(--bg)); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  /* Shrinkable: five chips of 240 px do not fit a narrow window, and a chip
     scrolled out of sight is a session the owner cannot see. The label ellipsizes. */
  .tab { display: flex; align-items: center; gap: 7px; height: 32px; max-width: 240px; min-width: 72px;
    padding: 0 6px 0 10px;
    border-radius: 8px 8px 0 0; border: 1px solid transparent; border-bottom: 0; background: none; color: var(--muted);
    cursor: pointer; font: inherit; font-size: 12px; flex: 0 1 auto; }
  .tab:hover { color: var(--fg); background: var(--surface-900, var(--panel)); }
  .tab.active { background: var(--bg); border-color: var(--line); color: var(--fg); }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success, #3c9); flex: none; }
  .tab.exited .dot { background: var(--surface-500, #666); }
  .tab .t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .x { flex: none; width: 18px; height: 18px; border: 0; border-radius: 4px; background: none; color: inherit; cursor: pointer; padding: 0; }
  .tab .x:hover { background: var(--surface-800, var(--line)); }
  /* The "+N" chip is a door, not a session: it reveals the folded tabs. */
  .tab.overflow { color: var(--primary); font-weight: 600; }
  #add { height: 28px; padding: 0 10px; margin-bottom: 2px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--btn); color: var(--fg); cursor: pointer; font: inherit; font-size: 12px; flex: none; }
  #menu { position: fixed; top: 40px; left: 8px; z-index: 10; min-width: 260px; padding: 6px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel, var(--bg)); box-shadow: 0 12px 30px rgba(0,0,0,.4); }
  #menu[hidden] { display: none; }
  #menu .h { margin: 6px 6px 2px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #menu button { display: block; width: 100%; text-align: left; height: 30px; padding: 0 10px; border: 0; border-radius: 7px;
    background: none; color: var(--fg); cursor: pointer; font: inherit; }
  #menu button:hover { background: var(--surface-900, var(--line)); }
  #menu input { width: calc(100% - 12px); margin: 4px 6px 6px; height: 28px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); padding: 0 8px; font: inherit; font-size: 12px; }
  #menu .sub { color: var(--muted); font-size: 11px; margin-left: 6px; }
  #panes { flex: 1; position: relative; min-height: 0; }
  .pane { position: absolute; inset: 0; padding: 6px 4px 4px 8px; background: #0b0d12; }
  .pane[hidden] { display: none; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; }
  #empty[hidden] { display: none; }
  #empty b { color: var(--fg); }
  /* The empty pane is the START screen, not prose: one next action, three
     doors. Nothing here is a dead end -- every button starts a real session. */
  .home { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 520px; padding: 0 16px; }
  .home-next { display: flex; align-items: baseline; justify-content: center; gap: 8px; flex-wrap: wrap;
    font-size: 13px; color: var(--muted); }
  .home-kicker { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--primary); }
  .home-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .home-actions button { height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--btn); color: var(--fg); cursor: pointer; font: inherit; font-size: 12.5px; }
  .home-actions button:first-child { border-color: var(--primary); color: var(--primary); }
  .home-actions button:hover { background: var(--surface-900, var(--panel)); }
  .home-hint { margin: 0; font-size: 11.5px; color: var(--muted); }
  #status { position: absolute; right: 10px; bottom: 6px; font-size: 11px; color: var(--destructive); }
  /* ?dock=1: the browser's bottom dock. Closed it is only this strip (32 px, browser-rail
     DOCK_STRIP_HEIGHT): every daemon session as a tab, the running count, the toggle. */
  .docktools { display: none; }
  body.dock .strip { height: 32px; align-items: center; padding: 0 6px; gap: 3px; border-top: 1px solid var(--line); }
  body.dock .tab { height: 24px; border-radius: 6px; border: 1px solid transparent; font-size: 11.5px; max-width: 200px; }
  body.dock .tab.active { border-color: var(--line); background: var(--surface-900, var(--panel)); }
  body.dock .tab.mirror { opacity: .72; }
  body.dock .tab.mirror .dot { background: transparent; border: 1px solid var(--success, #3c9); }
  body.dock #add { height: 24px; margin: 0; padding: 0 8px; font-size: 11.5px; }
  body.dock .docktools { display: flex; align-items: center; gap: 4px; margin-left: auto; flex: none; position: sticky; right: 0;
    background: var(--bg-deep, var(--bg)); padding-left: 6px; }
  body.dock .docktools button { height: 24px; min-width: 26px; padding: 0 6px; border-radius: 6px; border: 1px solid transparent;
    background: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 12px; }
  body.dock .docktools button:hover:not(:disabled) { color: var(--fg); border-color: var(--line); }
  body.dock .docktools button:disabled { opacity: .35; cursor: default; }
  body.dock #summary { color: var(--muted); font-size: 11px; white-space: nowrap; padding: 0 6px; }
  body.dock #menu { top: 34px; }
  body.dock #empty { font-size: 12px; }
</style>
</head>
<body>
  <div class="strip" id="strip" role="tablist" aria-label="Terminal sessions">
    <button id="add" title="New session: a shell, Claude Code, Aither, Codex...">+ New</button>
    <div class="docktools">
      <span id="summary" role="status"></span>
      <button id="dock-detach" title="Detach: stop showing this session here (it keeps running)" aria-label="Detach">&#9167;</button>
      <button id="dock-pop" title="Pop out to a full terminal tab" aria-label="Pop out to a full terminal tab">&#8599;</button>
      <button id="dock-toggle" title="Open the terminal dock (Ctrl+`)" aria-label="Open or close the terminal dock">&#9652;</button>
    </div>
  </div>
  <div id="menu" hidden role="menu"></div>
  <div id="panes">
    <div id="empty"><div class="home">
      <div class="home-next"><span class="home-kicker">Next</span><span><b>Open a shell</b> — pick a harness, or resume a session.</span></div>
      <div class="home-actions">
        <button type="button" data-home="routine">Run a routine</button>
        <button type="button" data-home="shell">Open a shell</button>
        <button type="button" data-home="resume">Resume a session</button>
      </div>
      <p class="home-hint">Shells and coding agents, run by the awsh daemon on this machine. <b>+ New</b> has the full list.</p>
    </div></div>
    <span id="status" role="status"></span>
  </div>
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
  <script src="terminal-dock-model.js"></script>
  <script src="terminal-strip.js"></script>
  <script src="terminal-page.js"></script>
</body>
</html>
