<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; script-src 'unsafe-inline'; img-src data:;" />
<title>Secrets</title>
<link rel="stylesheet" href="aither-tokens.css" />
<style>
  /* Colours come from aither-tokens.css (generated from Veil's tokens). */
  :root { --amber: var(--warning); --red: var(--destructive); --green: var(--success); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.45 var(--font-sans); }
  body { display: grid; grid-template-rows: 44px 1fr; height: 100vh; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 0 14px;
    border-bottom: 1px solid var(--line); }
  .embedded .bar .title { display: none; }
  .bar .title { font-weight: 600; }
  .bar .state { color: var(--muted); font-size: 12px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .state.err { color: var(--red); }
  .chip { appearance: none; border: 1px solid var(--line); background: var(--btn);
    color: var(--muted); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
  .chip:hover { background: var(--btn-hi); color: var(--fg); }
  input.filter { background: var(--btn); border: 1px solid var(--line); color: var(--fg);
    border-radius: 6px; padding: 5px 8px; font: inherit; width: 200px; }
  main { overflow-y: auto; min-height: 0; }
  section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  h3 { margin: 0 0 8px; font-size: 10px; font-weight: 650; letter-spacing: .09em;
    text-transform: uppercase; color: var(--surface-400); display: flex; gap: 8px; align-items: center; }
  h3 .grow { flex: 1; }
  h3 .tool { text-transform: none; letter-spacing: 0; font-weight: 400; font-family: var(--font-mono); color: var(--muted); }
  .pill { font-size: 10px; border-radius: 999px; padding: 1px 7px; border: 1px solid var(--line);
    color: var(--muted); white-space: nowrap; text-transform: none; letter-spacing: 0; }
  .pill.ok { color: var(--green); }
  .pill.bad { color: var(--red); }
  .summary.bad { color: var(--red); word-break: break-word; }
  .placeholder { color: var(--muted); padding: 6px 0; }
  .note { color: var(--muted); font-size: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 3px 8px 3px 0;
    border-bottom: 1px solid var(--line); }
  td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--btn); vertical-align: top; word-break: break-word; }
  td.name { font-family: var(--font-mono); }
  td.hint { font-family: var(--font-mono); color: var(--muted); white-space: nowrap; }
  .tag { display: inline-block; font-size: 10px; border: 1px solid var(--line); border-radius: 999px;
    padding: 0 6px; margin: 0 4px 2px 0; color: var(--muted); }
</style>
</head>
<body>
  <div class="bar">
    <span class="title">Secrets</span>
    <span class="state" id="state">loading…</span>
    <input class="filter" id="filter" type="search" placeholder="Filter names" aria-label="Filter secret names" />
    <button class="chip" id="refresh">Refresh</button>
  </div>
  <main>
    <div class="note">Names and masked hints only. Values never reach this page — read one through
      the get_secret MCP tool or Veil's vault, where the read is audited.</div>
    <div id="sources"><div class="placeholder" style="padding:12px 14px">listing secrets…</div></div>
  </main>
<script>
"use strict";
// The Secrets page: one section per scope (platform vault, workspace, personal
// lockbox). Everything is rendered with textContent; the bridge carries names
// and masked hints only (secrets-window.cjs projects every answer).
const bridge = window.aitherSecrets;
const $ = (id) => document.getElementById(id);
const stateEl = $("state");
let last = null;

function say(text, isError) {
  stateEl.textContent = text || "";
  stateEl.classList.toggle("err", Boolean(isError));
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = String(text);
  return e;
}
function when(ts) {
  if (!ts) return "";
  const d = new Date(/^\d+(\.\d+)?$/.test(ts) && Number(ts) < 1e12 ? Number(ts) * 1000 : ts);
  return isNaN(d) ? String(ts) : d.toLocaleDateString();
}

function renderSource(src, needle) {
  const box = el("section");
  const h = el("h3");
  h.appendChild(el("span", "", src.label));
  h.appendChild(el("span", "grow"));
  h.appendChild(el("span", "tool", src.tool));
  h.appendChild(el("span", "pill " + (src.ok ? "ok" : "bad"), src.ok ? String(src.count || 0) + " names" : "failed"));
  box.appendChild(h);
  if (!src.ok) {
    box.appendChild(el("div", "summary bad", "Could not list: " + (src.error || "no answer")));
    return box;
  }
  const rows = (src.entries || []).filter((e) => !needle || e.name.toLowerCase().includes(needle));
  if (!rows.length) {
    box.appendChild(el("div", "placeholder", needle ? "No names match the filter." : "No secrets in this scope."));
    return box;
  }
  const table = el("table");
  const head = el("tr");
  for (const c of ["Name", "Hint", "About", "Updated"]) head.appendChild(el("th", "", c));
  table.appendChild(head);
  for (const e of rows) {
    const tr = el("tr");
    tr.appendChild(el("td", "name", e.name));
    tr.appendChild(el("td", "hint", e.hint || "••••"));
    const about = el("td");
    if (e.description) about.appendChild(el("div", "", e.description));
    for (const t of e.tags || []) about.appendChild(el("span", "tag", t));
    tr.appendChild(about);
    tr.appendChild(el("td", "", when(e.updated || e.created)));
    table.appendChild(tr);
  }
  box.appendChild(table);
  return box;
}

function render() {
  const box = $("sources");
  if (!last) return;
  const needle = $("filter").value.trim().toLowerCase();
  box.replaceChildren(...(last.sources || []).map((s) => renderSource(s, needle)));
}

async function refresh() {
  say("refreshing…");
  const res = await bridge.list();
  if (!res || !res.ok) {
    $("sources").replaceChildren(el("div", "summary bad", "Could not list secrets: " + ((res && res.error) || "no answer")));
    $("sources").firstChild.style.padding = "12px 14px";
    say("read failed", true);
    return;
  }
  last = res.data || { sources: [] };
  render();
  const failed = Number(last.failed) || 0;
  say(failed ? failed + " of " + (last.sources || []).length + " scopes failed -- see below"
    : "updated " + new Date().toLocaleTimeString(), failed > 0);
}

$("refresh").addEventListener("click", () => void refresh());
$("filter").addEventListener("input", render);
if (!bridge) say("no secrets bridge in this frame", true);
else void refresh();
</script>
</body>
</html>
