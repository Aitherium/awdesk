<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Aither</title>
<style>
  :root {
    --bg: rgba(15, 18, 23, 0.94);
    --bg-solid: #0f1217;
    --edge: rgba(255, 255, 255, 0.12);
    --ink: #e8ebef;
    --muted: #8b93a1;
    --accent: #7cc4ff;
    --accent-soft: rgba(124, 196, 255, 0.16);
    --warn: #ffb86b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    font: 14px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--ink); user-select: none;
  }
  #card {
    position: absolute; inset: 8px; display: flex; flex-direction: column;
    background: var(--bg); border: 1px solid var(--edge); border-radius: 16px;
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(18px); overflow: hidden;
  }
  #top {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  #chip {
    flex: none; padding: 3px 9px; border-radius: 999px; font-size: 11px; letter-spacing: 0.02em;
    color: var(--accent); background: var(--accent-soft); border: 1px solid rgba(124, 196, 255, 0.3);
    min-width: 92px; text-align: center; white-space: nowrap;
  }
  #input {
    all: unset; flex: 1; min-width: 0; font-size: 19px; line-height: 1.2; color: var(--ink);
    caret-color: var(--accent); padding: 2px 0;
  }
  #input::placeholder { color: rgba(139, 147, 161, 0.75); }
  #hint { flex: none; color: var(--muted); font-size: 11px; white-space: nowrap; }
  #results { flex: 1; overflow-y: auto; padding: 6px 8px 4px; scrollbar-width: thin; }
  #results::-webkit-scrollbar { width: 8px; }
  #results::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 4px; }
  .group-label {
    display: flex; justify-content: space-between; gap: 8px; padding: 7px 8px 3px;
    color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
  }
  .group-label .count { letter-spacing: 0; text-transform: none; }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px;
    border: 1px solid transparent; cursor: pointer; margin-bottom: 1px;
  }
  .row .glyph { flex: none; width: 22px; text-align: center; color: var(--muted); font-size: 12px; }
  .row .text { flex: 1; min-width: 0; }
  .row .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .kind { flex: none; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; }
  .row.sel { background: var(--accent-soft); border-color: rgba(124, 196, 255, 0.4); }
  .row.more { color: var(--accent); font-size: 12.5px; justify-content: center; }
  #empty { color: var(--muted); padding: 28px 12px; text-align: center; }
  #output {
    margin: 0 10px 8px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
    background: rgba(0, 0, 0, 0.32); display: none; flex-direction: column; max-height: 220px;
  }
  #output.open { display: flex; }
  #output-head {
    display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px;
    color: var(--muted); font-size: 11px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  #output-close { all: unset; cursor: pointer; color: var(--accent); }
  #output-body {
    margin: 0; padding: 8px 10px 10px; overflow: auto; white-space: pre-wrap; word-break: break-word;
    font: 11.5px/1.4 "Cascadia Mono", "Consolas", monospace; color: #d6dae1; user-select: text;
  }
  #status {
    flex: none; padding: 8px 14px 11px; color: var(--muted); font-size: 11.5px;
    border-top: 1px solid rgba(255, 255, 255, 0.05); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  #status.warn { color: var(--warn); }
</style>
</head>
<body>
<div id="card">
  <div id="top">
    <span id="chip">Everything</span>
    <input id="input" type="text" spellcheck="false" autocomplete="off"
      placeholder="Search apps, files, desk actions, agents and the web" aria-label="Aither launcher" />
    <span id="hint">↑↓ · Tab groups · Enter run · Esc close</span>
  </div>
  <div id="results" role="listbox" aria-label="Results"></div>
  <div id="output">
    <div id="output-head"><span id="output-title">Output</span><button id="output-close" type="button">clear</button></div>
    <pre id="output-body"></pre>
  </div>
  <div id="status" role="status">Indexed: apps, files, desk actions, screenshots, clipboard, agents and the web — type to search</div>
</div>
<script>
  const input = document.getElementById("input");
  const chip = document.getElementById("chip");
  const results = document.getElementById("results");
  const status = document.getElementById("status");
  const output = document.getElementById("output");
  const outputTitle = document.getElementById("output-title");
  const outputBody = document.getElementById("output-body");

  const CHIPS = { all: "Everything", command: "> awsh / adk desk", ask: "? Ask Aither", spirit: "@ Spirit" };
  const IDLE = "Indexed: apps, files, desk actions, screenshots, clipboard, agents and the web — type to search";

  let state = { token: 0, mode: "all", term: "", groups: [], rows: [], selected: 0, expanded: new Set() };
  let searchTimer = null;
  let lastQuery = "";
  let commandArmed = "";

  function prefixOf(text) {
    const raw = String(text || "").trim();
    const first = raw.slice(0, 1);
    if (first === ">") return { mode: "command", term: raw.slice(1).trim() };
    if (first === "?") return { mode: "ask", term: raw.slice(1).trim() };
    if (first === "@") return { mode: "spirit", term: raw.slice(1).trim() };
    return { mode: "all", term: raw };
  }

  function setStatus(text, warn) {
    status.textContent = text || IDLE;
    status.classList.toggle("warn", Boolean(warn));
  }

  function rowsFor() {
    const rows = [];
    for (const group of state.groups) {
      const expanded = state.expanded.has(group.id);
      const items = expanded ? group.items : group.shown;
      for (const item of items) rows.push({ kind: "item", group: group.id, item });
      if (group.more > 0 && !expanded) rows.push({ kind: "more", group: group.id, more: group.more });
    }
    return rows;
  }

  function render() {
    state.rows = rowsFor();
    results.replaceChildren();
    if (!state.groups.length) {
      const empty = document.createElement("div");
      empty.id = "empty";
      empty.textContent = state.mode === "command" ? "Press Enter to run the command line"
        : state.mode === "ask" ? "Press Enter to ask Aither"
          : state.mode === "spirit" ? "Press Enter to send to Spirit"
            : state.term ? "No results yet" : "Type to search";
      results.append(empty);
      state.selected = 0;
      return;
    }
    let cursor = 0;
    for (const group of state.groups) {
      const head = document.createElement("div");
      head.className = "group-label";
      const name = document.createElement("span");
      name.textContent = group.label;
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = String(group.total);
      head.append(name, count);
      results.append(head);
      const expanded = state.expanded.has(group.id);
      const items = expanded ? group.items : group.shown;
      for (const item of items) {
        results.append(rowFor(group.id, item, cursor));
        cursor += 1;
      }
      if (group.more > 0 && !expanded) {
        const more = document.createElement("div");
        more.className = "row more";
        more.textContent = `+${group.more} more ${group.label.toLowerCase()}`;
        more.addEventListener("click", () => expand(group.id));
        results.append(more);
        cursor += 1;
      }
    }
    state.selected = Math.max(0, Math.min(state.selected, state.rows.length - 1));
    paintSelection();
  }

  function rowFor(groupId, item, index) {
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.group = groupId;
    row.dataset.index = String(index);
    const glyph = document.createElement("span");
    glyph.className = "glyph";
    glyph.textContent = glyphFor(item.kind);
    const text = document.createElement("span");
    text.className = "text";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = item.title;
    text.append(title);
    if (item.subtitle) {
      const sub = document.createElement("div");
      sub.className = "sub";
      sub.textContent = item.subtitle;
      text.append(sub);
    }
    const kind = document.createElement("span");
    kind.className = "kind";
    kind.textContent = String(item.kind || "");
    row.append(glyph, text, kind);
    row.addEventListener("click", () => {
      state.selected = Number(row.dataset.index) || 0;
      paintSelection();
      void runSelected();
    });
    return row;
  }

  function glyphFor(kind) {
    return ({ app: "▣", file: "▤", screenshot: "▦", clip: "▥", action: "◆", agent: "◈", web: "◐" })[kind] || "•";
  }

  function paintSelection() {
    const nodes = results.querySelectorAll(".row");
    nodes.forEach((node, index) => node.classList.toggle("sel", index === state.selected));
    const active = nodes[state.selected];
    if (active && active.scrollIntoView) active.scrollIntoView({ block: "nearest" });
  }

  function expand(groupId) {
    state.expanded.add(groupId);
    render();
  }

  function apply(payload) {
    if (!payload || payload.ignored) return;
    if (payload.token && payload.token < state.token) return;
    state.token = payload.token || state.token;
    state.mode = payload.mode || state.mode;
    state.term = payload.term || "";
    state.groups = payload.groups || [];
    if (payload.status) setStatus(payload.status, /down|refused|missing|failed|unavailable/i.test(payload.status));
    chip.textContent = CHIPS[state.mode] || CHIPS.all;
    state.selected = 0;
    render();
  }

  function requestSearch(text) {
    const parsed = prefixOf(text);
    chip.textContent = CHIPS[parsed.mode];
    if (parsed.mode !== "all") { commandArmed = ""; }
    if (!parsed.term && parsed.mode === "all") {
      state.groups = [];
      state.term = "";
      state.mode = "all";
      setStatus(IDLE, false);
      render();
      return;
    }
    void window.aitherLauncher.search(text).then(apply).catch((error) => {
      setStatus(`1 search failed — ${String((error && error.message) || error)}`, true);
    });
  }

  input.addEventListener("input", () => {
    const text = input.value;
    chip.textContent = CHIPS[prefixOf(text).mode];
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { lastQuery = text; requestSearch(text); }, 60);
  });

  function selectedRow() {
    return state.rows[state.selected] || state.rows[0] || null;
  }

  async function runSelected() {
    const row = selectedRow();
    const parsed = prefixOf(input.value);
    const term = parsed.term;
    if (row && row.kind === "more") { expand(row.group); return; }
    if (parsed.mode === "command") { await submitCommand(); return; }
    if (parsed.mode === "ask") { await submitAsk(); return; }
    if (parsed.mode === "spirit") { await submitSpirit(); return; }
    if (!row || row.kind !== "item") return;
    const reply = await window.aitherLauncher.run(row.item.key, term);
    if (reply && reply.ok === false) {
      setStatus(reply.error || "1 result failed — try it from the palette (Ctrl+K)", true);
      return;
    }
    if (reply && reply.did) setStatus(reply.did, false);
  }

  async function submitAsk() {
    const term = prefixOf(input.value).term;
    if (!term) { setStatus("Type a question after ?", true); return; }
    const reply = await window.aitherLauncher.ask(term);
    if (reply && reply.ok === false) setStatus(reply.error, true);
    else if (reply && reply.did) setStatus(reply.did, false);
  }

  async function submitSpirit() {
    const term = prefixOf(input.value).term;
    if (!term) { setStatus("Type a message after @", true); return; }
    const reply = await window.aitherLauncher.spirit(term);
    if (reply && reply.ok === false) setStatus(reply.error, true);
    else if (reply && reply.did) setStatus(reply.did, false);
  }

  async function submitCommand() {
    const term = prefixOf(input.value).term;
    if (!term) { setStatus("Type a command after > (adk desk ... or awsh ...)", true); return; }
    const armed = commandArmed === term;
    const reply = await window.aitherLauncher.command(term, armed);
    if (reply && reply.ok === false) { setStatus(reply.error, true); return; }
    if (reply && reply.needsConfirm) {
      commandArmed = term;
      setStatus(`${reply.reason}`, true);
      return;
    }
    commandArmed = "";
    showOutput(term, reply);
  }

  function showOutput(line, reply) {
    output.classList.add("open");
    const exit = reply.timedOut ? "timed out" : `exit ${reply.code}`;
    outputTitle.textContent = `> ${line} · ${exit}`;
    outputBody.textContent = reply.output || "(no output)";
    setStatus(`ran > ${line} · ${exit}`, Boolean(reply.timedOut) || reply.code !== 0);
  }

  document.getElementById("output-close").addEventListener("click", () => {
    output.classList.remove("open");
    outputBody.textContent = "";
  });

  input.addEventListener("keydown", (event) => {
    if (event.key === "Escape") { event.preventDefault(); void window.aitherLauncher.hide(); return; }
    if (event.key === "ArrowDown") {
      event.preventDefault();
      if (state.rows.length) { state.selected = (state.selected + 1) % state.rows.length; paintSelection(); }
      return;
    }
    if (event.key === "ArrowUp") {
      event.preventDefault();
      if (state.rows.length) { state.selected = (state.selected - 1 + state.rows.length) % state.rows.length; paintSelection(); }
      return;
    }
    if (event.key === "Tab") {
      event.preventDefault();
      cycleGroup(event.shiftKey ? -1 : 1);
      return;
    }
    if (event.key === "Enter") {
      event.preventDefault();
      void runSelected();
    }
  });

  function cycleGroup(delta) {
    const groups = state.groups;
    if (!groups.length) return;
    const current = state.rows[state.selected];
    const currentGroup = current ? current.group : groups[0].id;
    let index = groups.findIndex((g) => g.id === currentGroup);
    if (index < 0) index = 0;
    const next = groups[(index + delta + groups.length) % groups.length];
    const at = state.rows.findIndex((r) => r.group === next.id);
    if (at >= 0) { state.selected = at; paintSelection(); }
  }

  window.aitherLauncher.onResults(apply);
  window.aitherLauncher.onFocus(() => {
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    lastQuery = input.value;
    requestSearch(input.value);
  });

  input.focus();
  void window.aitherLauncher.search("").then(apply);
</script>
</body>
</html>
