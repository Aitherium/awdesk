<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Quick type</title>
<style>
  :root { --bar: #171b21; --edge: #2b323c; --ink: #e6e8eb; --muted: #8b93a1; --accent: #7cc4ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14171c; color: var(--ink);
    font: 13px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  #bar { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; background: var(--bar);
    border-bottom: 1px solid var(--edge); -webkit-app-region: drag; }
  #bar .kind { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; flex: 1; }
  #bar .ws { color: var(--muted); font-size: 11px; }
  button { all: unset; -webkit-app-region: no-drag; cursor: pointer; padding: 5px 10px; border-radius: 7px; font-size: 12px; }
  button:hover { background: rgba(124,196,255,.16); }
  button.primary { background: var(--accent); color: #0d1117; font-weight: 600; }
  #x:hover { background: #b0424a; }
  textarea { display: block; width: 100%; height: calc(100% - 32px - 40px - 22px); resize: none; border: 0; outline: none;
    background: transparent; color: var(--ink); padding: 10px 12px; font: 14px/1.45 inherit; }
  #acts { height: 40px; display: flex; gap: 4px; align-items: center; padding: 0 8px; border-top: 1px solid var(--edge); }
  #status { height: 22px; padding: 3px 10px; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.err { color: #ff9b9b; }
</style>
</head>
<body>
<div id="bar"><span class="kind">Quick type</span><span class="ws" id="ws"></span><button id="x" title="Close (Esc)">✕</button></div>
<textarea id="t" placeholder="Type anything. Ctrl+Enter asks Aither." autofocus></textarea>
<div id="acts">
  <button class="primary" id="ask" title="Ctrl+Enter">Ask Aither</button>
  <button id="note" title="Pin it to the desktop as a sticky note">Sticky note</button>
  <button id="task" title="A task on your project board">Task</button>
  <button id="relay" title="Post to the company room">Relay</button>
  <button id="notes" title="File into Notes">Notes</button>
  <button id="copy">Copy</button>
</div>
<div id="status"></div>
<script>
  const tk = window.toolkit;
  const $ = (id) => document.getElementById(id);
  const status = (text, err) => { $("status").textContent = text; $("status").className = err ? "err" : ""; };
  const verdict = (v) => status(v && v.ok ? (v.answer || v.line || "done") : ((v && (v.error || v.reason)) || "failed"), !(v && v.ok));
  const text = () => $("t").value.trim();
  const need = () => { if (!text()) { status("Type something first.", true); return false; } return true; };
  const payload = () => ({ kind: "text", text: text(), title: text().split("\n")[0].slice(0, 120) });
  if (tk) void tk.info().then((i) => { if (i && i.workspace) $("ws").textContent = i.workspace.name; });
  $("x").onclick = () => tk ? tk.close() : window.close();
  $("ask").onclick = async () => { if (!need()) return; status("Asking…"); verdict(await tk.ask(text(), "")); };
  $("note").onclick = async () => { if (!need()) return; verdict(await tk.call("sticky", { text: text() })); };
  $("task").onclick = async () => { if (!need()) return; verdict(await tk.send("task", payload())); };
  $("relay").onclick = async () => { if (!need()) return; verdict(await tk.send("room", payload())); };
  $("notes").onclick = async () => { if (!need()) return; verdict(await tk.send("notes", payload())); };
  $("copy").onclick = async () => { if (!need()) return; verdict(await tk.copy(payload())); };
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") $("x").onclick();
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $("ask").onclick(); }
  });
</script>
</body>
</html>
