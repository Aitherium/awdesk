<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; script-src 'unsafe-inline'; img-src data:;" />
<title>Aither orb</title>
<link rel="stylesheet" href="aither-tokens.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    font: 13px/1.45 var(--font-sans, system-ui); color: var(--fg, #e6edf3); user-select: none; }

  /* ── the orb (72 px window) ─────────────────────────────────────────── */
  body.orb { position: relative; cursor: default; }
  /* The fairy (owner 2026-11-02: "a soft white, like a fairy"): a small white-hot
     core in a wide soft bloom, two pairs of glassy wings that flutter, a slow bob
     and a twinkle. White by default; an agent's tint only colours the outer halo. */
  #orb { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px;
    margin: -28px 0 0 -28px; border-radius: 50%; cursor: grab; background: transparent;
    animation: bob 3.2s ease-in-out infinite; -webkit-app-region: no-drag; }
  #orb .halo { position: absolute; inset: -8px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255,255,255,0.62) 0%, rgba(236,246,255,0.32) 20%,
      var(--tint-glow, rgba(214,236,255,0.16)) 42%, rgba(255,255,255,0) 70%);
    animation: pulse 2.6s ease-in-out infinite; }
  #orb .core { position: absolute; left: 50%; top: 50%; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px;
    border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 45% 40%, #fff 0%, #fff 42%, rgba(244,250,255,0.85) 70%, rgba(255,255,255,0) 100%);
    box-shadow: 0 0 8px 3px rgba(255,255,255,0.95), 0 0 20px 8px rgba(225,240,255,0.6), 0 0 36px 14px rgba(200,228,255,0.25); }
  #orb .wing { position: absolute; left: 50%; top: 50%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(ellipse at 30% 50%, rgba(255,255,255,0.55), rgba(225,240,255,0.18) 70%, rgba(255,255,255,0.05));
    border: 1px solid rgba(255,255,255,0.45); transform-origin: 0 50%;
    animation: flap 0.16s ease-in-out infinite alternate; }
  #orb .wing.up { width: 15px; height: 8px; margin-top: -9px; }
  #orb .wing.lo { width: 11px; height: 6px; margin-top: 1px; animation-delay: 0.04s; }
  #orb .wing.r.up { transform: rotate(-24deg); } #orb .wing.r.lo { transform: rotate(22deg); }
  #orb .wing.l { transform-origin: 100% 50%; }
  #orb .wing.l.up { margin-left: -15px; transform: rotate(24deg); }
  #orb .wing.l.lo { margin-left: -11px; transform: rotate(-22deg); }
  #orb .spark { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; pointer-events: none;
    box-shadow: 0 0 4px 1px rgba(255,255,255,0.9); opacity: 0; animation: twinkle 2.8s ease-in-out infinite; }
  #orb .spark.a { left: 8px; top: 12px; } #orb .spark.b { right: 6px; top: 30px; animation-delay: 1.1s; }
  #orb .spark.c { left: 22px; bottom: 4px; animation-delay: 1.9s; }
  #orb:active { cursor: grabbing; }
  #orb.busy .halo { animation: pulse 0.9s ease-in-out infinite; }
  #orb.busy .wing { animation-duration: 0.09s; }
  #orb.attached { outline: 0; }
  #orb .halo, #orb .core { transition: transform 0.6s ease, opacity 0.6s ease; }
  #orb.behind .core { transform: scale(0.72); opacity: 0.6; }
  #orb.behind .halo { opacity: 0.45; }
  @keyframes bob { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(3px); } }
  @keyframes pulse { 0%, 100% { opacity: 0.82; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.05); } }
  @keyframes flap { from { scale: 1 1; } to { scale: 0.9 0.35; } }
  @keyframes twinkle { 0%, 70%, 100% { opacity: 0; transform: scale(0.4); } 80% { opacity: 1; transform: scale(1); } }
  @keyframes breathe {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.06); filter: brightness(1.18); }
  }
  #badge { cursor: pointer; position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; background: var(--accent-primary, #7aa2ff); color: #06101f;
    font: 700 11px/18px var(--font-sans, system-ui); text-align: center; display: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.45); pointer-events: none; }
  #badge.on { display: block; }
  #queued { position: absolute; bottom: -2px; right: 0; min-width: 15px; height: 15px; padding: 0 4px;
    border-radius: 8px; background: #3a2a10; color: var(--tint, #f4faff);
    border: 1px solid var(--tint, #f4faff); font: 700 10px/14px var(--font-sans, system-ui);
    text-align: center; display: none; pointer-events: none; }
  #queued.on { display: block; }
  .drop-hover #orb { box-shadow: 0 0 0 2px var(--tint, #f4faff) inset, 0 0 22px 8px var(--tint-glow, rgba(225,240,255,0.7)); }
  .drop-hover #card { border-color: var(--tint, #f4faff); }

  /* ── the agent fairy (agent-fairy.cjs, owner 2026-11-09) ─────────────────
     One palette with Discord and aitherium.com (agent-fairies.json). The core
     always takes the agent's core (Aither: white-gold). While the fairy carries
     an agent's card or speaks for one (#orb.wearing), the bloom and the wings
     take that agent's colour too; swept = Hera's pointed wings, ring = a
     ring-shaped outer glow, sparkles = the owner's glints. */
  #orb .core { background: radial-gradient(circle at 45% 40%, #fff 0%, var(--fairy-core, #fff) 42%,
    rgba(244,250,255,0.85) 70%, rgba(255,255,255,0) 100%); }
  #orb.wearing .halo { background: radial-gradient(circle, rgba(255,255,255,0.62) 0%, var(--fairy-glow-soft) 20%,
    var(--fairy-glow-faint) 46%, rgba(255,255,255,0) 70%); }
  #orb.wearing .core { box-shadow: 0 0 8px 3px rgba(255,255,255,0.95), 0 0 20px 8px var(--fairy-glow-soft),
    0 0 36px 14px var(--fairy-glow-faint); }
  #orb.wearing .wing { background: radial-gradient(ellipse at 30% 50%, rgba(255,255,255,0.55), var(--fairy-wing) 70%,
    rgba(255,255,255,0.05)); border-color: var(--fairy-wing-edge); }
  #orb.swept .wing.up { width: 17px; height: 6px; border-radius: 0 80% 20% 80%; }
  #orb.swept .wing.lo { width: 12px; height: 4px; border-radius: 0 80% 20% 80%; }
  #orb.swept .wing.r.up { transform: rotate(-34deg); } #orb.swept .wing.l.up { margin-left: -17px; transform: rotate(34deg); }
  #orb.swept .wing.l.lo { margin-left: -12px; }
  #orb.ring .halo::after { content: ""; position: absolute; inset: 6px; border-radius: 50%;
    border: 1.5px solid var(--fairy-glow-soft); box-shadow: 0 0 8px var(--fairy-glow-soft); }
  #orb.nosparkle .spark { display: none; }
  /* The swarm (its own window, centred on the fairy): one companion per OTHER
     agent with a card waiting -- every one of them, on rings that grow with the
     count, drawn smaller as more appear; hovering one shows that agent's card. */
  body.swarm { background: transparent; overflow: hidden; }
  #mates { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
  .mate { position: absolute; width: var(--m-size, 10px); height: var(--m-size, 10px);
    margin: calc(var(--m-size, 10px) / -2) 0 0 calc(var(--m-size, 10px) / -2); border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, var(--m-core, #fff) 30%, var(--m-color) 62%, rgba(255,255,255,0) 100%);
    box-shadow: 0 0 6px 2px var(--m-glow); transition: transform 0.12s ease; }
  .mate::before, .mate::after { content: ""; position: absolute; top: 1px; width: 6px; height: 4px; border-radius: 50%;
    background: var(--m-wing); border: 0.5px solid rgba(255,255,255,0.5); animation: flap 0.18s ease-in-out infinite alternate; }
  .mate::before { right: 7px; transform-origin: 100% 50%; } .mate::after { left: 7px; transform-origin: 0 50%; }
  .mate.hot { transform: scale(1.45); }
  .mate b { position: absolute; left: 60%; top: -70%; min-width: 9px; height: 9px; padding: 0 2px; border-radius: 5px;
    background: #0b0f16; color: #fff; border: 1px solid var(--m-color); font: 700 7px/8px var(--font-sans, system-ui);
    text-align: center; }

  /* ── the bubble (392 x 480 window) ──────────────────────────────────── */
  body.bubble { padding: 8px; }
  #card { width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden;
    border-radius: 14px; background: var(--bg-elevated, #12161f); border: 1px solid var(--border, #2a3346);
    box-shadow: 0 12px 40px rgba(0,0,0,0.55); }
  #head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  #dot { width: 10px; height: 10px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #fff, var(--tint, #f4faff) 70%);
    box-shadow: 0 0 8px var(--tint-glow, rgba(225,240,255,0.7)); }
  #title { font-weight: 600; letter-spacing: 0.01em; }
  #where { flex: 1; font-size: 11px; color: var(--fg-muted, #8b96ab); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  #close { border: 0; background: transparent; color: var(--fg-muted, #8b96ab); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 4px 6px; border-radius: 6px; flex: none; }
  #close:hover { background: var(--bg-sunk, #0b0f16); color: var(--fg, #e6edf3); }

  #actions { display: flex; gap: 6px; padding: 0 12px 8px; flex-wrap: wrap; }
  #actions button { flex: 1 1 auto; border: 1px solid var(--border, #2a3346); border-radius: 8px;
    background: var(--bg-sunk, #0b0f16); color: var(--fg, #e6edf3); padding: 6px 8px; cursor: pointer;
    font: 12px var(--font-sans, system-ui); white-space: nowrap; }
  #actions button:hover { border-color: var(--tint, #f4faff); }

  #stage { flex: 1; overflow: auto; padding: 2px 12px 8px; }
  #line { display: none; border-radius: 10px; padding: 10px 12px; background: var(--bg-sunk, #0b0f16);
    border: 1px solid var(--border, #2a3346); white-space: pre-wrap; word-break: break-word;
    user-select: text; line-height: 1.5; }
  #line.on { display: block; }
  #line.error { border-color: var(--accent-danger, #ff6b6b); }
  #line.error #line-title { display: block; color: var(--accent-danger, #ff6b6b); font-weight: 600; margin-bottom: 4px; }
  #line-title { display: none; }
  #line.status { color: var(--fg-muted, #8b96ab); font-style: italic; }
  #meta { display: none; margin-top: 8px; font-size: 11px; color: var(--fg-muted, #8b96ab); }
  #meta.on { display: block; }
  #foot { display: none; gap: 6px; margin-top: 8px; }
  #foot.on { display: flex; }
  #foot button { border: 1px solid var(--border, #2a3346); border-radius: 7px; background: transparent;
    color: var(--fg-muted, #8b96ab); padding: 3px 8px; cursor: pointer; font: 11px var(--font-sans, system-ui); }
  #foot button:hover { color: var(--fg, #e6edf3); border-color: var(--accent-primary, #7aa2ff); }
  #foot button.active { color: #06101f; background: var(--accent-primary, #7aa2ff); border-color: transparent; }
  #empty { color: var(--fg-muted, #8b96ab); padding: 6px 2px; font-size: 12px; }
  #empty.off { display: none; }

  /* held thing: a chip under the orb, draggable out as a real OS file */
  #hold { display: none; margin-top: 8px; border-radius: 10px; border: 1px solid var(--tint, #f4faff);
    background: var(--bg-sunk, #0b0f16); padding: 8px 10px; }
  #hold.on { display: block; }
  #hold-top { display: flex; align-items: center; gap: 8px; }
  #hold-grip { cursor: grab; color: var(--tint, #f4faff); font-size: 15px; line-height: 1; padding: 2px 2px;
    -webkit-user-drag: element; user-select: none; }
  #hold-grip:active { cursor: grabbing; }
  #hold-label { flex: 1; font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hold-sub { font-size: 10.5px; color: var(--fg-muted, #8b96ab); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; margin: 2px 0 6px 25px; }
  #hold-actions { display: flex; gap: 5px; flex-wrap: wrap; margin-left: 25px; }
  #hold-actions button { border: 1px solid var(--border, #2a3346); border-radius: 7px; background: transparent;
    color: var(--fg, #e6edf3); padding: 3px 8px; cursor: pointer; font: 11px var(--font-sans, system-ui); }
  #hold-actions button:hover { border-color: var(--tint, #f4faff); }

  /* pick list: top five + N more */
  #results { display: none; margin-top: 8px; }
  #results.on { display: block; }
  #results-head { display: flex; gap: 8px; align-items: baseline; font-size: 11px;
    color: var(--fg-muted, #8b96ab); margin-bottom: 5px; }
  #results-title { flex: 1; color: var(--fg, #e6edf3); font-weight: 600; font-size: 12px; }
  #rows { display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; gap: 6px; align-items: center; border: 1px solid var(--border, #2a3346);
    border-radius: 8px; padding: 5px 7px; text-align: left; background: transparent; color: var(--fg, #e6edf3);
    cursor: pointer; font: 12px var(--font-sans, system-ui); }
  .row:hover { border-color: var(--tint, #f4faff); background: var(--bg-sunk, #0b0f16); }
  .row-main { flex: 1; min-width: 0; }
  .row-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sub { display: block; font-size: 10.5px; color: var(--fg-muted, #8b96ab);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-open { border: 1px solid var(--border, #2a3346); border-radius: 6px; background: transparent;
    color: var(--fg-muted, #8b96ab); cursor: pointer; font: 10.5px var(--font-sans, system-ui); padding: 2px 6px; }
  .row-open:hover { color: var(--fg, #e6edf3); border-color: var(--accent-primary, #7aa2ff); }
  #results-more { margin-top: 5px; font-size: 11px; color: var(--fg-muted, #8b96ab); }

  /* the visible trip log */
  #trips { display: none; margin-top: 10px; border-top: 1px solid var(--border, #2a3346); padding-top: 7px; }
  #trips.on { display: block; }
  #trips-head { font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--fg-muted, #8b96ab); margin-bottom: 4px; }
  #trip-list { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--fg-muted, #8b96ab); }
  .trip { display: flex; gap: 6px; align-items: baseline; }
  .trip-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tint, #f4faff); flex: none; }
  .trip.bad .trip-dot { background: var(--accent-danger, #ff6b6b); }
  .trip-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #trip-more { font-size: 10.5px; color: var(--fg-muted, #8b96ab); margin-top: 2px; }
  #trip-queue { font-size: 11px; color: var(--tint, #f4faff); margin-top: 4px; }

  #ask { display: flex; gap: 6px; padding: 8px 12px 12px; border-top: 1px solid var(--border, #2a3346); }
  #q { flex: 1; resize: none; max-height: 84px; min-height: 30px; padding: 6px 8px; border-radius: 8px;
    border: 1px solid var(--border, #2a3346); background: var(--bg, #0d1117); color: var(--fg, #e6edf3);
    font: 12.5px/1.4 var(--font-sans, system-ui); outline: none; }
  #q:focus { border-color: var(--tint, #f4faff); }
  #send { border: 0; border-radius: 8px; padding: 0 12px; background: var(--tint, #f4faff);
    color: #06101f; font-weight: 600; cursor: pointer; font: 600 12px var(--font-sans, system-ui); }
  #send:disabled { opacity: 0.5; cursor: default; }
  #hint { display: none; padding: 0 12px 6px; font-size: 11px; color: var(--accent-danger, #ff6b6b); }
  #hint.on { display: block; }

  /* ── the fairy asking for attention (fairy-attention.cjs ladder) ─────
     L1 glow: a slow sonar ping and a brighter halo where it rests.
     L2 flutter: faster wings and ping (it has flown to the owner's eye line).
     L3 insist: warm amber, fastest -- the "you said you need this" level. */
  #orb .ping { position: absolute; inset: 6px; border-radius: 50%; pointer-events: none;
    border: 2px solid rgba(255,255,255,0.85); opacity: 0; }
  #orb.nudge1 .halo { animation: pulse 1.2s ease-in-out infinite; }
  #orb.nudge1 .ping { animation: ping 2.4s ease-out infinite; }
  #orb.nudge2 .halo { animation: pulse 0.8s ease-in-out infinite; }
  #orb.nudge2 .wing { animation-duration: 0.07s; }
  #orb.nudge2 .ping { animation: ping 1.4s ease-out infinite; }
  #orb.nudge3 .halo { animation: pulse 0.55s ease-in-out infinite;
    background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,226,170,0.45) 22%,
      rgba(255,190,100,0.28) 44%, rgba(255,255,255,0) 70%); }
  #orb.nudge3 .wing { animation-duration: 0.05s; }
  #orb.nudge3 .ping { border-color: rgba(255,204,128,0.95); animation: ping 0.9s ease-out infinite; }
  #orb.nudge3 .core { box-shadow: 0 0 8px 3px rgba(255,255,255,0.95), 0 0 20px 8px rgba(255,214,150,0.7),
    0 0 36px 14px rgba(255,190,100,0.35); }
  @keyframes ping { 0% { transform: scale(0.5); opacity: 0.9; } 100% { transform: scale(1.22); opacity: 0; } }

  /* ── the whisper (376 x 188 window): the card the fairy carries ─────── */
  body.nudge { padding: 10px; }
  #nudge { position: relative; width: 100%; overflow: hidden; border-radius: 14px;
    background: rgba(14,18,27,0.95); border: 1px solid rgba(244,250,255,0.28);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 16px rgba(225,240,255,0.16);
    padding: 9px 12px 9px; opacity: 0; transform: translateX(-12px) scale(0.98);
    transition: opacity 0.22s ease, transform 0.22s ease; }
  #nudge.left { transform: translateX(12px) scale(0.98); }
  #nudge.on { opacity: 1; transform: none; }
  #nudge.lv2 { border-color: rgba(244,250,255,0.5); animation: nglow 1.8s ease-in-out infinite; }
  #nudge.lv3 { border-color: rgba(255,200,120,0.8); animation: nglow3 1.1s ease-in-out infinite; }
  @keyframes nglow { 0%, 100% { box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 12px rgba(225,240,255,0.16); }
    50% { box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 26px rgba(225,240,255,0.42); } }
  @keyframes nglow3 { 0%, 100% { box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 12px rgba(255,190,100,0.25); }
    50% { box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 28px rgba(255,190,100,0.6); } }
  #n-head { display: flex; align-items: center; gap: 7px; font-size: 10.5px; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--fg-muted, #8b96ab); }
  #n-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #fff;
    box-shadow: 0 0 8px rgba(225,240,255,0.9); }
  #nudge.lv3 #n-dot { background: #ffd28a; box-shadow: 0 0 9px rgba(255,190,100,0.95); }
  #n-lead { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #n-more { cursor: pointer; text-transform: none; letter-spacing: 0; border-radius: 6px; padding: 1px 6px;
    white-space: nowrap; }
  #n-more:hover { color: var(--fg, #e6edf3); background: rgba(255,255,255,0.07); }
  #n-x { border: 0; background: transparent; color: var(--fg-muted, #8b96ab); cursor: pointer; font-size: 12px;
    line-height: 1; padding: 3px 5px; border-radius: 6px; flex: none; }
  #n-x:hover { background: rgba(255,255,255,0.07); color: var(--fg, #e6edf3); }
  #n-title { margin-top: 4px; font-weight: 600; font-size: 13.5px; line-height: 1.3; color: var(--fg, #e6edf3);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #n-why { margin-top: 3px; font-size: 11.5px; line-height: 1.35; color: #c4cfe2;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* What the card says (owner 2026-11-08: "give me more fucking info"). */
  #n-sum { margin-top: 6px; font-size: 12px; line-height: 1.4; color: var(--fg, #e6edf3);
    white-space: pre-line; overflow-wrap: anywhere; }
  #n-facts { margin: 5px 0 0; padding-left: 16px; font-size: 11.5px; line-height: 1.4; color: #c4cfe2; }
  #n-facts li { white-space: pre-line; overflow-wrap: anywhere; margin-top: 2px; }
  #n-acts button .cons { display: block; font-size: 10.5px; font-weight: 400; opacity: 0.72; margin-top: 2px; }
  /* Owner 2026-11-08: "I need to see what the whole buttons say". Full labels, wrapped;
     the whisper window grows to fit (nudgeAct "size"). Never an ellipsis on a choice. */
  #n-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #n-acts button { flex: 1 1 auto; min-width: 0; max-width: 100%; white-space: normal; text-align: left;
    line-height: 1.3; overflow-wrap: anywhere;
    border: 1px solid var(--border, #2a3346); border-radius: 8px; background: var(--bg-sunk, #0b0f16);
    color: var(--fg, #e6edf3); padding: 5px 9px; cursor: pointer; font: 12px var(--font-sans, system-ui); }
  #n-acts button:hover { border-color: rgba(244,250,255,0.7); }
  #n-acts button.rec { border-color: rgba(244,250,255,0.55); }
  #n-acts button.primary { background: #f4faff; color: #06101f; border-color: transparent; font-weight: 600; }
  #n-foot { display: flex; gap: 9px; margin-top: 7px; white-space: nowrap; overflow: hidden; }
  #n-foot button { border: 0; background: transparent; color: var(--fg-muted, #8b96ab); padding: 0; cursor: pointer;
    font: 10.5px var(--font-sans, system-ui); }
  #n-foot button:hover { color: var(--fg, #e6edf3); text-decoration: underline; }
  #n-flash { display: none; margin-top: 8px; font-size: 12px; color: #bfe8c8; }
  #n-flash.on { display: block; }
  #n-flash.error { color: var(--accent-danger, #ff6b6b); }
  /* A card's generated UI (A2UI v0.9 subset, card-ui.cjs): Column/Row/Text/Button.
     Buttons are full width and WRAP, exactly like #n-acts: never an ellipsis. */
  #n-ui { display: none; margin-top: 4px; max-height: 380px; overflow-y: auto; }
  #n-ui.on { display: block; }
  #n-ui .u-col { display: flex; flex-direction: column; gap: 5px; align-items: stretch; }
  #n-ui .u-col.a-start { align-items: flex-start; } #n-ui .u-col.a-center { align-items: center; }
  #n-ui .u-col.a-end { align-items: flex-end; }
  #n-ui .u-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
  #n-ui .u-row.j-spaceBetween { justify-content: space-between; } #n-ui .u-row.j-center { justify-content: center; }
  #n-ui .u-row.j-end { justify-content: flex-end; }
  #n-ui .u-text { font-size: 12px; line-height: 1.35; color: #c4cfe2; overflow-wrap: anywhere; white-space: pre-wrap; }
  #n-ui .u-text.v-h1, #n-ui .u-text.v-h2, #n-ui .u-text.v-h3, #n-ui .u-text.v-h4, #n-ui .u-text.v-h5 {
    font-weight: 600; font-size: 13.5px; line-height: 1.3; color: var(--fg, #e6edf3); }
  #n-ui .u-text.v-caption { font-size: 11px; color: var(--fg-muted, #8b96ab); }
  #n-ui button { width: 100%; min-width: 0; white-space: normal; text-align: left; line-height: 1.3;
    overflow-wrap: anywhere; border: 1px solid var(--border, #2a3346); border-radius: 8px;
    background: var(--bg-sunk, #0b0f16); color: var(--fg, #e6edf3); padding: 5px 9px; cursor: pointer;
    font: 12px var(--font-sans, system-ui); }
  #n-ui button:hover { border-color: rgba(244,250,255,0.7); }
  #n-ui button.primary { background: #f4faff; color: #06101f; border-color: transparent; font-weight: 600; }
  #n-ui button.borderless { border-color: rgba(244,250,255,0.18); }
  #nudge.done #n-acts, #nudge.done #n-foot, #nudge.done #n-ui { display: none; }
  /* talking: the options stay clickable, the foot gives its line to "Listening..." */
  #nudge.talking #n-foot { display: none; }

  /* ── the veil (transparent overlay: trail + tether) ─────────────────── */
  body.veil { background: transparent; }
  #veil { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
<script>
  const api = window.aitherOrb;
  const params = new URLSearchParams(location.search);
  const view = ["bubble", "veil", "nudge", "swarm"].includes(params.get("view")) ? params.get("view") : "orb";
  document.body.className = view;
  // All three windows load this page; each shape names itself.
  document.title = view === "bubble" ? "Ask Aither" : view === "veil" ? "Aither spirit trail"
    : view === "nudge" ? "Aither nudge" : view === "swarm" ? "Aither swarm" : "Aither spirit";

  function rgba(hex, alpha) {
    const h = String(hex || "#ffc861").replace("#", "");
    const full = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
    const n = parseInt(full.slice(0, 6), 16);
    if (!Number.isFinite(n)) return `rgba(255,200,97,${alpha})`;
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
  }
  function applyTint(css) {
    const el = document.documentElement;
    el.style.setProperty("--tint", css || "#f4faff");
    el.style.setProperty("--tint-soft", rgba(css, 0.85));
    el.style.setProperty("--tint-deep", rgba(css, 0.7));
    el.style.setProperty("--tint-glow", css ? rgba(css, 0.18) : "rgba(214,236,255,0.16)");
  }

  // ── veil: the flight trail and the tether ─────────────────────────────
  if (view === "veil") {
    document.body.innerHTML = '<canvas id="veil"></canvas>';
    const canvas = document.getElementById("veil");
    const ctx = canvas.getContext("2d");
    let state = { width: 0, height: 0, tint: "#ffc861", trail: [], tether: null };
    let lastKey = "";
    let frame = 0;
    function sizeTo(s) {
      const dpr = window.devicePixelRatio || 1;
      state.width = Number(s.width) || window.innerWidth;
      state.height = Number(s.height) || window.innerHeight;
      const w = Math.max(1, Math.round(state.width * dpr));
      const h = Math.max(1, Math.round(state.height * dpr));
      // Reassigning width/height REALLOCATES the whole backing store. At the old
      // 60 Hz payload rate on a desktop-sized veil that was ~100 MB per frame, and
      // the GPU process grew until it died (2026-11-07). Only resize when the
      // pixel size actually changed.
      if (w !== canvas.width || h !== canvas.height) {
        canvas.width = w;
        canvas.height = h;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      const cssW = `${state.width}px`;
      const cssH = `${state.height}px`;
      if (canvas.style.width !== cssW) canvas.style.width = cssW;
      if (canvas.style.height !== cssH) canvas.style.height = cssH;
    }
    function scheduleDraw() {
      if (frame) return;
      frame = window.requestAnimationFrame(() => { frame = 0; draw(); });
    }
    function draw() {
      ctx.clearRect(0, 0, state.width, state.height);
      const pts = state.trail || [];
      if (pts.length > 1) {
        for (let i = 1; i < pts.length; i += 1) {
          const t = i / pts.length;
          ctx.beginPath();
          ctx.strokeStyle = rgba(state.tint, 0.06 + 0.4 * t);
          ctx.lineWidth = 1.5 + 3.5 * t;
          ctx.lineCap = "round";
          ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
          ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();
        }
        const last = pts[pts.length - 1];
        ctx.beginPath();
        ctx.fillStyle = rgba(state.tint, 0.55);
        ctx.arc(last.x, last.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      if (state.tether && state.tether.length === 2) {
        const [a, b] = state.tether;
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([3, 5]);
        ctx.strokeStyle = rgba(state.tint, 0.34);
        ctx.lineWidth = 1.2;
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.restore();
      }
    }
    api.onVeil((s) => {
      if (!s) {
        state.trail = [];
        state.tether = null;
        lastKey = "";
        draw();
        return;
      }
      sizeTo(s);
      state.tint = s.tint || state.tint;
      state.trail = Array.isArray(s.trail) ? s.trail : [];
      state.tether = Array.isArray(s.tether) ? s.tether : null;
      const key = `${state.width}x${state.height}|${state.tint}|${state.trail.length}`
        + `|${state.trail.length ? `${state.trail[0].x},${state.trail[0].y},${state.trail[state.trail.length - 1].x},${state.trail[state.trail.length - 1].y}` : ""}`
        + `|${state.tether ? state.tether.map((p) => `${p.x},${p.y}`).join(";") : ""}`;
      if (key === lastKey) return; // nothing moved: do not repaint, do not allocate
      lastKey = key;
      scheduleDraw(); // one paint per display frame, however many payloads arrive
    });
    api.init().then((s) => { if (s && s.tint) { state.tint = s.tint.css || state.tint; applyTint(state.tint); } });
  }

  // ── the orb disc ──────────────────────────────────────────────────────
  if (view === "orb") {
    document.body.innerHTML = '<div id="orb" title="Aither — click to open, drag onto a window or avatar to attach, right-click for the menu">'
      + '<i class="halo"></i><i class="wing l up"></i><i class="wing r up"></i><i class="wing l lo"></i><i class="wing r lo"></i>'
      + '<i class="core"></i><i class="spark a"></i><i class="spark b"></i><i class="spark c"></i><i class="ping"></i></div>'
      + '<div id="badge"></div><div id="queued"></div>';
    const orb = document.getElementById("orb");
    const badge = document.getElementById("badge");
    const queued = document.getElementById("queued");
    const RADIUS = 30; // a little past the 28 px disc: forgiving, never the corners
    let inside = null;
    let downAt = null;

    function toggleHit(isInside) {
      if (isInside === inside) return;
      inside = isInside;
      api.hit(isInside);
    }
    // ── the agent fairy: its colours, and the companions orbiting it ───
    function wearFairy(f) {
      if (!f || !f.color) return;
      const el = document.documentElement;
      el.style.setProperty("--fairy-core", f.core || "#ffffff");
      el.style.setProperty("--fairy-glow-soft", rgba(f.glow || f.color, 0.42));
      el.style.setProperty("--fairy-glow-faint", rgba(f.glow || f.color, 0.2));
      el.style.setProperty("--fairy-wing", rgba(f.color, 0.34));
      el.style.setProperty("--fairy-wing-edge", rgba(f.color, 0.6));
      const resting = !f.agent || f.agent === "aither";
      orb.classList.toggle("wearing", !resting);
      orb.classList.toggle("swept", f.wings === "swept");
      orb.classList.toggle("ring", Boolean(f.ring));
      orb.classList.toggle("nosparkle", !f.sparkles && !resting);
      orb.dataset.agent = f.agent || "";
    }
    window.addEventListener("mousemove", (e) => {
      const dx = e.clientX - window.innerWidth / 2;
      const dy = e.clientY - window.innerHeight / 2;
      toggleHit(Math.hypot(dx, dy) <= RADIUS);
    });
    window.addEventListener("mouseleave", () => toggleHit(false));
    if (api.onFairy) api.onFairy(wearFairy);

    orb.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      downAt = { x: e.screenX, y: e.screenY };
      try { orb.setPointerCapture(e.pointerId); } catch { /* capture is a nicety */ }
      api.dragStart();
    });
    function up(e) {
      if (!downAt) return;
      const dx = (e.screenX || 0) - downAt.x;
      const dy = (e.screenY || 0) - downAt.y;
      const moved = Math.hypot(dx, dy) > 4;
      downAt = null;
      api.dragEnd().then((r) => {
        // A press that did not move is a CLICK: open/close, or cancel a trip.
        if (!moved || (r && r.click)) api.click();
      });
    }
    orb.addEventListener("pointerup", up);
    orb.addEventListener("pointercancel", () => { if (downAt) { downAt = null; api.dragEnd(); } });
    orb.addEventListener("contextmenu", (e) => { e.preventDefault(); api.menu(); });
    // Esc mid-trip cancels and brings the spirit home; otherwise it hides.
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      api.cancelTrip().then((r) => { if (!r || !r.ok) api.hide(); });
    });

    api.onBadge((n) => {
      badge.textContent = String(n);
      badge.classList.toggle("on", Number(n) > 0);
    });
    // Click the count -> the Inbox list. The orb's own press/drag must not see
    // this click (it would toggle the bubble underneath).
    badge.addEventListener("pointerdown", (e) => { e.stopPropagation(); });
    badge.addEventListener("click", (e) => {
      e.stopPropagation();
      if (Number(badge.textContent) > 0) api.needsYou();
    });
    api.onBusy((busy) => orb.classList.toggle("busy", Boolean(busy)));
    // The attention ladder: 0 = resting, 1 glow, 2 flutter, 3 insist.
    function setNudge(level) {
      for (const n of [1, 2, 3]) orb.classList.toggle(`nudge${n}`, Number(level) === n);
    }
    // The nudge chime (fairy-attention chimePattern): synthesized, no audio files.
    // Main sends a pattern only when sounds are on and the desk is not muted.
    let audio = null;
    function chime(notes) {
      if (!Array.isArray(notes) || !notes.length) return;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audio) audio = new Ctx();
        if (audio.state === "suspended") audio.resume();
        const t0 = audio.currentTime + 0.02;
        for (const n of notes.slice(0, 4)) {
          const osc = audio.createOscillator();
          const amp = audio.createGain();
          const start = t0 + Math.max(0, Number(n.at) || 0);
          const dur = Math.min(1.5, Math.max(0.05, Number(n.dur) || 0.3));
          const peak = Math.min(0.2, Math.max(0, Number(n.gain) || 0.05));
          osc.type = "sine";
          osc.frequency.setValueAtTime(Math.min(4000, Math.max(100, Number(n.freq) || 880)), start);
          amp.gain.setValueAtTime(0.0001, start);
          amp.gain.exponentialRampToValueAtTime(peak, start + 0.015);
          amp.gain.exponentialRampToValueAtTime(0.0001, start + dur);
          osc.connect(amp).connect(audio.destination);
          osc.start(start);
          osc.stop(start + dur + 0.05);
        }
      } catch { /* no audio device: the glow still carries the nudge */ }
    }
    if (api.onNudge) api.onNudge((x) => { setNudge(x && x.level); if (x && x.chime) chime(x.chime); });
    if (api.onDepth) api.onDepth((d) => orb.classList.toggle("behind", Boolean(d && d.front < 0)));
    api.onTint((t) => { if (t) applyTint(t.css); });
    // The fairy IS the owner's sprite: its name, stage and mood on hover. null =
    // the plain fairy (signed out / offline), which keeps the plain tooltip.
    const PLAIN_TIP = orb.title;
    function wearSprite(sp) { orb.title = sp && sp.tooltip ? sp.tooltip : PLAIN_TIP; orb.dataset.tip = orb.title; }
    if (api.onSprite) api.onSprite(wearSprite);
    api.onAttach((a) => { orb.classList.toggle("attached", Boolean(a && a.attached)); });
    api.onTrips((t) => {
      const n = t && Number(t.count) > 1 ? Number(t.count) - 1 : 0; // the running one is the orb itself
      queued.textContent = String(n);
      queued.classList.toggle("on", n > 0);
    });
    api.init().then((s) => {
      if (!s) return;
      if (s.badge) { badge.textContent = String(s.badge); badge.classList.toggle("on", s.badge > 0); }
      if (s.tint) applyTint(s.tint.css);
      wearSprite(s.sprite);
      if (s.attach) orb.classList.add("attached");
      if (s.nudgeLevel) setNudge(s.nudgeLevel);
      if (s.fairy) wearFairy(s.fairy);
      const n = s.trips && s.trips.count > 1 ? s.trips.count - 1 : 0;
      queued.textContent = String(n);
      queued.classList.toggle("on", n > 0);
    });
  }

  // ── the swarm: every companion fairy, on rings (agent-fairy.cjs) ──────────
  // Its own click-through window centred on the fairy (orb-window placeSwarm).
  // A companion under the pointer makes the window hit-testable and peeks that
  // agent's card; everywhere else, clicks pass to the desktop.
  if (view === "swarm") {
    document.body.innerHTML = '<div id="mates"></div>';
    const matesEl = document.getElementById("mates");
    let mates = [];
    let hotMate = null;
    let inside = false;
    let frame = 0;
    // The ring layout agent-fairy.swarmLayout computes: 6 on the first ring, 4 more
    // on each ring out; 10 px, a quarter pixel smaller per companion past six.
    function layout(n) {
      const size = Math.max(6, 10 - 0.25 * Math.max(0, n - 6));
      const hit = Math.max(12, size + 4);
      const slots = [];
      let ring = 0;
      let left = n;
      while (left > 0) {
        const on = Math.min(6 + ring * 4, left);
        for (let i = 0; i < on; i += 1) slots.push({ ring, radius: 24 + ring * 16, index: i, of: on, size, hit });
        left -= on;
        ring += 1;
      }
      return slots;
    }
    function offset(slot, now) {
      const dir = slot.ring % 2 === 0 ? 1 : -1;
      const turn = (now / (9000 + slot.ring * 3000)) * dir;
      const a = 2 * Math.PI * (slot.index / Math.max(1, slot.of)) + 2 * Math.PI * turn + slot.ring * 0.4;
      return { x: Math.round(Math.cos(a) * slot.radius), y: Math.round(Math.sin(a) * slot.radius * 0.82) };
    }
    function place() {
      frame = 0;
      if (!mates.length) return;
      const now = Date.now();
      for (const m of mates) {
        const o = offset(m.slot, now);
        m.el.style.left = `${o.x}px`;
        m.el.style.top = `${o.y}px`;
        m.x = o.x;
        m.y = o.y;
      }
      frame = window.setTimeout(place, 50); // 20 fps is plenty for a slow lap
    }
    function setMates(list) {
      matesEl.textContent = "";
      if (frame) { window.clearTimeout(frame); frame = 0; }
      hotMate = null;
      const items = Array.isArray(list) ? list : [];
      const slots = layout(items.length);
      mates = items.map((c, i) => {
        const el = document.createElement("i");
        el.className = "mate";
        el.dataset.agent = String(c.agent || "");
        el.style.setProperty("--m-size", `${slots[i].size}px`);
        el.style.setProperty("--m-color", rgba(c.color, 0.95));
        el.style.setProperty("--m-core", c.core || "#ffffff");
        el.style.setProperty("--m-glow", rgba(c.glow || c.color, 0.55));
        el.style.setProperty("--m-wing", rgba(c.color, 0.4));
        if (Number(c.count) > 1) {
          const badge = document.createElement("b");
          badge.textContent = String(Number(c.count));
          el.append(badge);
        }
        matesEl.append(el);
        const extra = Number(c.count) > 1 ? ` (${Number(c.count)} cards)` : "";
        return { el, slot: slots[i], x: 0, y: 0, id: String(c.cardId || ""), tip: `${c.label || c.agent}: ${c.title || "a card"}${extra}` };
      });
      place();
    }
    function mateAt(dx, dy) {
      let best = null;
      let bestD = Infinity;
      for (const m of mates) {
        const d = Math.hypot(dx - m.x, dy - m.y);
        if (d <= m.slot.hit / 2 + 2 && d < bestD) { best = m; bestD = d; }
      }
      return best;
    }
    function setInside(next) {
      if (next === inside) return;
      inside = next;
      api.swarmHit(next);
    }
    window.addEventListener("mousemove", (e) => {
      const m = mateAt(e.clientX - window.innerWidth / 2, e.clientY - window.innerHeight / 2);
      if (m !== hotMate) {
        if (hotMate) hotMate.el.classList.remove("hot");
        hotMate = m;
        if (m) {
          m.el.classList.add("hot");
          document.body.title = m.tip;
          api.peek(m.id); // that agent's card, beside the fairy
        } else {
          document.body.title = "";
        }
      }
      setInside(Boolean(m));
    });
    window.addEventListener("mouseleave", () => {
      if (hotMate) { hotMate.el.classList.remove("hot"); hotMate = null; }
      setInside(false);
    });
    api.onCompanions(setMates);
    api.init().then((s) => { if (s && s.companions) setMates(s.companions); });
  }

  // ── the whisper: the card the fairy carries (fairy-attention.cjs) ──────
  // Never focused (the window is focusable:false) and click-through until the
  // pointer is ON the card: main flips hit testing when this page says so.
  if (view === "nudge") {
    document.body.innerHTML = '<div id="nudge">'
      + '<div id="n-head"><span id="n-dot"></span><span id="n-lead"></span>'
      + '<span id="n-more" title="See everything that is waiting"></span>'
      + '<button id="n-x" title="Later: I will bring it back in an hour">&#10005;</button></div>'
      + '<div id="n-title"></div><div id="n-why"></div><div id="n-sum"></div><ul id="n-facts"></ul>'
      + '<div id="n-ui"></div><div id="n-acts"></div>'
      + '<div id="n-foot"><button data-act="read">Read it to me</button>'
      + '<button data-act="talk" title="Talk it through out loud: say an option, or what to do instead">Talk</button>'
      + '<button data-act="chat" title="Chat with the fairy about this card (also Alt+Space)">Chat</button>'
      + '<button data-act="keep" title="It matters: nudge harder until it is done">Keep nudging me</button>'
      + '<button data-act="mute" title="Leave it on the badge">Stop nudging this</button></div>'
      + '<div id="n-flash"></div></div>';
    const box = document.getElementById("nudge");
    const leadEl = document.getElementById("n-lead");
    const moreEl = document.getElementById("n-more");
    const titleEl = document.getElementById("n-title");
    const whyEl = document.getElementById("n-why");
    const actsEl = document.getElementById("n-acts");
    const uiEl = document.getElementById("n-ui");
    const flashEl = document.getElementById("n-flash");
    let inside = false;
    function setInside(next) {
      if (next === inside) return;
      inside = next;
      api.nudgeAct("hover", next);
    }
    window.addEventListener("mousemove", (e) => {
      const r = box.getBoundingClientRect();
      setInside(box.classList.contains("on")
        && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom);
    });
    window.addEventListener("mouseleave", () => setInside(false));
    function button(label, cls, onClick, tip) {
      const b = document.createElement("button");
      b.textContent = label;
      if (cls) b.className = cls;
      if (tip) b.title = tip;
      b.addEventListener("click", (e) => { e.stopPropagation(); onClick(); });
      return b;
    }
    // The card's generated UI: a render tree main built and validated
    // (card-ui.cjs). DOM APIs only -- createElement/textContent, never innerHTML --
    // and a button reports ONLY its key; main re-checks it against the card's
    // options before anything is answered. Any surprise = null = today's layout.
    // `shown`: what the whisper already printed above (title, summary, facts) --
    // a generated Text repeating one is skipped (undefined), not drawn twice.
    function alreadyShown(text, shown) {
      const t = text.replace(/[ \t]+\n/g, "\n").trim();
      return shown.some((s) => s && (s === t || (s.endsWith("…") && t.startsWith(s.slice(0, -1)))));
    }
    // undefined = skip this node; null = the tree cannot be drawn (fall back).
    function uiNode(n, depth, keys, shown) {
      if (!n || typeof n !== "object" || depth > 8) return null;
      if (n.type === "text" && typeof n.text === "string") {
        if (alreadyShown(n.text, shown)) return undefined;
        const t = document.createElement("div");
        t.className = `u-text v-${/^(h[1-5]|body|caption)$/.test(n.variant) ? n.variant : "body"}`;
        t.textContent = n.text;
        return t;
      }
      if (n.type === "button" && typeof n.text === "string" && keys.includes(n.key)) {
        const cls = n.variant === "primary" ? "primary" : n.variant === "borderless" ? "borderless" : "";
        return button(n.text, cls, () => api.nudgeAct("answer", n.key), "");
      }
      if ((n.type === "column" || n.type === "row") && Array.isArray(n.children)) {
        const el = document.createElement("div");
        el.className = n.type === "row"
          ? `u-row j-${/^(spaceBetween|center|end)$/.test(n.justify) ? n.justify : "start"}`
          : `u-col a-${/^(start|center|end)$/.test(n.align) ? n.align : "stretch"}`;
        for (const c of n.children) {
          const child = uiNode(c, depth + 1, keys, shown);
          if (child === null) return null;
          if (child) el.append(child);
        }
        return el.childNodes.length || depth === 0 ? el : undefined;
      }
      return null;
    }
    function renderUi(v) {
      uiEl.textContent = "";
      uiEl.classList.remove("on");
      if (!v.ui || v.credential) return false;
      // Every key the CARD offers (the whisper's own option list is capped at 4).
      const keys = Array.isArray(v.uiKeys) ? v.uiKeys.filter((k) => typeof k === "string") : [];
      const shown = [v.title, v.summary, ...(v.facts || [])].filter((x) => typeof x === "string");
      const tree = uiNode(v.ui, 0, keys, shown);
      if (!tree || !tree.querySelector("button")) return false;
      uiEl.append(tree);
      uiEl.classList.add("on");
      return true;
    }
    function render(v) {
      if (!v) {
        box.classList.remove("on", "done");
        setInside(false);
        return;
      }
      box.className = `lv${Number(v.level) || 1}${v.side === "left" ? " left" : ""}`;
      leadEl.textContent = v.lead || "Waiting on you";
      // The dot is the fairy of the agent whose card this is (agent-fairy.cjs).
      const dot = document.getElementById("n-dot");
      const who = v.agent && v.agent.known && v.agent.agent !== "aither" ? v.agent : null;
      dot.style.background = who ? who.color : "";
      dot.style.boxShadow = who ? `0 0 8px ${rgba(who.glow || who.color, 0.9)}` : "";
      dot.title = who ? who.label : "";
      moreEl.textContent = v.more > 0 ? `+${v.more} more` : "";
      moreEl.style.display = v.more > 0 ? "" : "none";
      titleEl.textContent = v.title || "";
      titleEl.title = v.title || "";
      whyEl.textContent = v.why || "";
      whyEl.style.display = v.why ? "" : "none";
      const sumEl = document.getElementById("n-sum");
      const factsEl = document.getElementById("n-facts");
      sumEl.textContent = v.summary || "";
      sumEl.style.display = v.summary ? "" : "none";
      factsEl.textContent = "";
      for (const f of v.facts || []) {
        const li = document.createElement("li");
        li.textContent = f;
        factsEl.append(li);
      }
      factsEl.style.display = (v.facts || []).length ? "" : "none";
      actsEl.textContent = "";
      // The generated surface draws the answers; title, summary and facts stay
      // above it (its own copies of them are skipped in uiNode).
      if (renderUi(v)) {
        actsEl.append(button("Open", "", () => api.nudgeAct("open"), "Open the whole card"));
      } else if (v.credential) {
        actsEl.append(button("Enter it", "primary", () => api.nudgeAct("open"), "Opens the masked field in your Inbox"));
      } else {
        for (const o of v.options || []) {
          const b = button(o.label, o.recommended ? "rec" : "", () => api.nudgeAct("answer", o.key),
            o.consequence || (o.recommended ? "Suggested" : ""));
          // What pressing it DOES, visible -- not hidden in a hover tooltip.
          if (o.consequence) {
            const c = document.createElement("span");
            c.className = "cons";
            c.textContent = o.consequence;
            b.append(c);
          }
          actsEl.append(b);
        }
        actsEl.append(button("Open", (v.options || []).length ? "" : "primary", () => api.nudgeAct("open"), "Open the whole card"));
      }
      flashEl.textContent = "";
      flashEl.className = "";
      box.classList.remove("talking");
      requestAnimationFrame(() => {
        box.classList.add("on");
        // Tell main how tall the card really is, so long labels are never clipped.
        api.nudgeAct("size", String(Math.ceil(box.getBoundingClientRect().height + 20)));
      });
    }
    moreEl.addEventListener("click", (e) => { e.stopPropagation(); api.nudgeAct("more"); });
    document.getElementById("n-x").addEventListener("click", (e) => { e.stopPropagation(); api.nudgeAct("later"); });
    for (const b of document.querySelectorAll("#n-foot button")) {
      b.addEventListener("click", (e) => { e.stopPropagation(); api.nudgeAct(b.dataset.act); });
    }
    api.onNudgeView(render);
    api.onNudgeFlash((f) => {
      if (!f) return;
      flashEl.textContent = String(f.text || "");
      flashEl.className = f.error ? "on error" : "on";
      // A confirmation replaces the buttons; an error keeps them (Open still works);
      // a "keep" line (Listening...) keeps the options while the owner talks.
      box.classList.toggle("done", !f.error && !f.keep);
      box.classList.toggle("talking", Boolean(f.keep));
    });
    api.init().then((s) => { if (s && s.nudge) render(s.nudge); });
  }

  // ── the bubble card ───────────────────────────────────────────────────
  if (view === "bubble") {
    document.body.innerHTML = `
      <div id="card">
        <div id="head"><span id="dot"></span><span id="title">Aither</span>
          <span id="where"></span>
          <button id="close" title="Close (Esc)">&#10005;</button></div>
        <div id="actions">
          <button data-ask="screen">What's on my screen?</button>
          <button data-ask="region">Explain a region</button>
          <button data-mode="find">Find a file…</button>
          <button data-mode="web">Search the web…</button>
        </div>
        <div id="stage">
          <div id="empty">Click the orb and ask, drop a file on it, or right-click for the menu.</div>
          <div id="line"><div id="line-title"></div><span id="line-text"></span>
            <div id="meta"></div>
            <div id="foot">
              <button id="copy">Copy</button>
              <button id="pin">Pin</button>
            </div>
          </div>
          <div id="hold">
            <div id="hold-top"><span id="hold-grip" title="Drag this out to a folder or an app">&#8942;&#8942;</span>
              <span id="hold-label"></span></div>
            <div id="hold-sub"></div>
            <div id="hold-actions"></div>
          </div>
          <div id="results">
            <div id="results-head"><span id="results-title"></span><span id="results-count"></span></div>
            <div id="rows"></div>
            <div id="results-more"></div>
          </div>
          <div id="trips"><div id="trips-head">Trips</div><div id="trip-list"></div>
            <div id="trip-more"></div><div id="trip-queue"></div></div>
        </div>
        <div id="hint"></div>
        <div id="ask"><textarea id="q" rows="1" placeholder="Ask about what you see…"></textarea>
          <button id="send" disabled>Send</button></div>
      </div>`;
    const q = document.getElementById("q");
    const send = document.getElementById("send");
    const close = document.getElementById("close");
    const lineEl = document.getElementById("line");
    const lineTitle = document.getElementById("line-title");
    const lineText = document.getElementById("line-text");
    const meta = document.getElementById("meta");
    const foot = document.getElementById("foot");
    const copy = document.getElementById("copy");
    const pin = document.getElementById("pin");
    const empty = document.getElementById("empty");
    const hint = document.getElementById("hint");
    const where = document.getElementById("where");
    const holdEl = document.getElementById("hold");
    const holdLabel = document.getElementById("hold-label");
    const holdSub = document.getElementById("hold-sub");
    const holdActions = document.getElementById("hold-actions");
    const holdGrip = document.getElementById("hold-grip");
    const resultsEl = document.getElementById("results");
    const resultsTitle = document.getElementById("results-title");
    const resultsCount = document.getElementById("results-count");
    const rowsEl = document.getElementById("rows");
    const resultsMore = document.getElementById("results-more");
    const tripsEl = document.getElementById("trips");
    const tripList = document.getElementById("trip-list");
    const tripMore = document.getElementById("trip-more");
    const tripQueue = document.getElementById("trip-queue");
    const PLACEHOLDERS = {
      find: "What file are you looking for?",
      web: "Search the web for…",
      "sprite-teach": "Teach your sprite… (text or a file path)",
      "aw-recall": "Recall from memory (awm)…",
      "aw-graph": "Query the code graph (awgraph)…",
      "aw-recover": "Snapshot store directory (awrecover list)…",
      "aw-recover-restore": "<store> <label> <dest> -- the current dest is kept aside",
      card: "Ask anything about this card…",
      null: "Ask about what you see…",
    };
    // A mode whose typed text goes back to main under the mode's own verb.
    const VERB_MODES = ["find", "web", "sprite-teach", "aw-recall", "aw-graph", "aw-recover", "aw-recover-restore"];
    let current = null;
    let mode = null;

    function setHint(text) {
      hint.textContent = text || "";
      hint.classList.toggle("on", Boolean(text));
    }
    function render(line) {
      current = line || null;
      if (!line) {
        lineEl.classList.remove("on", "error", "status");
        meta.classList.remove("on");
        foot.classList.remove("on");
        empty.classList.remove("off");
        return;
      }
      empty.classList.add("off");
      lineEl.classList.add("on");
      lineEl.classList.toggle("error", line.kind === "error");
      lineEl.classList.toggle("status", line.kind === "status");
      lineTitle.textContent = (line.meta && line.meta.title) || "";
      lineTitle.style.display = line.kind === "error" && line.meta && line.meta.title ? "block" : "none";
      lineText.textContent = line.text || "";
      const bits = [];
      if (line.meta && line.meta.model) bits.push(line.meta.model);
      if (line.meta && line.meta.via) bits.push(`via ${line.meta.via}`);
      if (line.meta && line.meta.held) bits.push("holding it");
      meta.textContent = bits.join(" · ");
      meta.classList.toggle("on", bits.length > 0);
      foot.classList.toggle("on", line.kind !== "status");
      pin.textContent = line.pinned ? "Pinned" : "Pin";
      pin.classList.toggle("active", Boolean(line.pinned));
      copy.textContent = "Copy";
    }
    function renderHold(payload) {
      const h = payload && payload.hold;
      if (!h) { holdEl.classList.remove("on"); return; }
      holdEl.classList.add("on");
      holdLabel.textContent = (payload && payload.label) || "held";
      holdSub.textContent = h.kind === "file" ? h.path || "" : h.kind === "web" ? (h.url || "") : "dropped text";
      holdActions.innerHTML = "";
      for (const action of (payload.actions || [])) {
        const b = document.createElement("button");
        b.textContent = action.label;
        b.addEventListener("click", () => {
          api.holdAction(action.id).then((r) => {
            if (r && r.ok === false) setHint((r && (r.error || r.reason || r.line)) || "that did not work");
          });
        });
        holdActions.appendChild(b);
      }
    }
    function renderResults(payload) {
      if (!payload || !Array.isArray(payload.rows)) { resultsEl.classList.remove("on"); return; }
      resultsEl.classList.add("on");
      resultsTitle.textContent = payload.mode === "web"
        ? `Web — ${payload.query || ""}`
        : payload.mode === "folder" ? `Folder — ${payload.query || ""}` : `Files — ${payload.query || ""}`;
      resultsCount.textContent = payload.total != null ? `${payload.rows.length} of ${payload.total}` : `${payload.rows.length}`;
      rowsEl.innerHTML = "";
      payload.rows.forEach((row, index) => {
        const rowEl = document.createElement("div");
        rowEl.className = "row";
        rowEl.title = row.url || row.target || "";
        const main = document.createElement("span");
        main.className = "row-main";
        const t = document.createElement("span");
        t.className = "row-title";
        t.textContent = row.title || row.target || row.url || "result";
        const sub = document.createElement("span");
        sub.className = "row-sub";
        sub.textContent = row.subtitle || row.domain || row.target || "";
        main.appendChild(t);
        main.appendChild(sub);
        main.addEventListener("click", () => {
          api.pick(index, "hold").then((r) => {
            if (r && r.ok === false) setHint((r && r.error) || "that result is gone");
          });
        });
        const open = document.createElement("button");
        open.className = "row-open";
        open.textContent = "Open";
        open.addEventListener("click", (e) => { e.stopPropagation(); api.pick(index, "open"); });
        rowEl.appendChild(main);
        rowEl.appendChild(open);
        rowsEl.appendChild(rowEl);
      });
      resultsMore.textContent = payload.more ? `+${payload.more} more` : "";
    }
    function renderTrips(payload) {
      const view = (payload && payload.view) || { items: [], more: 0, moreLine: "" };
      const hasAny = view.items.length > 0 || (payload && payload.line);
      tripsEl.classList.toggle("on", Boolean(hasAny));
      tripList.innerHTML = "";
      for (const item of view.items) {
        const row = document.createElement("div");
        row.className = `trip${item.ok === false ? " bad" : ""}`;
        const dot = document.createElement("span");
        dot.className = "trip-dot";
        const label = document.createElement("span");
        label.className = "trip-label";
        label.textContent = item.label;
        row.appendChild(dot);
        row.appendChild(label);
        tripList.appendChild(row);
      }
      tripMore.textContent = view.moreLine || "";
      tripQueue.textContent = (payload && payload.line) || "";
    }
    function setMode(next, title) {
      mode = next || null;
      q.placeholder = mode === "card" && title
        ? `Ask about “${String(title).slice(0, 60)}”…`
        : PLACEHOLDERS[mode] || PLACEHOLDERS.null;
    }
    function reportDraft() {
      api.state({ drafting: q.value.trim().length > 0 });
    }
    function ask(verb, text) {
      setHint("");
      send.disabled = true;
      api.ask(verb, text).then((r) => {
        if (r && r.ok === false && r.error) setHint(r.error);
      }).finally(() => { send.disabled = q.value.trim().length === 0; });
    }
    function submit() {
      const text = q.value.trim();
      if (!text) return;
      q.value = "";
      q.style.height = "auto";
      reportDraft();
      send.disabled = true;
      ask(VERB_MODES.includes(mode) ? mode : "text", text);
    }

    q.addEventListener("input", () => {
      q.style.height = "auto";
      q.style.height = `${Math.min(84, q.scrollHeight)}px`;
      send.disabled = q.value.trim().length === 0;
      reportDraft();
    });
    q.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
    });
    send.addEventListener("click", submit);
    close.addEventListener("click", () => api.close());
    for (const b of document.querySelectorAll("#actions button")) {
      b.addEventListener("click", () => {
        if (b.dataset.mode) { api.mode(b.dataset.mode).then(() => { q.focus(); }); setMode(b.dataset.mode); return; }
        ask(b.dataset.ask, "");
      });
    }
    copy.addEventListener("click", () => {
      if (!current) return;
      api.copy(current.id).then((r) => { copy.textContent = r && r.ok ? "Copied" : "Copy failed"; });
    });
    pin.addEventListener("click", () => {
      if (!current) return;
      api.pin(current.id, !current.pinned).then((r) => {
        if (r && r.ok) render(r.item);
        else setHint((r && r.reason) || "that answer is gone");
      });
    });
    holdGrip.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      api.dragHold().then((r) => {
        if (r && r.ok === false) setHint((r && r.error) || "nothing to drag");
      });
    });
    document.addEventListener("contextmenu", (e) => { e.preventDefault(); api.menu(); });
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      // Esc mid-trip cancels and sends the spirit home; otherwise it closes.
      api.cancelTrip().then((r) => { if (!r || !r.ok) api.close(); });
    });

    api.onLine(render);
    api.onHold(renderHold);
    api.onResults(renderResults);
    api.onTrips(renderTrips);
    api.onMode((payload) => setMode(payload && payload.mode, payload && payload.title));
    api.onTint((t) => { if (t) applyTint(t.css); });
    api.onAttach((a) => { where.textContent = a && a.attached ? (a.label || "attached") : "free"; });
    api.onFocus(() => { q.focus(); });
    const titleEl = document.getElementById("title");
    function wearSprite(sp) {
      titleEl.textContent = sp && sp.line ? sp.line : "Aither";
      titleEl.title = sp && sp.tooltip ? sp.tooltip.split(" — ")[0] : "";
    }
    if (api.onSprite) api.onSprite(wearSprite);
    api.init().then((s) => {
      if (!s) return;
      if (s.tint) applyTint(s.tint.css);
      wearSprite(s.sprite);
      if (s.line) render(s.line);
      if (s.hold) renderHold({ hold: s.hold, label: s.hold.label, actions: s.holdActions });
      if (s.results) renderResults(s.results);
      if (s.trips) renderTrips(s.trips);
      if (s.attach) where.textContent = s.attach.label || "attached";
      setMode(s.mode, s.modeTitle);
      if (s.view === "bubble") setTimeout(() => q.focus(), 30);
    });
  }
</script>
</body>
</html>
