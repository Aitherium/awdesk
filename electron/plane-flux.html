<!doctype html>
<html lang="en">
<head>

<title>Flux</title>
<link rel="stylesheet" href="aither-tokens.css" />

<!-- One plane page per platform plane; plane-page.js renders all of them from
     data-plane. Reads: plane-client.cjs PLANES.flux (read-only, via Veil /api/admin/planes). -->
<body data-plane="flux">
  <div class="bar">
    <span class="title">Flux</span>
    <span class="state" id="state">loading…</span>
    <button class="chip" id="auto">Auto: on</button>
    <button class="chip" id="refresh">Refresh</button>
  </div>
  <main id="reads"><div class="placeholder">reading Flux…</div></main>
  <script src="plane-page.js"></script>
</body>
</html>
