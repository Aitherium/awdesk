<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; script-src 'unsafe-inline'; img-src data:;" />
<title>Audio</title>
<link rel="stylesheet" href="aither-tokens.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font: 13px/1.35 var(--font-sans, system-ui); color: var(--fg, #e8e8ef); }
  .card { height: 100%; padding: 9px 13px; border-radius: 12px; border: 1px solid var(--line, #333);
    background: var(--bg, #15151c); box-shadow: 0 10px 30px rgba(0,0,0,.45);
    display: grid; grid-template-columns: 34px 1fr auto; grid-template-rows: auto 6px; gap: 2px 10px; align-items: center; }
  .icon { grid-row: 1 / span 2; width: 26px; height: 26px; color: var(--primary, #7aa2ff); }
  .icon.off { color: var(--destructive, #ff6b6b); }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note { color: var(--muted, #9a9aa8); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; grid-column: 2; }
  .value { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; grid-column: 3; grid-row: 1; }
  .track { grid-column: 2 / span 2; height: 4px; border-radius: 2px; background: rgba(255,255,255,.10); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 2px; background: var(--primary, #7aa2ff); transition: width .12s linear; }
  .card.muted .fill { background: var(--destructive, #ff6b6b); }
</style>
</head>
<body>
<div class="card" id="card">
  <svg class="icon" id="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
  <div class="title" id="title">Speakers</div>
  <div class="value" id="value">45%</div>
  <div class="note" id="note"></div>
  <div class="track"><div class="fill" id="fill"></div></div>
</div>
<script>
  const api = window.aitherAudio;
  const card = document.getElementById("card");
  const ICONS = {
    volume: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/>',
    "volume-off": '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>',
    mic: '<path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/>',
    "mic-off": '<line x1="2" y1="2" x2="22" y2="22"/><path d="M9 9v2a3 3 0 0 0 5.1 2.1"/><path d="M15 9.3V5a3 3 0 0 0-5.9-.7"/><path d="M19 10v1a7 7 0 0 1-1 3.6"/><path d="M5 10v1a7 7 0 0 0 10.7 6"/><line x1="12" y1="18" x2="12" y2="22"/>',
  };
  function render(info) {
    if (!info) return;
    document.getElementById("icon").innerHTML = ICONS[info.icon] || ICONS.volume;
    document.getElementById("icon").classList.toggle("off", Boolean(info.muted));
    card.classList.toggle("muted", Boolean(info.muted));
    document.getElementById("title").textContent = info.title || "Speakers";
    document.getElementById("value").textContent = info.value || "";
    document.getElementById("note").textContent = info.note || "";
    document.getElementById("fill").style.width = `${Math.max(0, Math.min(100, Number(info.percent) || 0))}%`;
  }
  api.osdInfo().then(render);
  api.onOsd(render);
</script>
</body>
</html>
