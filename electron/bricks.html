<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; script-src file:; img-src data:;" />
<title>Bricks</title>
<link rel="stylesheet" href="aither-tokens.css" />
<style>
  /* aither://bricks -- the aw* stack on this machine (bricks-client.cjs over awkno). */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--font-sans); }
  body { display: flex; height: 100%; }
  #side { width: 360px; flex: none; border-right: 1px solid var(--line); overflow-y: auto; padding: 14px; }
  #main { flex: 1; overflow-y: auto; padding: 16px 20px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 10px; }
  #q { width: 100%; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
    padding: 0 10px; font: inherit; margin-bottom: 8px; }
  .filters { display: flex; gap: 6px; margin-bottom: 8px; }
  .filters button { height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--line); background: none;
    color: var(--muted); cursor: pointer; font: inherit; font-size: 12px; }
  .filters button[aria-pressed="true"] { color: var(--fg); border-color: var(--primary, #7cd); }
  .sec { margin: 10px 0 4px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .b { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
  .b:hover, .b.on { background: var(--surface-900, var(--panel)); }
  .b .n { font-weight: 700; min-width: 110px; }
  .b .s { color: var(--muted); font-size: 12px; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .b .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--surface-500, #666); align-self: center; }
  .b .dot.in { background: var(--success, #3c9); }
  pre { white-space: pre-wrap; font: 12px/1.5 var(--font-mono, Consolas, monospace); }
  #status { color: var(--muted); }
  #head { margin-bottom: 10px; }
  #head .act { color: var(--muted); font-size: 12px; margin-top: 4px; }
  #head .acts { display: flex; gap: 6px; margin-top: 8px; }
  #head button { height: 28px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--btn);
    color: var(--fg); cursor: pointer; font: inherit; font-size: 12px; }
  #status.err { color: var(--destructive); }
</style>
</head>
<body>
  <div id="side">
    <h1>Bricks</h1>
    <div class="sub">The codex: every aw* brick, guide and law (awkno), which are installed here, and every agent skill on this machine.</div>
    <input id="q" placeholder="Filter (awwall, tunnel, memory…)" aria-label="Filter bricks" />
    <div class="filters"><button data-f="all" aria-pressed="true">All</button><button data-f="installed" aria-pressed="false">Installed</button><button data-f="outdated" aria-pressed="false">Updates</button><button data-f="missing" aria-pressed="false">Not installed</button><button data-f="skills" aria-pressed="false">Skills</button><button data-f="packs" aria-pressed="false">Packs</button></div>
    <div id="status" role="status"></div>
    <div id="list"></div>
  </div>
  <div id="main"><div id="head"></div><pre id="page">Pick a brick to read its page.</pre></div>
  <script src="bricks-page.js"></script>
</body>
</html>
