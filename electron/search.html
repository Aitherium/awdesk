<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; script-src file:; img-src https: data:;" />
<title>Search</title>
<link rel="stylesheet" href="aither-tokens.css" />
<style>
  /* aither://search -- search (awfind / AitherSearch), deep research (awresearch) and
     the door to Media Forge. search-client.cjs does the work; this page renders. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-sans); }
  body { overflow-y: auto; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 22px 20px 60px; }
  form { display: flex; gap: 8px; }
  #q { flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
    color: var(--fg); padding: 0 14px; font: inherit; font-size: 15px; }
  #go { height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--primary, #7cd);
    color: var(--bg); font: inherit; font-weight: 700; cursor: pointer; }
  .modes { display: flex; gap: 4px; margin: 12px 0 18px; flex-wrap: wrap; }
  .modes button { height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--line); background: none;
    color: var(--muted); cursor: pointer; font: inherit; font-size: 13px; }
  .modes button[aria-pressed="true"] { color: var(--fg); border-color: var(--primary, #7cd);
    background: color-mix(in srgb, var(--primary, #7cd) 14%, transparent); }
  .modes .sep { width: 1px; background: var(--line); margin: 4px 6px; }
  #status { color: var(--muted); font-size: 13px; min-height: 20px; }
  #status.err { color: var(--destructive); }
  .answer { padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
    margin-bottom: 16px; white-space: pre-wrap; }
  .r { margin: 0 0 18px; }
  .r a.t { color: var(--primary, #7cd); font-size: 16px; text-decoration: none; }
  .r a.t:hover { text-decoration: underline; }
  .r .u { color: var(--success, #3c9); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .r .s { color: var(--fg); opacity: .85; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .grid a { display: block; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); }
  .grid img { width: 100%; height: 130px; object-fit: cover; display: block; }
  .jobs .job { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
  .jobs .job:hover { background: var(--surface-900, var(--panel)); }
  .jobs .st { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); min-width: 70px; }
  .jobs .st.running { color: var(--warning); }
  .jobs .st.done { color: var(--success, #3c9); }
  .jobs .st.failed { color: var(--destructive); }
  .report h2 { font-size: 20px; margin: 4px 0 14px; }
  .report .claim { margin: 0 0 10px; }
  .report sup a { color: var(--primary, #7cd); text-decoration: none; font-size: 11px; margin-left: 2px; }
  .report .uns { color: var(--warning); font-size: 12px; }
  .report ol { padding-left: 20px; font-size: 13px; }
  .report ol a { color: var(--primary, #7cd); }
  .depth { display: flex; gap: 12px; align-items: center; margin: 8px 0 16px; color: var(--muted); font-size: 13px; }
  .forge { padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .forge button { margin-top: 10px; height: 36px; padding: 0 16px; border-radius: 10px; border: 0;
    background: var(--primary, #7cd); color: var(--bg); font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div class="wrap">
    <form id="form" autocomplete="off">
      <input id="q" spellcheck="false" placeholder="Search the web and the platform, or ask a research question" aria-label="Search" />
      <button id="go" type="submit">Search</button>
    </form>
    <div class="modes" role="group" aria-label="What to do">
      <button data-mode="q" aria-pressed="true" title="Ranked results from AitherSearch (awfind)">Search</button>
      <button data-mode="answer" aria-pressed="false" title="Reads the top pages and answers with citations">Answer</button>
      <button data-mode="deep" aria-pressed="false" title="A wider, slower sweep">Deep search</button>
      <button data-mode="images" aria-pressed="false" title="Images from the web">Images</button>
      <span class="sep"></span>
      <button data-mode="research" aria-pressed="false" title="A cited report from awresearch: every claim pinned to its sources">Deep research</button>
      <button data-mode="forge" aria-pressed="false" title="Make images and video in Media Forge">Media Forge</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="out"></div>
  </div>
  <script src="search-page.js"></script>
</body>
</html>
