<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; script-src 'unsafe-inline'; img-src data:; media-src blob: mediastream:;" />
<title>Recorder</title>
<link rel="stylesheet" href="aither-tokens.css" />
<!--
  recorder.html -- two views, owned by recorder-window.cjs:
    ?view=bar    the floating control bar. It IS the recorder: getUserMedia with the
                 source id main picked, a canvas crop when a region was chosen,
                 optional system audio + mic mixed into one track, MediaRecorder
                 webm/vp9 in 1 s chunks streamed to main. Excluded from capture.
                 The first refused chunk stops the recording (no hole mid-file).

                 SOUND IS LIVE-CONTROLLED (owner 2026-11-02: "control mic input vs
                 system input"): one GainNode per source feeds ONE mixed track, so
                 System / Mic mute and unmute while recording (GainNode 1 -> 0, never
                 track.stop), each with a level meter and a microphone picker. The
                 MIC is acquired on first use, so a plain recording never turns the
                 microphone indicator on until the owner asks for it.

                 The region size is in the first line (ux-shape law 3), and a drag of
                 the visible frame re-crops this canvas live (recorder:region).
    ?view=toast  the saved-recording toast: [Ask Aither] [Copy path] [Open folder]
                 [Sync] (cloud upload is opt-in) or [Cancel sync] when queued.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font: 13px/1.4 var(--font-sans, system-ui); color: var(--fg, #e8e8ef); }
  [hidden] { display: none !important; }
  /* ── bar ── */
  .bar { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 3px;
    padding: 5px 8px 5px 12px; border-radius: 14px; border: 1px solid var(--line, #333);
    background: rgba(20, 21, 28, .96); -webkit-app-region: drag; }
  .row { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .row.top { font-size: 12px; color: var(--muted, #9a9aa8); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--destructive, #ff4d4d); flex: none; }
  .bar.paused .dot { background: var(--muted, #9a9aa8); }
  .bar.starting .dot { opacity: .4; }
  .time { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--fg, #e8e8ef); }
  .size { font-variant-numeric: tabular-nums; color: var(--fg, #e8e8ef); flex: none; }
  .what { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint { flex: none; font-size: 11px; color: var(--muted, #9a9aa8); white-space: nowrap; }
  button { font: inherit; padding: 3px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line, #333); background: transparent; color: inherit; -webkit-app-region: no-drag; }
  button.primary { background: var(--primary, #7aa2ff); border-color: transparent; color: var(--primary-fg, #0b0b10); }
  button.stop { background: var(--destructive, #ff4d4d); border-color: transparent; color: #fff; border-radius: 14px; }
  .tog { padding: 3px 8px; font-size: 12px; }
  .tog.on { border-color: var(--primary, #7aa2ff); color: var(--primary, #7aa2ff); }
  .tog.off { color: #7e7e8c; border-style: dashed; }
  .src { display: inline-flex; align-items: center; gap: 4px; }
  .meter { width: 28px; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .08);
    overflow: hidden; display: inline-block; flex: none; }
  .meter i { display: block; height: 100%; width: 0; background: #6fd08c; transition: width .08s linear; }
  select { -webkit-app-region: no-drag; background: #1b1c25; color: inherit; font: inherit; font-size: 12px;
    border: 1px solid var(--line, #333); border-radius: 6px; padding: 2px 4px; max-width: 160px; }
  .spacer { flex: 1; }
  /* ── toast ── */
  .card { height: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line, #333);
    background: var(--bg, #15151c); display: grid; grid-template-rows: auto auto auto 1fr; gap: 2px; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state { color: var(--muted, #9a9aa8); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 6px; align-items: end; }
  button.x { margin-left: auto; }
  .err .title { color: var(--destructive, #ff6b6b); }
</style>
</head>
<body>
<div class="bar starting" id="bar" hidden>
  <div class="row top">
    <span class="dot"></span>
    <span class="time" id="time">0:00</span>
    <span class="size" id="size" title="Recording region">…</span>
    <span class="what" id="what">Starting…</span>
    <span class="hint" id="hint" title="Pause or resume from anywhere">Ctrl+Alt+P pause</span>
  </div>
  <div class="row ctl">
    <span class="src" id="syswrap" hidden>
      <button class="tog" id="sys" title="System audio: click to mute or unmute while recording">System</button>
      <span class="meter" title="System audio level"><i id="sysmeter"></i></span>
    </span>
    <span class="src" id="micwrap" hidden>
      <button class="tog" id="mic" title="Microphone: click to mute or unmute while recording">Mic</button>
      <span class="meter" title="Microphone level"><i id="micmeter"></i></span>
    </span>
    <select id="micdev" title="Microphone to use" hidden></select>
    <span class="spacer"></span>
    <button id="pause" title="Pause / resume (Ctrl+Alt+P)">Pause</button>
    <button class="stop" id="stop" title="Stop and save">Stop</button>
  </div>
</div>

<div class="card" id="card" hidden>
  <div class="title" id="title">Recording saved</div>
  <div class="state" id="note"></div>
  <div class="state" id="sync"></div>
  <div class="actions" id="actions">
    <button class="primary" data-action="ask">Ask Aither</button>
    <button data-action="copy-path">Copy path</button>
    <button data-action="open-folder">Open folder</button>
    <button data-action="sync" title="Upload this recording to AitherOS Online · Screenshots" hidden>Sync</button>
    <button data-action="cancel-sync" title="Cancel this recording's upload" hidden>Cancel sync</button>
    <button class="x" data-action="dismiss" title="Dismiss">×</button>
  </div>
</div>

<script>
  const rec = window.aitherRecorder;
  const view = new URLSearchParams(location.search).get("view");

  function fmt(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    const p = (n) => String(n).padStart(2, "0");
    return h ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
  }

  // ── the bar: records ──────────────────────────────────────────────────────
  async function runBar() {
    const bar = document.getElementById("bar");
    const time = document.getElementById("time");
    const sizeEl = document.getElementById("size");
    const what = document.getElementById("what");
    const pauseBtn = document.getElementById("pause");
    const sysWrap = document.getElementById("syswrap");
    const micWrap = document.getElementById("micwrap");
    const sysBtn = document.getElementById("sys");
    const micBtn = document.getElementById("mic");
    const micDev = document.getElementById("micdev");
    const sysMeter = document.getElementById("sysmeter");
    const micMeter = document.getElementById("micmeter");
    bar.hidden = false;

    const owned = [];          // every track we opened, stopped at the end
    let recorder = null;
    let segments = [];         // [start, end|null] pairs, pauses excluded
    let tick = null;
    let raf = null;
    let writes = Promise.resolve();
    let stopping = false;
    let ac = null;
    let mixDest = null;
    const sources = { system: null, mic: null };
    const muted = { system: false, mic: false };
    const missing = [];
    const SYS = {
      audio: { mandatory: { chromeMediaSource: "desktop" } },
      video: { mandatory: { chromeMediaSource: "desktop", maxWidth: 320, maxHeight: 180, maxFrameRate: 1 } },
    };

    const cleanup = () => {
      if (raf) cancelAnimationFrame(raf);
      raf = null;
      for (const name of ["system", "mic"]) detachSource(name);
      for (const t of owned) { try { t.stop(); } catch { /* ended */ } }
      try { if (ac) ac.close(); } catch { /* already closed */ }
    };
    const fail = (why) => { cleanup(); rec.failed(why); };

    const plan = await rec.plan();
    if (!plan || !plan.ok) return fail((plan && plan.reason) || "no plan");

    const setSize = (w, h) => {
      if (!w || !h) return;
      sizeEl.hidden = false;
      sizeEl.textContent = `${Math.round(w)}×${Math.round(h)}`;
      sizeEl.title = "Recording region";
    };
    // The size chip never shows a placeholder: seed it from the region, else from
    // the display; a whole-display recording that still knows no size hides it.
    const seed = plan.region || plan.displaySize;
    if (seed) { sizeEl.hidden = false; setSize(seed.width, seed.height); } else { sizeEl.hidden = true; }

    // The pause hint names the key main REALLY holds (plan.pauseHotkey is null when
    // another app owns it): a dead key is not advertised.
    const hintEl = document.getElementById("hint");
    if (plan.pauseHotkey) {
      hintEl.textContent = `${plan.pauseHotkey} pause`;
      hintEl.title = `Pause or resume (${plan.pauseHotkey})`;
      pauseBtn.title = `Pause / resume (${plan.pauseHotkey})`;
    } else {
      hintEl.hidden = true;
      pauseBtn.title = "Pause / resume";
    }

    // ── audio: ONE GainNode per source into ONE mixed track ────────────────
    // Muting is gain 1 -> 0, never track.stop: a muted source keeps its clock,
    // so unmuting mid-recording does not jolt the mix or the video.
    if (plan.sound) {
      try {
        ac = new AudioContext();
        mixDest = ac.createMediaStreamDestination();
        if (ac.resume) ac.resume().catch(() => {});
      } catch {
        ac = null;
        mixDest = null;
        missing.push("audio");
      }
    }
    const audioTracks = mixDest ? mixDest.stream.getAudioTracks() : [];

    function attachSource(name, stream) {
      if (!ac || !mixDest) return false;
      // One live source per name: replacing an entry WITHOUT stopping the old
      // stream leaked a capture and doubled its level in the mix.
      detachSource(name);
      let src = null;
      let gain = null;
      let analyser = null;
      try {
        src = ac.createMediaStreamSource(stream);
        gain = ac.createGain();
        analyser = ac.createAnalyser();
        analyser.fftSize = 256;
        gain.gain.value = muted[name] ? 0 : 1;
        src.connect(gain);
        gain.connect(analyser);   // analyser is pass-through: level = what is heard
        analyser.connect(mixDest);
        sources[name] = { stream, src, gain, analyser, data: new Uint8Array(analyser.fftSize) };
        return true;
      } catch {
        try { if (src) src.disconnect(); } catch { /* gone */ }
        try { if (gain) gain.disconnect(); } catch { /* gone */ }
        try { if (analyser) analyser.disconnect(); } catch { /* gone */ }
        return false;
      }
    }
    const stopStream = (stream) => {
      try { for (const t of stream.getTracks()) t.stop(); } catch { /* ended */ }
    };
    function detachSource(name) {
      const s = sources[name];
      if (!s) return;
      sources[name] = null;
      try { s.src.disconnect(); } catch { /* gone */ }
      try { s.gain.disconnect(); } catch { /* gone */ }
      try { s.analyser.disconnect(); } catch { /* gone */ }
      for (const t of s.stream.getTracks()) { try { t.stop(); } catch { /* ended */ } }
    }
    const paintToggles = () => {
      const set = (btn, name) => {
        btn.classList.toggle("off", muted[name]);
        btn.classList.toggle("on", !muted[name] && Boolean(sources[name]));
        btn.title = `${name === "system" ? "System audio" : "Microphone"}: `
          + (sources[name] ? (muted[name] ? "muted — click to unmute" : "live — click to mute")
            : `not captured yet — click to ${name === "system" ? "capture system audio" : "capture the microphone"}`);
      };
      set(sysBtn, "system");
      set(micBtn, "mic");
    };

    // One acquire per source at a time: a double-click (or a device change while a
    // getUserMedia is pending) used to run it twice, leak the first stream and
    // double its level. The promise is shared, then cleared for the next one.
    const acquiring = { system: null, mic: null };
    function oneAcquire(name, run) {
      if (acquiring[name]) return acquiring[name];
      const p = run();
      acquiring[name] = p;
      void p.finally(() => { if (acquiring[name] === p) acquiring[name] = null; });
      return p;
    }

    function ensureSystem() {
      if (!ac) return Promise.resolve(false);
      if (sources.system) return Promise.resolve(true);
      return oneAcquire("system", async () => {
        let sys = null;
        try {
          sys = await navigator.mediaDevices.getUserMedia(plan.systemAudio || SYS);
          for (const t of sys.getVideoTracks()) t.stop();
          const audio = sys.getAudioTracks();
          if (!audio.length) { stopStream(sys); return false; }
          const stream = new MediaStream(audio);
          if (!attachSource("system", stream)) { stopStream(stream); return false; }
          muted.system = false;
          return true;
        } catch {
          if (sys) stopStream(sys);
          return false;
        }
      });
    }

    function ensureMic(deviceId) {
      if (!ac) return Promise.resolve(false);
      const audio = deviceId ? { deviceId: { exact: String(deviceId) } } : true;
      return oneAcquire("mic", async () => {
        let mic = null;
        try {
          mic = await navigator.mediaDevices.getUserMedia({ audio, video: false });
          if (!attachSource("mic", mic)) { stopStream(mic); return false; }
          muted.mic = false;
          return true;
        } catch {
          if (mic) stopStream(mic);
          return false;
        }
      });
    }

    async function fillDevices() {
      try {
        const all = await navigator.mediaDevices.enumerateDevices();
        const ins = all.filter((d) => d.kind === "audioinput");
        micDev.innerHTML = "";
        const def = document.createElement("option");
        def.value = "";
        def.textContent = "Default mic";
        micDev.appendChild(def);
        ins.forEach((d, i) => {
          const o = document.createElement("option");
          o.value = d.deviceId;
          o.textContent = d.label || `Mic ${i + 1}`;
          micDev.appendChild(o);
        });
        micDev.hidden = !plan.sound;
        micDev.value = plan.micDeviceId || "";
      } catch {
        micDev.hidden = true;
      }
    }

    if (plan.sound) {
      sysWrap.hidden = false;
      micWrap.hidden = false;
      if (plan.systemAudio) {
        if (!(await ensureSystem())) missing.push("system audio");
      }
      if (plan.mic) {
        if (!(await ensureMic(plan.micDeviceId))) missing.push("mic");
      }
      paintToggles();
      void fillDevices();
      if (navigator.mediaDevices.addEventListener) {
        navigator.mediaDevices.addEventListener("devicechange", () => { void fillDevices(); });
      }
    }

    // Click = acquire on first use, then mute/unmute live. The button is disabled
    // while its own acquire is in flight, and a click is ignored if one already is
    // (a double-click must not open the same device twice).
    sysBtn.addEventListener("click", async () => {
      if (stopping || acquiring.system) return;
      if (!sources.system) {
        sysBtn.disabled = true;
        try {
          if (!(await ensureSystem())) { what.textContent = "1 audio source unavailable — system audio is not offered on this PC"; return; }
        } finally { sysBtn.disabled = false; }
      } else {
        muted.system = !muted.system;
        sources.system.gain.gain.setTargetAtTime(muted.system ? 0 : 1, ac.currentTime, 0.01);
      }
      paintToggles();
      void fillDevices();
    });
    micBtn.addEventListener("click", async () => {
      if (stopping || acquiring.mic) return;
      if (!sources.mic) {
        micBtn.disabled = true;
        try {
          if (!(await ensureMic(micDev.value || plan.micDeviceId))) { what.textContent = "1 audio source unavailable — allow microphone access for Aither"; return; }
        } finally { micBtn.disabled = false; }
      } else {
        muted.mic = !muted.mic;
        sources.mic.gain.gain.setTargetAtTime(muted.mic ? 0 : 1, ac.currentTime, 0.01);
      }
      paintToggles();
      void fillDevices();
    });
    micDev.addEventListener("change", async () => {
      if (stopping) return;
      // A change made while an acquire is pending waits for it, then opens the
      // device the owner just picked (rather than being dropped or doubled).
      if (acquiring.mic) { try { await acquiring.mic; } catch { /* its own failure is shown below */ } }
      micDev.disabled = true;
      try {
        const ok = await ensureMic(micDev.value || null);
        what.textContent = ok ? "Microphone changed" : "1 microphone could not be opened — using the previous one";
        paintToggles();
      } finally { micDev.disabled = false; }
    });

    const meters = () => {
      raf = requestAnimationFrame(meters);
      for (const name of ["system", "mic"]) {
        const s = sources[name];
        const el = name === "system" ? sysMeter : micMeter;
        if (!s) { el.style.width = "0%"; continue; }
        s.analyser.getByteTimeDomainData(s.data);
        let peak = 0;
        for (let i = 0; i < s.data.length; i += 1) peak = Math.max(peak, Math.abs(s.data[i] - 128));
        el.style.width = `${Math.min(100, Math.round((peak / 80) * 100))}%`;
      }
    };

    let tags;
    let raw = null;
    let canvas = null;
    let canvasCtx = null;
    let crop = null;
    let drawFrame = null;
    let streamPx = null;   // the RAW screen stream's size; the crop is always computed from it
    let outTrack = null;   // the track the recorder encodes (the cropped canvas, when cropped)
    if (plan.native) {
      // Main records this screen with ffmpeg gdigrab (Chromium cannot see it, measured
      // 2026-11-02 on the RTX 5090's 4K output). The bar records only the SOUND here
      // (system audio + mic work on any GPU); main muxes it onto the video at finish.
      tags = [plan.cropped ? "Region" : "Screen", plan.format.toUpperCase()];
      if (plan.systemAudio && !missing.includes("system audio")) tags.push("system audio");
      if (plan.mic && !missing.includes("mic")) tags.push("mic");
      if (missing.length) tags.push(`${missing.length} audio source${missing.length > 1 ? "s" : ""} refused — recording without`);
      if (audioTracks.length) {
        const audioMime = ["audio/webm;codecs=opus", "audio/webm"].find((m) => MediaRecorder.isTypeSupported(m)) || "";
        try {
          recorder = new MediaRecorder(new MediaStream(audioTracks), audioMime ? { mimeType: audioMime } : undefined);
        } catch (e) {
          return fail(`MediaRecorder refused: ${(e && e.message) || e}`);
        }
      } else {
        recorder = {
          state: "inactive",
          start() { this.state = "recording"; },
          pause() { this.state = "paused"; },
          resume() { this.state = "recording"; },
          stop() { this.state = "inactive"; Promise.resolve().then(() => this.onstop && this.onstop()); },
        };
      }
    } else {
    let screen;
    try {
      screen = await navigator.mediaDevices.getUserMedia(plan.constraints);
    } catch (e) {
      return fail(`screen capture refused: ${(e && e.message) || e}`);
    }
    owned.push(...screen.getTracks());
    raw = screen.getVideoTracks()[0];
    const settings = raw.getSettings();
    streamPx = { width: settings.width, height: settings.height };
    let videoTrack = raw;
    let label = "Screen";

    const size = await rec.streamSize({ width: settings.width, height: settings.height });
    if (plan.cropped && size && size.ok && size.crop) {
      // Crop on a canvas: the region is honoured even when ffmpeg is missing.
      crop = size.crop;
      const video = document.createElement("video");
      video.muted = true;
      video.srcObject = screen;
      await video.play();
      canvas = document.createElement("canvas");
      canvasCtx = canvas.getContext("2d", { alpha: false });
      const sizeCanvas = () => { canvas.width = crop.width; canvas.height = crop.height; };
      sizeCanvas();
      const draw = () => {
        if (crop && crop.width && crop.height) {
          canvasCtx.drawImage(video, crop.x, crop.y, crop.width, crop.height, 0, 0, canvas.width, canvas.height);
        }
      };
      drawFrame = draw;
      if (typeof video.requestVideoFrameCallback === "function") {
        const loop = () => { draw(); video.requestVideoFrameCallback(loop); };
        video.requestVideoFrameCallback(loop);
      } else {
        setInterval(draw, Math.round(1000 / plan.fps));
      }
      draw();
      videoTrack = canvas.captureStream(plan.fps).getVideoTracks()[0];
      outTrack = videoTrack;
      owned.push(videoTrack);
      // The owner selected DIP; the crop is in stream pixels. Show what was selected.
      label = plan.region ? `Region ${plan.region.width}×${plan.region.height}` : `Region ${crop.width}×${crop.height}`;
    } else {
      label = `Screen ${settings.width}×${settings.height}`;
      // A whole-display recording still gets a real size, not the "…" placeholder.
      setSize(settings.width, settings.height);
    }

    tags = [label, plan.format.toUpperCase()];
    if (plan.systemAudio && !missing.includes("system audio")) tags.push("system audio");
    if (plan.mic && !missing.includes("mic")) tags.push("mic");
    if (missing.length) tags.push(`${missing.length} audio source${missing.length > 1 ? "s" : ""} refused — recording without`);
    if (plan.format !== "webm" && !plan.ffmpeg) tags.push("no ffmpeg — saves WebM");

    const stream = new MediaStream([videoTrack, ...audioTracks]);
    // H.264 first: Chromium encodes it on the GPU (Media Foundation) on Windows.
    // Measured 2026-11-01 on the owner's 4K screen with the host at 100 % CPU: the
    // software VP9 encoder kept ~1.9 fps (11 frames in 5.8 s while the cursor moved).
    // ffmpeg converts the WebM to MP4/GIF as before; VP9/VP8 stay as the fallbacks.
    const wanted = audioTracks.length
      ? ["video/webm;codecs=h264,opus", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
      : ["video/webm;codecs=h264", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
    const mimeType = wanted.find((m) => MediaRecorder.isTypeSupported(m)) || "";
    try {
      recorder = new MediaRecorder(stream, mimeType ? { mimeType, videoBitsPerSecond: 8_000_000 } : undefined);
    } catch (e) {
      return fail(`MediaRecorder refused: ${(e && e.message) || e}`);
    }
    }

    // A refused chunk (disk full, EPERM) ends the recording: appending past it
    // would leave a hole mid-file. Main refuses later appends too and the toast
    // reads "1 recording truncated — <reason>".
    let writeFailed = null;
    const writeFailedOnce = (why) => {
      if (writeFailed) return;
      writeFailed = String(why || "write failed");
      what.textContent = `1 write failed — saving what was recorded (${writeFailed})`;
      what.title = what.textContent;
      stop();
    };
    recorder.ondataavailable = (e) => {
      if (!e.data || !e.data.size || writeFailed) return;
      const blob = e.data;
      writes = writes.then(async () => {
        if (writeFailed) return;
        const r = await rec.chunk(await blob.arrayBuffer());
        if (!r || !r.ok) writeFailedOnce((r && r.reason) || "the recording could not be written");
      }).catch((err) => writeFailedOnce((err && err.message) || err));
    };
    recorder.onstop = async () => {
      clearInterval(tick);
      if (raf) { cancelAnimationFrame(raf); raf = null; }
      await writes;
      cleanup();
      await rec.done();
    };

    const render = () => {
      let ms = 0;
      for (const [a, b] of segments) ms += (b == null ? Date.now() : b) - a;
      time.textContent = fmt(ms);
    };
    function stop() {
      if (stopping || !recorder) return;
      stopping = true;
      if (!writeFailed) what.textContent = "Saving…";
      if (segments.length && segments[segments.length - 1][1] == null) segments[segments.length - 1][1] = Date.now();
      recorder.stop();
    }
    function pause() {
      if (!recorder || stopping || recorder.state !== "recording") return;
      recorder.pause();
      segments[segments.length - 1][1] = Date.now();
      bar.classList.add("paused");
      pauseBtn.textContent = "Resume";
      rec.state("paused");
    }
    function resume() {
      if (!recorder || stopping || recorder.state !== "paused") return;
      recorder.resume();
      segments.push([Date.now(), null]);
      bar.classList.remove("paused");
      pauseBtn.textContent = "Pause";
      rec.state("recording");
    }

    // The output size the encoder really uses, read from the video track (its
    // getSettings is the authoritative resolution, not what we asked the canvas for).
    const outputSize = () => {
      try {
        const s = outTrack && outTrack.getSettings ? outTrack.getSettings() : null;
        return s && s.width && s.height ? { width: s.width, height: s.height } : null;
      } catch { return null; }
    };
    // Prove the crop changed the OUTPUT, not just the canvas: if Chromium pinned
    // the track's resolution, say so in the chip instead of reporting a size the
    // file does not have.
    const noteOutputSize = (wanted) => {
      const got = outputSize();
      if (!got) return;
      if (got.width === wanted.width && got.height === wanted.height) {
        sizeEl.title = `Recording region — output ${got.width}×${got.height}`;
        return;
      }
      sizeEl.title = `Recording region ${wanted.width}×${wanted.height} — this capture keeps ${got.width}×${got.height}`;
      if (!sizeEl.dataset.pinned) {
        sizeEl.dataset.pinned = "1";
        what.textContent += ` · output stays ${got.width}×${got.height}`;
        what.title = what.textContent;
      }
    };

    // The visible frame was dragged: the region changed under a live recording.
    // Main debounces the drag to the SETTLED region, so this runs once per drag.
    // Re-crop the canvas (WebRTC path) and show the new size; the native path
    // restarts its gdigrab segment in main and needs nothing here.
    let cropSeq = 0;
    rec.onRegion(async (r) => {
      if (!r || !r.width || !r.height) return;
      const seq = ++cropSeq;
      setSize(r.width, r.height);
      if (!canvas || !streamPx) return;
      let next = null;
      try { next = await rec.streamSize(streamPx); } catch { return; }
      if (seq !== cropSeq || !next || !next.ok || !next.crop) return; // a newer region won
      crop = next.crop;
      canvas.width = crop.width;
      canvas.height = crop.height;
      if (drawFrame) drawFrame();
      // Not the very next frame: give Chromium a moment to propagate the canvas
      // size to the capture track before judging whether the output really moved.
      setTimeout(() => noteOutputSize(crop), 250);
    });

    document.getElementById("stop").addEventListener("click", stop);
    pauseBtn.addEventListener("click", () => (recorder && recorder.state === "paused" ? resume() : pause()));
    rec.onCommand((cmd) => (cmd === "stop" ? stop() : cmd === "pause" ? pause() : cmd === "resume" ? resume() : null));

    recorder.start(1000);
    segments = [[Date.now(), null]];
    rec.state("recording");
    bar.classList.remove("starting");
    what.textContent = tags.join(" · ");
    what.title = tags.join(" · ");
    paintToggles();
    raf = requestAnimationFrame(meters);
    tick = setInterval(render, 250);
    // A source that ends on its own (display unplugged, permission revoked) saves what we have.
    if (raw) raw.addEventListener("ended", stop);
  }

  // ── the toast ─────────────────────────────────────────────────────────────
  function runToast() {
    const card = document.getElementById("card");
    card.hidden = false;
    const set = (id, text) => { const el = document.getElementById(id); el.textContent = text || ""; el.title = text || ""; };
    function render(info) {
      if (!info) return;
      if (!info.ok) {
        card.classList.add("err");
        set("title", "Recording failed");
        set("note", info.reason);
        set("sync", "");
        for (const b of document.querySelectorAll("[data-action]")) b.hidden = b.dataset.action !== "dismiss";
        return;
      }
      card.classList.remove("err");
      for (const b of document.querySelectorAll("[data-action]")) {
        const a = b.dataset.action;
        b.hidden = a === "sync" ? !info.canSync : a === "cancel-sync" ? !info.canCancelSync : false;
      }
      set("title", `Saved ${info.name}`);
      set("note", info.status || info.note || (info.interrupted ? `Stopped early (${info.interrupted}) — what was recorded is saved` : `${String(info.format || "").toUpperCase()} in Videos · Aither Recordings`));
      set("sync", info.sync || "");
    }
    rec.toastInfo().then(render);
    rec.onToastUpdate(render);
    document.getElementById("actions").addEventListener("click", (e) => {
      const action = e.target && e.target.dataset ? e.target.dataset.action : null;
      if (action) rec.toastAction(action);
    });
  }

  if (view === "toast") runToast();
  else runBar().catch((e) => rec.failed(String((e && e.message) || e)));
</script>
</body>
</html>
