<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; script-src file:; img-src data:;" />
<title>This phone</title>
<link rel="stylesheet" href="aither-tokens.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fk-bg, #050507); color: var(--fk-ink, #EDEFF5);
    font: 13px/1.45 var(--font-sans, system-ui); }
  main { padding: 20px; max-width: 520px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 300; margin: 0 0 4px; }
  .next { color: rgba(237,239,245,.65); margin: 0 0 14px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: rgba(237,239,245,.35); }
  [data-status="linked"] .dot { background: var(--fk-accent, #62c6c8); }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
  button { height: 32px; padding: 0 14px; border-radius: 8px; cursor: pointer; font: inherit;
    border: 1px solid rgba(237,239,245,.18); background: none; color: inherit; }
  button.primary { background: var(--fk-accent, #62c6c8); color: #050507; border-color: transparent; font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  h2 { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: rgba(237,239,245,.5); margin: 0 0 6px; font-weight: 500; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 10px 0; border-top: 1px solid rgba(237,239,245,.08); display: flex; gap: 12px; align-items: flex-start; }
  li .t { flex: 1; min-width: 0; }
  li .n { font-size: 14px; }
  li .d { color: rgba(237,239,245,.6); font-size: 12px; margin-bottom: 6px; }
  .badge { font: 11px var(--font-mono, Consolas, monospace); color: rgba(237,239,245,.5); white-space: nowrap; }
  .badge.ready { color: var(--fk-accent, #62c6c8); }
  .err { color: #ff8a80; margin: 0 0 12px; }
  .file { font: 11px var(--font-mono, Consolas, monospace); color: rgba(237,239,245,.6); word-break: break-all; margin: 8px 0 0; }
</style>
</head>
<body>
<main id="app" data-status="loading"><p class="next">Looking at the cable...</p></main>
<script src="phone-panel-page.js"></script>
</body>
</html>
