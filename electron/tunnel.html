<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; script-src 'unsafe-inline'; img-src data:;" />
<title>Public URL</title>
<link rel="stylesheet" href="aither-tokens.css" />
<style>
  /* Colours come from aither-tokens.css, same as disk-explorer.html. */
  :root { --amber: var(--warning); --red: var(--destructive); --green: var(--success); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--font-sans); }
  body { display: grid; grid-template-rows: 44px auto 1fr; height: 100vh; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); }
  .bar .title { font-weight: 600; }
  .bar .state { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .state.err { color: var(--red); }
  .chip { appearance: none; border: 1px solid var(--line); background: var(--btn); color: var(--muted);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
  .chip:hover { background: var(--btn-hi); color: var(--fg); }
  .chip:disabled { opacity: .5; cursor: default; }
  .chip.primary { color: var(--fg); border-color: color-mix(in oklch, var(--brand), var(--background) 50%); }
  input { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .override { color: var(--amber); font-size: 12px; width: 100%; }
  .override[hidden] { display: none; }
  .result { width: 100%; font-size: 12px; }
  .result.ok { color: var(--green); }
  .result.err { color: var(--red); }
  main { overflow: auto; min-height: 0; padding: 12px 14px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--surface-400);
    font-weight: 650; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--btn); vertical-align: middle; }
  td.url { font: 12px/1.4 var(--font-mono); word-break: break-all; }
  td.acts { white-space: nowrap; text-align: right; }
  .pill { font-size: 10px; border-radius: 999px; padding: 1px 7px; border: 1px solid var(--line); }
  .pill.live { color: var(--green); }
  .pill.stale { color: var(--amber); }
  .placeholder, .muted { color: var(--muted); }
  .more { margin-top: 8px; }
</style>
</head>
<body>
  <div class="bar">
    <span class="title">Public URL</span>
    <span class="state" id="state">loading…</span>
    <button class="chip" id="refresh">Refresh</button>
  </div>
  <form id="upForm">
    <label class="muted">local port <input id="port" size="7" inputmode="numeric" placeholder="3000" autofocus /></label>
    <button class="chip primary" id="go" type="submit">Make public</button>
    <span class="muted">anyone with the link can reach it</span>
    <label class="override" id="overrideRow" hidden>
      <input type="checkbox" id="override" /> Owner override: expose this fleet-internal port anyway
    </label>
    <div class="result" id="result"></div>
  </form>
  <main>
    <div id="list" class="placeholder">loading…</div>
  </main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const CAP = 5;
let showAll = false;
let rows = [];

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function setState(text, err) {
  $("state").textContent = text;
  $("state").classList.toggle("err", Boolean(err));
}

function setResult(text, ok) {
  $("result").textContent = text || "";
  $("result").className = "result" + (text ? (ok ? " ok" : " err") : "");
}

function statusLine(res) {
  if (!res || !res.ok) return (res && res.reason) || "tunnels unavailable — Refresh";
  // tunnel-client.cjs statusLine() computes the line (unreadable files included).
  if (typeof res.data.line === "string" && res.data.line) return res.data.line;
  const { total, alive } = res.data;
  if (!total) return "0 public ports — type a port and press Make public";
  const stale = total - alive;
  return `${alive} public port${alive === 1 ? "" : "s"}` + (stale ? ` · ${stale} stale — Stop clears ${stale === 1 ? "it" : "them"}` : "");
}

function render() {
  if (!rows.length) { $("list").className = "placeholder"; $("list").textContent = "nothing is public"; return; }
  const visible = showAll ? rows : rows.slice(0, CAP);
  const more = rows.length - visible.length;
  $("list").className = "";
  $("list").innerHTML = `<table><thead><tr><th>port</th><th>url</th><th>state</th><th></th></tr></thead><tbody>${
    visible.map((t) => t.unreadable ? `<tr>
      <td>${t.port ? esc(t.port) : "?"}</td>
      <td class="url"><span class="muted">${esc(t.path)}</span></td>
      <td><span class="pill stale">unreadable</span> <span class="muted">${esc(t.source)}</span></td>
      <td class="acts muted" title="${esc(t.reason)}">run awtunnel status</td></tr>` : `<tr>
      <td>${esc(t.port)}</td>
      <td class="url">${t.url ? esc(t.url) : '<span class="muted">no url</span>'}</td>
      <td><span class="pill ${t.alive ? "live" : "stale"}">${t.alive ? "live" : "stale"}</span> <span class="muted">${esc(t.source)}</span></td>
      <td class="acts">
        ${t.alive && t.url ? `<button class="chip" data-copy="${esc(t.url)}">Copy</button> <button class="chip" data-open="${esc(t.url)}">Open</button>` : ""}
        <button class="chip" data-stop="${esc(t.port)}">Stop</button>
      </td></tr>`).join("")
  }</tbody></table>${more > 0 ? `<button class="chip more" id="more">+${more} more</button>` : ""}`;
  const m = $("more");
  if (m) m.onclick = () => { showAll = true; render(); };
}

async function refresh() {
  setState("checking…");
  const res = await window.tunnel.list();
  setState(statusLine(res), !res.ok || Boolean(res.data && res.data.errors && res.data.errors.length));
  // Unreadable state files lead: one of them may be a port that is public right now.
  rows = res.ok ? [...(res.data.errors || []).map((e) => ({ ...e, unreadable: true })), ...res.data.tunnels] : [];
  if (!res.ok) { $("list").className = "placeholder"; $("list").textContent = res.reason; return; }
  render();
}

$("refresh").onclick = refresh;

$("port").addEventListener("input", async () => {
  // Show the override only when the typed port is a fleet internal, with its reason.
  const port = $("port").value.trim();
  if (!port) { $("overrideRow").hidden = true; setResult(""); return; }
  const v = await window.tunnel.check(port, false);
  $("overrideRow").hidden = !(v && v.denied);
  $("override").checked = false;
  setResult(v && !v.ok ? v.reason : "", false);
});

$("upForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const port = $("port").value.trim();
  $("go").disabled = true;
  setResult(`making port ${port} public… (~10 s)`, true);
  try {
    const res = await window.tunnel.start(port, $("override").checked === true);
    if (res.ok) {
      const copied = await window.tunnel.copy(res.data.url);
      setResult(`port ${res.data.port} is public at ${res.data.url}${res.data.reused ? " (already was)" : ""}${copied.ok ? " — copied" : ""}`, true);
    } else {
      setResult(res.reason, false);
      $("overrideRow").hidden = !res.denied;
    }
  } finally {
    $("go").disabled = false;
    void refresh();
  }
});

$("list").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.copy) { const r = await window.tunnel.copy(b.dataset.copy); setResult(r.ok ? `copied ${r.data.copied}` : r.reason, r.ok); }
  else if (b.dataset.open) { const r = await window.tunnel.open(b.dataset.open); if (!r.ok) setResult(r.reason, false); }
  else if (b.dataset.stop) {
    b.disabled = true;
    const r = await window.tunnel.stop(b.dataset.stop);
    const msg = !r.ok ? r.reason
      : r.data.stopped ? `port ${r.data.port} is private again`
      : `port ${r.data.port}: ${r.data.cleared || 0} stale record cleared — nothing was running`;
    setResult(msg, r.ok);
    void refresh();
  }
});

const pre = new URLSearchParams(location.search).get("port");
if (pre) { $("port").value = pre; $("port").dispatchEvent(new Event("input")); }
void refresh();
</script>
</body>
</html>
