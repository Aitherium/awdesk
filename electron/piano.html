<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' file:; img-src data: blob:; media-src data: blob:">
<title>Play notes</title>
<style>
  :root { --bg:#14171c; --ink:#e6e8eb; --mute:#8a93a0; --line:#2a2f38; --panel:#1b1f26; --accent:#7cc4ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:12px "Segoe UI", system-ui, sans-serif; overflow:hidden; user-select:none; }
  body { display:flex; flex-direction:column; }
  .bar { display:flex; align-items:center; gap:6px; padding:5px 8px; background:var(--panel); border-bottom:1px solid var(--line); -webkit-app-region:drag; }
  .bar .title { font-weight:600; margin-right:auto; }
  .bar button, .bar select, .bar input, .bar label { -webkit-app-region:no-drag; }
  button, select, input { background:#232832; color:var(--ink); border:1px solid var(--line); border-radius:4px; font:inherit; padding:2px 7px; height:22px; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#0c1016; border-color:var(--accent); }
  button.rec.on { background:#ff6b6b; border-color:#ff6b6b; }
  input[type=number] { width:48px; }
  .row { display:flex; align-items:center; gap:6px; padding:4px 8px; flex-wrap:wrap; }
  .sep { width:1px; height:16px; background:var(--line); }
  #roll { display:block; margin:0 8px; height:44px; width:calc(100% - 16px); background:#0f1216; border:1px solid var(--line); border-radius:4px; }
  #kb { position:relative; flex:1; margin:6px 8px; touch-action:none; min-height:100px; }
  .key { position:absolute; top:0; border:1px solid #0a0c10; border-radius:0 0 4px 4px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:4px; font-size:10px; }
  .white { background:#e9ecf1; color:#555; height:100%; z-index:1; }
  .black { background:#20242b; color:#9aa3ae; height:60%; z-index:2; }
  .key.down { background:var(--accent); color:#0c1016; }
  #status { padding:3px 8px; border-top:1px solid var(--line); color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:20px; }
  #status.err { color:#ff8a8a; } #status.ok { color:#9fe0a8; }
  #dl a { color:var(--accent); margin-left:8px; }
</style>
</head>
<body>
<div class="bar">
  <span class="title">Play notes</span>
  <button id="octDown" title="Octave down (z)">Oct -</button>
  <span id="octLabel">C4</span>
  <button id="octUp" title="Octave up (x)">Oct +</button>
  <select id="sound" title="Sound">
    <option value="piano">Piano-ish</option><option value="organ">Organ</option>
    <option value="square">Square</option><option value="pluck">Pluck</option>
  </select>
  <button id="close" title="Close (Esc)">&#x2715;</button>
</div>
<div class="row">
  <button id="rec" class="rec">&#x25CF; Record</button>
  <button id="stop">&#x25A0; Stop</button>
  <button id="play">&#x25B6; Play back</button>
  <button id="clear">Clear</button>
  <span class="sep"></span>
  <label>BPM <input id="bpm" type="number" min="30" max="300" value="120"></label>
  <button id="quant" title="Quantize to sixteenths">Quantize</button>
  <span class="sep"></span>
  <button id="saveMidi">Save MIDI</button>
  <button id="saveWav">Save WAV</button>
  <button id="copy">Copy</button>
  <select id="target" title="Send to..."><option value="">Send to&hellip;</option></select>
  <button id="seed">Seed Song Studio</button>
</div>
<canvas id="roll"></canvas>
<div id="kb"></div>
<div id="status">Click keys or play a w s e d f t g y h u j k. z / x shift octave.</div>
<script src="piano-core.cjs"></script>
<script>
"use strict";
(function () {
  const core = window.pianoCore;
  const tk = window.toolkit || null;
  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  function status(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind || "";
  }
  function verdict(v) {
    if (v && v.ok) status(v.line || v.path || "Done.", "ok");
    else status((v && v.error) || "Failed.", "err");
  }

  // ---- audio -------------------------------------------------------------
  let ctx = null;
  function audio() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  const VOICES = {
    piano:  { parts: [["triangle", 1, 0.6], ["sine", 2, 0.25], ["sine", 3, 0.1]], a: 0.005, d: 0.4, s: 0.25, r: 0.35 },
    organ:  { parts: [["sine", 1, 0.5], ["sine", 2, 0.3], ["sine", 4, 0.15]], a: 0.01, d: 0.05, s: 0.9, r: 0.08 },
    square: { parts: [["square", 1, 0.25]], a: 0.005, d: 0.1, s: 0.7, r: 0.06 },
    pluck:  { parts: [["sawtooth", 1, 0.35], ["sine", 2, 0.15]], a: 0.002, d: 0.25, s: 0.0, r: 0.1 },
  };
  /** Start a voice now (or at `when`); returns stop(at?) */
  function voice(note, velocity, when) {
    const ac = audio();
    const v = VOICES[$("sound").value] || VOICES.piano;
    const t0 = when || ac.currentTime;
    const amp = 0.35 * (velocity / 127);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(amp, t0 + v.a);
    g.gain.setTargetAtTime(amp * v.s, t0 + v.a, v.d / 3);
    g.connect(ac.destination);
    const oscs = v.parts.map(([type, mult, lvl]) => {
      const o = ac.createOscillator();
      const og = ac.createGain();
      o.type = type;
      o.frequency.value = core.midiToFreq(note) * mult;
      og.gain.value = lvl;
      o.connect(og).connect(g);
      o.start(t0);
      return o;
    });
    return function stop(at) {
      const t = Math.max(at || ac.currentTime, t0 + v.a);
      g.gain.cancelScheduledValues(t);
      g.gain.setTargetAtTime(0, t, v.r / 3);
      oscs.forEach((o) => o.stop(t + v.r * 2));
    };
  }

  // ---- state -------------------------------------------------------------
  let octave = 0;                 // shift in octaves from C4
  let recording = false;
  let recStart = 0;
  let quantizeOn = false;
  let events = [];                // [{note, velocity, startMs, durMs}]
  const held = new Map();         // source id -> {note, stop, startMs}
  let playTimers = [];
  let playStops = [];

  function noteOn(src, note) {
    if (held.has(src) || note < 0 || note > 127) return;
    const stop = voice(note, 100);
    held.set(src, { note, stop, startMs: performance.now() - recStart });
    highlight(note, true);
  }
  function noteOff(src) {
    const h = held.get(src);
    if (!h) return;
    held.delete(src);
    h.stop();
    highlight(h.note, false);
    if (recording) {
      const end = performance.now() - recStart;
      events.push({ note: h.note, velocity: 100, startMs: Math.max(0, h.startMs), durMs: Math.max(20, end - h.startMs) });
      drawRoll();
    }
  }
  function allOff() { Array.from(held.keys()).forEach(noteOff); }

  // ---- keyboard UI (2 octaves from C(4+octave)) --------------------------
  const kb = $("kb");
  const keyEls = new Map();       // midi -> element
  const BLACK = new Set([1, 3, 6, 8, 10]);
  function base() { return 60 + octave * 12; }
  function buildKeys() {
    kb.textContent = "";
    keyEls.clear();
    const whites = [];
    for (let n = base(); n <= base() + 24; n++) if (!BLACK.has(n % 12)) whites.push(n);
    const w = 100 / whites.length;
    let wi = 0;
    for (let n = base(); n <= base() + 24; n++) {
      const el = document.createElement("div");
      const black = BLACK.has(n % 12);
      el.className = "key " + (black ? "black" : "white");
      el.dataset.note = String(n);
      if (black) {
        el.style.left = (wi * w - w * 0.3) + "%";
        el.style.width = (w * 0.6) + "%";
      } else {
        el.style.left = (wi * w) + "%";
        el.style.width = w + "%";
        if (n % 12 === 0) el.textContent = core.noteName(n);
        wi++;
      }
      kb.appendChild(el);
      keyEls.set(n, el);
    }
    $("octLabel").textContent = core.noteName(base());
  }
  function highlight(note, on) {
    const el = keyEls.get(note);
    if (el) el.classList.toggle("down", on);
  }
  function keyAt(x, y) {
    const el = document.elementFromPoint(x, y);
    return el && el.dataset && el.dataset.note ? Number(el.dataset.note) : null;
  }
  kb.addEventListener("pointerdown", (e) => {
    const n = keyAt(e.clientX, e.clientY);
    if (n === null) return;
    kb.setPointerCapture(e.pointerId);
    noteOn("p" + e.pointerId, n);
  });
  kb.addEventListener("pointermove", (e) => {
    const src = "p" + e.pointerId;
    const h = held.get(src);
    if (!h) return;
    const n = keyAt(e.clientX, e.clientY);
    if (n !== null && n !== h.note) { noteOff(src); noteOn(src, n); }
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach((t) =>
    kb.addEventListener(t, (e) => noteOff("p" + e.pointerId)));

  function shiftOctave(d) {
    const next = Math.max(-3, Math.min(3, octave + d));
    if (next === octave) return;
    allOff();
    octave = next;
    buildKeys();
  }
  window.addEventListener("keydown", (e) => {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) return;
    const k = e.key.toLowerCase();
    if (e.key === "Escape") { closeWin(); return; }
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (k in core.OCTAVE_KEYS) { shiftOctave(core.OCTAVE_KEYS[k]); return; }
    if (k in core.keyMap) { e.preventDefault(); noteOn("k" + k, core.keyMap[k] + octave * 12); }
  });
  window.addEventListener("keyup", (e) => noteOff("k" + e.key.toLowerCase()));
  window.addEventListener("blur", allOff);

  // ---- piano roll --------------------------------------------------------
  const roll = $("roll");
  function drawRoll() {
    const dpr = window.devicePixelRatio || 1;
    const W = roll.clientWidth, H = roll.clientHeight;
    roll.width = W * dpr; roll.height = H * dpr;
    const g = roll.getContext("2d");
    g.scale(dpr, dpr);
    g.clearRect(0, 0, W, H);
    const evs = current();
    if (!evs.length) {
      g.fillStyle = "#56606c"; g.font = "11px Segoe UI, system-ui";
      g.fillText(recording ? "Recording..." : "No notes recorded", 8, H / 2 + 4);
      return;
    }
    const end = core.totalMs(evs);
    let lo = 127, hi = 0;
    evs.forEach((ev) => { lo = Math.min(lo, ev.note); hi = Math.max(hi, ev.note); });
    const span = Math.max(12, hi - lo + 1);
    const rowH = (H - 4) / span;
    g.fillStyle = "#7cc4ff";
    evs.forEach((ev) => {
      const x = (ev.startMs / end) * W, w = Math.max(2, (ev.durMs / end) * W);
      const y = H - 2 - (ev.note - lo + 1) * rowH;
      g.fillRect(x, y, w, Math.max(2, rowH - 1));
    });
  }
  window.addEventListener("resize", drawRoll);

  // ---- transport ---------------------------------------------------------
  function bpm() { return Math.max(30, Math.min(300, Number($("bpm").value) || 120)); }
  function current() {
    const evs = events.slice().sort((a, b) => a.startMs - b.startMs);
    return quantizeOn ? core.quantize(evs, bpm(), 4) : evs;
  }
  function stopPlayback() {
    playTimers.forEach(clearTimeout); playTimers = [];
    playStops.forEach((s) => s()); playStops = [];
    keyEls.forEach((el) => el.classList.remove("down"));
    $("play").classList.remove("on");
  }
  $("rec").onclick = () => {
    stopPlayback(); allOff();
    if (!recording) { events = []; recStart = performance.now(); }
    recording = !recording;
    $("rec").classList.toggle("on", recording);
    status(recording ? "Recording. Play some notes." : events.length + " notes recorded.");
    drawRoll();
  };
  $("stop").onclick = () => {
    allOff(); stopPlayback();
    if (recording) { recording = false; $("rec").classList.remove("on"); status(events.length + " notes recorded."); }
    drawRoll();
  };
  $("play").onclick = () => {
    stopPlayback();
    const evs = current();
    if (!evs.length) { status("Nothing recorded yet."); return; }
    const ac = audio();
    const t0 = ac.currentTime + 0.05;
    $("play").classList.add("on");
    evs.forEach((ev) => {
      const stop = voice(ev.note, ev.velocity, t0 + ev.startMs / 1000);
      stop(t0 + (ev.startMs + ev.durMs) / 1000);
      playStops.push(() => stop());
      playTimers.push(setTimeout(() => highlight(ev.note, true), ev.startMs + 50));
      playTimers.push(setTimeout(() => highlight(ev.note, false), ev.startMs + ev.durMs + 50));
    });
    playTimers.push(setTimeout(() => { playStops = []; stopPlayback(); }, core.totalMs(evs) + 100));
  };
  $("clear").onclick = () => { stopPlayback(); events = []; drawRoll(); status("Cleared."); };
  $("quant").onclick = () => { quantizeOn = !quantizeOn; $("quant").classList.toggle("on", quantizeOn); drawRoll(); };
  $("bpm").addEventListener("change", drawRoll);
  $("octDown").onclick = () => shiftOctave(-1);
  $("octUp").onclick = () => shiftOctave(1);

  // ---- export ------------------------------------------------------------
  function stamp() {
    const d = new Date(), p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }
  function program() { return { piano: 0, organ: 16, square: 80, pluck: 24 }[$("sound").value] || 0; }
  function midiPayload() {
    const bytes = core.encodeMidi(current(), { bpm: bpm(), ppq: 480, program: program() });
    return { kind: "midi", name: "melody-" + stamp() + ".mid", mime: "audio/midi", bytes, dataB64: core.bytesToB64(bytes) };
  }
  function wavPayload() {
    const bytes = core.encodeWav(core.renderMelody(current(), 44100), 44100);
    return { kind: "audio", name: "melody-" + stamp() + ".wav", mime: "audio/wav", bytes, dataB64: core.bytesToB64(bytes) };
  }
  function noteText() { return current().map((ev) => core.noteName(ev.note)).join(" "); }
  function needNotes() {
    if (current().length) return true;
    status("Record some notes first.", "err");
    return false;
  }
  function download(p) {
    const url = URL.createObjectURL(new Blob([p.bytes], { type: p.mime }));
    const a = document.createElement("a");
    a.href = url; a.download = p.name; a.textContent = "Download " + p.name;
    status("", "ok");
    const span = document.createElement("span");
    span.id = "dl"; span.appendChild(a);
    statusEl.appendChild(span);
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  async function save(p) {
    if (!tk) { download(p); return; }
    try { verdict(await tk.save({ kind: p.kind, name: p.name, mime: p.mime, dataB64: p.dataB64 })); }
    catch (err) { status(String(err && err.message || err), "err"); }
  }
  $("saveMidi").onclick = () => { if (needNotes()) save(midiPayload()); };
  $("saveWav").onclick = () => { if (needNotes()) save(wavPayload()); };
  $("copy").onclick = async () => {
    if (!needNotes()) return;
    const text = noteText();
    try {
      if (tk) verdict(await tk.copy({ kind: "text", text }));
      else { await navigator.clipboard.writeText(text); status("Copied: " + text, "ok"); }
    } catch (err) { status(String(err && err.message || err), "err"); }
  };
  $("target").onchange = async () => {
    const id = $("target").value;
    $("target").value = "";
    if (!id || !tk || !needNotes()) return;
    const p = midiPayload();
    try {
      verdict(await tk.send(id, { kind: p.kind, name: p.name, mime: p.mime, dataB64: p.dataB64, title: "Melody: " + noteText().slice(0, 200) }));
    } catch (err) { status(String(err && err.message || err), "err"); }
  };
  $("seed").onclick = async () => {
    if (!needNotes()) return;
    if (!tk) { status("Song Studio hand-off needs the desk.", "err"); return; }
    const notes = current().map((ev) => ({ note: ev.note, velocity: ev.velocity, startMs: Math.round(ev.startMs), durMs: Math.round(ev.durMs) }));
    const arg = { midiB64: midiPayload().dataB64, wavB64: wavPayload().dataB64, bpm: bpm(), notes };
    try { verdict(await tk.call("song.seed", arg)); }
    catch (err) { status(String(err && err.message || err), "err"); }
  };

  function closeWin() {
    allOff(); stopPlayback();
    if (tk) tk.close(); else window.close();
  }
  $("close").onclick = closeWin;

  async function init() {
    buildKeys();
    drawRoll();
    if (!tk) {
      $("target").disabled = true;
      $("seed").disabled = true;
      return;
    }
    try {
      const info = await tk.info();
      const sel = $("target");
      const groups = new Map();
      (info && info.targets || []).forEach((t) => {
        let parent = sel;
        if (t.group) {
          if (!groups.has(t.group)) {
            const og = document.createElement("optgroup");
            og.label = t.group; sel.appendChild(og); groups.set(t.group, og);
          }
          parent = groups.get(t.group);
        }
        const o = document.createElement("option");
        o.value = t.id; o.textContent = t.label || t.id;
        parent.appendChild(o);
      });
      if (info && info.workspace && info.workspace.name) document.title = "Play notes - " + info.workspace.name;
      if (info && info.offline) status("Offline: playing and saving work; sending may not.");
    } catch (err) { status(String(err && err.message || err), "err"); }
  }
  init();
})();
</script>
</body>
</html>
