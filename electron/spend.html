<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; script-src file:; img-src data:;" />
<title>Spend</title>
<link rel="stylesheet" href="aither-tokens.css" />
<link rel="stylesheet" href="plane-page.css" />
<style>
  /* Layout is plane-page.css; only what the spend page adds is here. */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .stat .label { color: var(--muted); font-size: 11px; }
  .stat .value { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .value.big { font-size: 22px; color: var(--brand); }
  .stat .value.bad { color: var(--red); }
  .stat .value.warn { color: var(--amber); }
  .note, .summary.warn, .balance.warn { color: var(--amber); }
  .note { font-size: 12px; margin-top: 8px; }
  .balance { font-size: 15px; font-weight: 600; padding: 2px 0; }
  .small { font-size: 11px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<!-- Cloud LLM spend (DeepSeek API and kin). Reads: spend-client.cjs -> gateway
     MCP `cloud_spend` {hours}. Rendered by spend-page.js. -->
<body>
  <div class="bar">
    <span class="title">Spend</span>
    <span class="state" id="state">loading…</span>
    <button class="chip on" id="w-24">24h</button>
    <button class="chip" id="w-168">7d</button>
    <button class="chip" id="w-720">30d</button>
    <button class="chip" id="refresh">Refresh</button>
  </div>
  <main id="body"><div class="placeholder">reading spend…</div></main>
  <script src="spend-page.js"></script>
</body>
</html>
