<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; script-src file:; img-src data:;" />
<title>Spend</title>
<link rel="stylesheet" href="aither-tokens.css" />
<link rel="stylesheet" href="plane-page.css" />
<style>
  /* Layout is plane-page.css; only what the spend page adds is here. */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .stat .label { color: var(--muted); font-size: 11px; }
  .stat .value { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .value.big { font-size: 22px; color: var(--brand); }
  .stat .value.bad { color: var(--red); }
  .stat .value.warn { color: var(--amber); }
  .note, .summary.warn, .balance.warn { color: var(--amber); }
  .note { font-size: 12px; margin-top: 8px; }
  .balance { font-size: 15px; font-weight: 600; padding: 2px 0; }
  .small { font-size: 11px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .balance.bad { color: var(--red); }
  section.card.stale { border-color: var(--amber); }
  .meter { height: 8px; border-radius: 999px; background: var(--btn); overflow: hidden; margin: 6px 0 4px; }
  .meter .fill { height: 100%; background: var(--green); }
  .meter .fill.warn { background: var(--amber); }
  .meter .fill.bad { background: var(--red); }
  .budget-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .budget-form input { width: 80px; background: var(--btn); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 6px; font: inherit; }
  .days { display: flex; align-items: flex-end; gap: 4px; height: 150px; }
  .day { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; height: 100%; }
  .day .track { flex: 1; width: 100%; display: flex; align-items: flex-end; }
  .day .bar-fill { width: 100%; background: var(--brand); border-radius: 3px 3px 0 0; }
  .day .amt { font-size: 9px; color: var(--muted); height: 14px; white-space: nowrap; overflow: hidden; }
  .day .lbl { font-size: 9px; color: var(--muted); margin-top: 3px; }
</style>
</head>
<!-- Cloud LLM spend (DeepSeek API and kin). Reads: spend-client.cjs -> gateway
     MCP `cloud_spend` {hours}. The last good report per window is kept on disk
     (last-good-cache.cjs) and shown as an OFFLINE COPY when the live read fails;
     budgets are the owner's, kept by the desk. Rendered by spend-page.js. -->
<body>
  <div class="bar">
    <span class="title">Spend</span>
    <span class="state" id="state">loading…</span>
    <button class="chip on" id="w-24">24h</button>
    <button class="chip" id="w-168">7d</button>
    <button class="chip" id="w-720">30d</button>
    <button class="chip" id="refresh">Refresh</button>
  </div>
  <main id="body"><div class="placeholder">reading spend…</div></main>
  <script src="spend-page.js"></script>
</body>
</html>
