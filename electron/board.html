<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' file:; img-src data: blob:">
<title>Aither board</title>
<style>
  :root {
    --bar: #171b21;
    --edge: #2b323c;
    --ink: #e6e8eb;
    --muted: #8b93a1;
    --accent: #7cc4ff;
    --paper: #fdfdfb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14171c; color: var(--ink);
    font: 13px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
  #bar { height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px;
    background: var(--bar); border-bottom: 1px solid var(--edge); -webkit-app-region: drag; }
  #bar .kind { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; white-space: nowrap; }
  #title { flex: 1; min-width: 40px; -webkit-app-region: no-drag; background: transparent; border: 1px solid transparent;
    color: var(--ink); font: 600 13px inherit; padding: 4px 6px; border-radius: 6px; }
  #title:hover { border-color: var(--edge); }
  #title:focus { outline: none; border-color: rgba(124,196,255,.55); background: #10141a; }
  #bar button { all: unset; -webkit-app-region: no-drag; box-sizing: border-box; cursor: pointer; color: var(--ink);
    padding: 5px 9px; border-radius: 7px; font-size: 12px; white-space: nowrap; }
  #bar button:hover { background: rgba(124,196,255,.16); }
  #bar button.ghost { color: var(--muted); }
  #bar button.close:hover { background: #b0424a; }
  #workspace { position: absolute; inset: 38px 0 0 0; display: flex; flex-direction: column; }
  #tools { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px; background: #10141a; border-bottom: 1px solid var(--edge); }
  #tools button { all: unset; cursor: pointer; padding: 4px 8px; border-radius: 6px; font-size: 12px; color: var(--muted); }
  #tools button:hover { color: var(--ink); background: rgba(255,255,255,.06); }
  #tools button.on { color: #0d1117; background: var(--accent); font-weight: 600; }
  #tools input[type=color] { width: 26px; height: 24px; border: 1px solid var(--edge); border-radius: 6px; background: transparent; padding: 0; }
  #tools input[type=range] { width: 84px; accent-color: var(--accent); }
  #tools .sep { width: 1px; background: var(--edge); margin: 2px 4px; }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; background: var(--paper); touch-action: none; }
  body.note #tools, body.note #stage { display: none; }
  body.note #workspace { inset: 38px 0 0 0; }
  #noteView { display: none; flex: 1; min-height: 0; }
  body.note #noteView { display: flex; }
  #noteText { flex: 1; resize: none; border: 0; outline: 0; padding: 14px 16px; background: #f7f0c4; color: #24200f;
    font: 14px/1.55 "Cascadia Mono", Consolas, ui-monospace, monospace; user-select: text; }
  #editor { position: absolute; display: none; z-index: 5; border: 1.5px solid var(--accent); border-radius: 4px;
    background: rgba(255,255,255,.96); color: #111; padding: 4px 6px; font: 14px/1.35 "Segoe UI", system-ui, sans-serif;
    resize: none; outline: none; user-select: text; }
  #toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: calc(100% - 24px);
    padding: 7px 12px; border-radius: 9px; background: rgba(17,20,24,.94); color: var(--ink); font-size: 12px;
    border: 1px solid var(--edge); box-shadow: 0 8px 22px rgba(0,0,0,.45); opacity: 0; transition: opacity 140ms ease;
    pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toast.show { opacity: 1; }
  /* Pinned cards (pin-cards.js, the renderer aither://canvas uses): over the drawing,
     in the same board coordinates. A page card's body is a live view main lays on top. */
  #pins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
  #pinsPlane { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #pins .card { position: absolute; pointer-events: auto; display: flex; flex-direction: column; border: 1px solid var(--edge);
    border-radius: 10px; background: #1b2028; color: var(--ink); box-shadow: 0 6px 20px rgba(0,0,0,.35); outline: none; }
  #pins .card.sel, #pins .card:focus-visible { border-color: var(--accent); }
  #pins .head { height: 26px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 8px;
    border-bottom: 1px solid var(--edge); cursor: grab; }
  #pins .card.locked .head { cursor: default; }
  #pins .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600; font-size: 11.5px; }
  #pins .head button { all: unset; cursor: pointer; width: 20px; height: 20px; text-align: center; border-radius: 5px; color: var(--muted); font-size: 11px; }
  #pins .head button:hover { color: var(--ink); background: rgba(255,255,255,.08); }
  #pins .body { flex: 1; min-height: 0; position: relative; overflow: hidden; padding: 8px; font-size: 12px; }
  #pins .card.app .body { padding: 0; display: grid; place-items: center; color: var(--muted); }
  #pins .grip { position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; cursor: nwse-resize;
    background: linear-gradient(135deg, transparent 55%, var(--muted) 55%); }
  #pins .card.locked .grip { display: none; }
  #pins .note textarea { width: 100%; height: 100%; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; user-select: text; }
  #pins .stat .v { font-size: 28px; font-weight: 700; } #pins .sub { color: var(--muted); font-size: 11px; }
  #pins .list .row { display: flex; justify-content: space-between; gap: 6px; padding: 2px 0; }
  #pins .clock .time { font-size: 26px; font-weight: 700; } #pins .err { color: var(--muted); }
  #pins .tone-ok { color: #6c9; } #pins .tone-warn { color: #e5b04a; } #pins .tone-bad { color: #e5656b; }
</style>
</head>
<body>
<div id="bar">
  <span class="kind" id="kind">Board</span>
  <input id="title" spellcheck="false" aria-label="Board title">
  <button id="putAway" class="ghost" title="Put away -- stays in the Boards list (or hold Esc)">Put away</button>
  <button id="export" class="ghost" title="Export this board as a PNG">PNG</button>
  <button id="close" class="close" title="Close this board for good">×</button>
</div>
<div id="workspace">
  <div id="tools" role="toolbar" aria-label="Drawing tools">
    <button data-tool="select" title="Select and move items">Select</button>
    <button data-tool="pen" class="on" title="Draw with the pen">Pen</button>
    <button data-tool="eraser" title="Erase an item">Eraser</button>
    <span class="sep"></span>
    <button data-tool="line" title="Line">Line</button>
    <button data-tool="rect" title="Rectangle">Rect</button>
    <button data-tool="ellipse" title="Ellipse">Ellipse</button>
    <span class="sep"></span>
    <button data-tool="text" title="Click to write text">Text</button>
    <button data-tool="note" title="Click to drop a sticky note">Sticky</button>
    <span class="sep"></span>
    <input type="color" id="color" value="#1f6feb" title="Ink colour">
    <input type="range" id="width" min="1" max="12" value="3" title="Ink width">
    <button id="clear" title="Remove every item from this board">Clear</button>
  </div>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="pins" aria-label="Pinned cards"><div id="pinsPlane"></div></div>
    <textarea id="editor" spellcheck="false"></textarea>
    <div id="toast" role="status"></div>
  </div>
</div>
<div id="noteView"><textarea id="noteText" spellcheck="false" aria-label="Note text (markdown)"></textarea></div>
<script src="middle-drag.js"></script>
<script src="pin-cards.js"></script>
<script>
(() => {
  const api = window.aitherBoard;
  const $ = (id) => document.getElementById(id);
  const canvas = $("canvas");
  // `let` so exportReplay can point the same drawItem code at an offscreen surface.
  let ctx = canvas.getContext("2d");
  const editor = $("editor");
  const toastEl = $("toast");

  let board = null;
  let tool = "pen";
  let color = "#1f6feb";
  let inkWidth = 3;
  let dpr = 1;
  let dirty = false;
  let dirtyPng = false;
  let lastPngAt = 0;
  let saveTimer = null;
  let drawing = null;     // {kind:"pen"|"shape", start, item}
  let moving = null;      // {item, last:{x,y}}
  let editing = null;     // {item, original}
  let escTimer = null;
  const images = new Map();

  // ── helpers ───────────────────────────────────────────────────────────────
  function toast(text) {
    if (!text) return;
    toastEl.textContent = String(text).slice(0, 180);
    toastEl.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => toastEl.classList.remove("show"), 2600);
  }
  const newId = () => `i-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
  const clamp = (n, lo, hi) => Math.min(Math.max(n, lo), hi);
  function canvasSize() { return { width: Math.max(1, canvas.clientWidth), height: Math.max(1, canvas.clientHeight) }; }
  /**
   * The board's pan (middle-drag on empty space, the owner's rule): content point =
   * screen point - pan. Not persisted -- the window opens at the board's origin; the
   * canvas page keeps its own view.
   */
  let pan = { x: 0, y: 0 };
  function pos(event) {
    const r = canvas.getBoundingClientRect();
    return { x: clamp(event.clientX - r.left, 0, r.width) - pan.x, y: clamp(event.clientY - r.top, 0, r.height) - pan.y };
  }
  function normRect(a, b) {
    return { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(b.x - a.x), h: Math.abs(b.y - a.y) };
  }

  // ── persistence ───────────────────────────────────────────────────────────
  function payload() {
    const p = { title: $("title").value.trim() || board.title };
    if (board.kind === "note") p.text = $("noteText").value;
    else p.items = board.items;
    return p;
  }
  function markDirty() {
    dirty = true;
    dirtyPng = board.kind === "board";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 600);
  }
  async function saveNow({ withPng = false } = {}) {
    clearTimeout(saveTimer);
    const wantsPng = withPng && board.kind === "board" && Date.now() - lastPngAt > 5000;
    if (!dirty && !wantsPng) return;
    const data = payload();
    if (wantsPng) {
      data.png = renderExport();
      lastPngAt = Date.now();
    }
    dirty = false;
    if (wantsPng) dirtyPng = false; // an ordinary autosave leaves the PNG owed
    const reply = await api.save(data);
    if (!reply || !reply.ok) toast(reply && reply.reason ? reply.reason : "could not save this board");
  }
  // The PNG rides an occasional save so sync/taskbar thumbnails stay fresh.
  setInterval(() => { if (dirtyPng) void saveNow({ withPng: true }); }, 5000);

  // ── drawing ───────────────────────────────────────────────────────────────
  function resizeCanvas() {
    const size = canvasSize();
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(size.width * dpr);
    canvas.height = Math.round(size.height * dpr);
    redraw();
  }
  function imageFor(item) {
    if (images.has(item.dataUrl)) return images.get(item.dataUrl);
    const img = new Image();
    img.onload = () => redraw();
    img.src = item.dataUrl;
    images.set(item.dataUrl, img);
    return img;
  }
  function wrapText(text, x, y, maxWidth, lineHeight, maxLines = 12) {
    const words = String(text || "").split(/\s+/);
    let line = "";
    let lines = 0;
    for (const word of words) {
      const next = line ? `${line} ${word}` : word;
      if (ctx.measureText(next).width > maxWidth && line) {
        ctx.fillText(line, x, y + lines * lineHeight);
        line = word;
        lines += 1;
        if (lines >= maxLines) break;
      } else line = next;
    }
    if (lines < maxLines && line) ctx.fillText(line, x, y + lines * lineHeight);
  }
  function drawItem(item) {
    ctx.save();
    if (item.type === "stroke") {
      ctx.strokeStyle = item.color; ctx.lineWidth = item.width; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath();
      item.points.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.stroke();
    } else if (item.type === "shape") {
      ctx.strokeStyle = item.color; ctx.lineWidth = item.width; ctx.lineCap = "round";
      const x = item.x, y = item.y, w = item.w, h = item.h;
      ctx.beginPath();
      if (item.shape === "line") { ctx.moveTo(x, y); ctx.lineTo(x + w, y + h); }
      else if (item.shape === "rect") ctx.rect(x, y, w, h);
      else ctx.ellipse(x + w / 2, y + h / 2, Math.max(1, Math.abs(w) / 2), Math.max(1, Math.abs(h) / 2), 0, 0, Math.PI * 2);
      ctx.stroke();
    } else if (item.type === "text") {
      ctx.fillStyle = item.color; ctx.font = `${item.size}px "Segoe UI", system-ui, sans-serif`; ctx.textBaseline = "top";
      const lines = String(item.text || "").split("\n");
      lines.forEach((line, i) => ctx.fillText(line, item.x + 4, item.y + 4 + i * (item.size * 1.3)));
    } else if (item.type === "note") {
      ctx.fillStyle = "#f7e98e"; ctx.strokeStyle = "#d8c75a"; ctx.lineWidth = 1;
      ctx.fillRect(item.x, item.y, item.w, item.h);
      ctx.strokeRect(item.x + 0.5, item.y + 0.5, item.w - 1, item.h - 1);
      ctx.fillStyle = "#24200f"; ctx.font = `13px "Segoe UI", system-ui, sans-serif`; ctx.textBaseline = "top";
      wrapText(item.text, item.x + 8, item.y + 8, item.w - 16, 16, 20);
    } else if (item.type === "image") {
      const img = imageFor(item);
      if (img.complete && img.naturalWidth) ctx.drawImage(img, item.x, item.y, item.w, item.h);
      else { ctx.strokeStyle = "#c9ced6"; ctx.setLineDash([5, 4]); ctx.strokeRect(item.x, item.y, item.w, item.h); ctx.setLineDash([]); }
    }
    ctx.restore();
  }
  function redraw() {
    if (board.kind !== "board") return;
    const size = canvasSize();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#fdfdfb";
    ctx.fillRect(0, 0, size.width, size.height);
    ctx.setTransform(dpr, 0, 0, dpr, pan.x * dpr, pan.y * dpr);
    for (const item of board.items) drawItem(item);
    if (drawing && drawing.kind === "shape") drawItem(drawing.item);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const plane = document.getElementById("pinsPlane");
    if (plane) plane.style.transform = `translate(${pan.x}px, ${pan.y}px)`;
  }
  function renderExport() {
    return canvas.toDataURL("image/png"); // the on-screen canvas already paints white
  }
  /** Replay the items onto an offscreen context for "Export PNG". */
  function exportReplay(octx) {
    const size = canvasSize();
    octx.setTransform(dpr, 0, 0, dpr, 0, 0);
    octx.fillStyle = "#fdfdfb";
    octx.fillRect(0, 0, size.width, size.height);
    const saved = ctx;
    try {
      ctx = octx;
      for (const item of board.items) drawItem(item);
    } finally { ctx = saved; }
  }

  // ── item edits ────────────────────────────────────────────────────────────
  function hit(item, p) {
    const pad = 6;
    if (item.type === "stroke") return p.x >= item.x - pad && p.x <= item.x + item.w + pad && p.y >= item.y - pad && p.y <= item.y + item.h + pad;
    return p.x >= Math.min(item.x, item.x + item.w) - pad && p.x <= Math.max(item.x, item.x + item.w) + pad
      && p.y >= Math.min(item.y, item.y + item.h) - pad && p.y <= Math.max(item.y, item.y + item.h) + pad;
  }
  function topItem(p) {
    for (let i = board.items.length - 1; i >= 0; i -= 1) if (hit(board.items[i], p)) return board.items[i];
    return null;
  }
  function addItem(item) { board.items.push(item); redraw(); markDirty(); }

  function openEditor(item, isNew) {
    editing = { item, original: isNew ? null : JSON.parse(JSON.stringify(item)) };
    const r = canvas.getBoundingClientRect();
    editor.style.display = "block";
    editor.style.left = `${item.x + pan.x}px`;
    editor.style.top = `${item.y + pan.y}px`;
    editor.style.width = `${Math.max(140, item.w)}px`;
    editor.style.height = `${Math.max(item.type === "note" ? 90 : 38, item.h)}px`;
    editor.value = item.text || "";
    editor.dataset.x = String(item.x);
    editor.dataset.y = String(item.y);
    void r;
    editor.focus();
    editor.setSelectionRange(editor.value.length, editor.value.length);
  }
  function commitEditor({ cancel = false } = {}) {
    if (!editing) return;
    const { item, original } = editing;
    editing = null;
    editor.style.display = "none";
    if (cancel) {
      if (original) Object.assign(item, original);
      else { const at = board.items.indexOf(item); if (at >= 0) board.items.splice(at, 1); }
    } else {
      item.text = editor.value;
      if (item.type === "note") { item.w = Math.max(80, item.w); item.h = Math.max(60, item.h); }
      if (item.type === "text") {
        const lines = item.text.split("\n");
        const widest = Math.max(...lines.map((line) => line.length), 1);
        item.w = Math.max(60, Math.min(600, widest * item.size * 0.62 + 12));
        item.h = Math.max(item.size + 10, lines.length * item.size * 1.3 + 10);
      }
    }
    redraw();
    markDirty();
  }

  // ── middle-drag (2026-11-07): the SAME map as screen ink, desktop pins and the
  // AitherOne canvas (electron/middle-gesture.cjs; inlined because this page's CSP
  // loads no script files): middle-drag moves the topmost item, Shift+middle
  // resizes from the bottom-right, Ctrl/Cmd+middle duplicates and drags the copy
  // (Ctrl beats Shift), a locked item never moves or resizes but can be duplicated.
  let resizing = null; // {item, start:{x,y}, from:{x,y,w,h}, points}
  function middleGestureFor(item, event) {
    if (!item) return "none";
    if (event.ctrlKey || event.metaKey) return "duplicate";
    if (item.locked) return "blocked";
    return event.shiftKey ? "resize" : "move";
  }
  function middleDown(event) {
    const p = pos(event);
    let item = topItem(p);
    const g = middleGestureFor(item, event);
    if (g === "none" || g === "blocked") return;
    event.preventDefault();
    canvas.setPointerCapture(event.pointerId);
    if (g === "duplicate") {
      const copy = JSON.parse(JSON.stringify(item));
      copy.id = newId();
      delete copy.locked;
      addItem(copy);
      item = copy;
    }
    if (g === "resize") {
      resizing = { item, start: p, from: { x: item.x, y: item.y, w: item.w, h: item.h },
        points: item.type === "stroke" ? item.points.map((q) => ({ ...q })) : null };
    } else {
      moving = { item, last: p, points: item.type === "stroke" ? item.points : null };
    }
  }
  function resizeTo(p) {
    const r = resizing;
    const w = Math.max(24, r.from.w + (p.x - r.start.x));
    const h = Math.max(24, r.from.h + (p.y - r.start.y));
    if (r.points) {
      const sx = r.from.w > 0 ? w / r.from.w : 1;
      const sy = r.from.h > 0 ? h / r.from.h : 1;
      r.item.points = r.points.map((q) => ({ ...q, x: r.from.x + (q.x - r.from.x) * sx, y: r.from.y + (q.y - r.from.y) * sy }));
      updateStrokeBounds(r.item);
    } else {
      r.item.w = w; r.item.h = h;
    }
    redraw();
  }
  canvas.addEventListener("auxclick", (event) => { if (event.button === 1) event.preventDefault(); });

  // ── pointer ───────────────────────────────────────────────────────────────
  canvas.addEventListener("pointerdown", (event) => {
    if (board.kind !== "board") return;
    // The middle button is the owner's move/resize/duplicate rule (below); the tools
    // draw with the primary button only.
    if (event.button !== 0) return;
    if (editing) commitEditor();
    if (event.button === 1) { middleDown(event); return; }
    const p = pos(event);
    canvas.setPointerCapture(event.pointerId);
    if (tool === "pen") {
      drawing = { kind: "pen", item: { id: newId(), type: "stroke", points: [p], color, width: inkWidth, x: p.x, y: p.y, w: 1, h: 1 } };
    } else if (tool === "line" || tool === "rect" || tool === "ellipse") {
      drawing = { kind: "shape", start: p, item: { id: newId(), type: "shape", shape: tool, x: p.x, y: p.y, w: 1, h: 1, color, width: inkWidth } };
    } else if (tool === "eraser") {
      const item = topItem(p);
      if (item) { board.items.splice(board.items.indexOf(item), 1); redraw(); markDirty(); }
    } else if (tool === "select") {
      const item = topItem(p);
      if (item) moving = { item, last: p, points: item.type === "stroke" ? item.points : null };
    } else if (tool === "text") {
      const item = { id: newId(), type: "text", x: p.x, y: p.y, w: 260, h: 30, text: "", color: "#111827", size: 16 };
      addItem(item);
      openEditor(item, true);
    } else if (tool === "note") {
      const item = { id: newId(), type: "note", x: p.x, y: p.y, w: 190, h: 120, text: "", color: "#f7e98e" };
      addItem(item);
      openEditor(item, true);
    }
  });

  canvas.addEventListener("pointermove", (event) => {
    if (board.kind !== "board") return;
    const p = pos(event);
    if (resizing) { resizeTo(p); return; }
    if (drawing && drawing.kind === "pen") {
      drawing.item.points.push(p);
      updateStrokeBounds(drawing.item);
      redraw();
    } else if (drawing && drawing.kind === "shape") {
      const r = normRect(drawing.start, p);
      Object.assign(drawing.item, r);
      redraw();
    } else if (moving) {
      const dx = p.x - moving.last.x;
      const dy = p.y - moving.last.y;
      moving.last = p;
      if (moving.points) { for (const q of moving.points) { q.x += dx; q.y += dy; } updateStrokeBounds(moving.item); }
      else { moving.item.x += dx; moving.item.y += dy; }
      redraw();
    }
  });

  function endPointer() {
    if (drawing) {
      const item = drawing.item;
      drawing = null;
      if (item.type === "stroke") {
        updateStrokeBounds(item);
        if (item.points.length > 1) addItem(item); else redraw();
      } else if (item.type === "shape") {
        if (item.w < 2 && item.h < 2) redraw();
        else addItem(item);
      }
    }
    if (moving) { moving = null; markDirty(); }
    if (resizing) { resizing = null; markDirty(); }
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  // ── the owner's middle-button rule on ink (middle-drag.js) ────────────────────
  // middle-drag moves an item, Shift resizes it, Ctrl duplicates it; middle-drag on
  // empty space pans the board (drawing and cards together).
  window.AitherMiddleDrag.suppressAutoscroll(canvas);
  canvas.addEventListener("pointerdown", (event) => {
    if (board.kind !== "board" || event.button !== 1) return;
    const p = pos(event);
    const found = topItem(p);
    const gesture = window.AitherMiddleDrag.classify(event, Boolean(found));
    if (!gesture) return;
    if (gesture === "pan") {
      const from = { ...pan };
      canvas.style.cursor = "grabbing";
      window.AitherMiddleDrag.track(event, canvas, {
        onMove: ({ dx, dy }) => { pan = { x: Math.round(from.x + dx), y: Math.round(from.y + dy) }; redraw(); reportPinViews(); },
        onEnd: () => { canvas.style.cursor = ""; },
      });
      return;
    }
    if (editing) commitEditor();
    let item = found;
    if (gesture === "duplicate") {
      item = { ...JSON.parse(JSON.stringify(found)), id: newId() };
      board.items.push(item);
    }
    const start = JSON.parse(JSON.stringify(item));
    window.AitherMiddleDrag.track(event, canvas, {
      onMove: ({ dx, dy }) => {
        if (gesture === "resize") resizeItem(item, start, dx, dy);
        else moveItem(item, start, dx, dy);
        redraw();
      },
      onEnd: ({ moved }) => { if (moved || gesture === "duplicate") markDirty(); redraw(); },
    });
  });
  function moveItem(item, start, dx, dy) {
    item.x = start.x + dx;
    item.y = start.y + dy;
    if (item.points) item.points = start.points.map((q) => ({ x: q.x + dx, y: q.y + dy }));
  }
  function resizeItem(item, start, dx, dy) {
    const w = Math.max(8, start.w + dx);
    const h = Math.max(8, start.h + dy);
    if (item.points) {
      const sx = w / Math.max(1, start.w);
      const sy = h / Math.max(1, start.h);
      item.points = start.points.map((q) => ({ x: start.x + (q.x - start.x) * sx, y: start.y + (q.y - start.y) * sy }));
      updateStrokeBounds(item);
    } else {
      item.w = w;
      item.h = h;
    }
  }

  // ── pinned cards: the SAME renderer as aither://canvas (pin-cards.js) ──────────
  let pinState = { pins: [], widgets: [] };
  let pinSelected = null;
  const pinTimers = new Map();
  const pinCards = window.AitherPinCards.create({
    api: { op: (o) => api.pinOp(o), widget: (id) => api.pinWidget(id), open: (id) => api.pinOpen(id) },
    widgets: () => pinState.widgets, zoom: () => 1,
    select: (id) => { pinSelected = id; for (const n of document.querySelectorAll("#pins .card")) n.classList.toggle("sel", n.dataset.id === id); },
    selected: () => pinSelected, timers: pinTimers, onDrag: () => reportPinViews(), say: toast,
    onSettle: () => { if (pinsStale) { pinsStale = false; void loadPins(); } },
  });
  let pinsStale = false;
  function renderPins() {
    for (const t of pinTimers.values()) clearInterval(t);
    pinTimers.clear();
    const layer = $("pinsPlane");
    layer.textContent = "";
    for (const pin of pinState.pins) layer.append(pinCards.renderCard(pin));
    reportPinViews();
  }
  let pinFrame = 0;
  function reportPinViews() {
    if (pinFrame) return;
    pinFrame = requestAnimationFrame(() => {
      pinFrame = 0;
      const v = $("stage").getBoundingClientRect();
      const cards = [];
      for (const node of document.querySelectorAll("#pins .card.app")) {
        const r = node.querySelector(".body").getBoundingClientRect();
        cards.push({ id: node.dataset.id, rect: { x: r.left, y: r.top, width: r.width, height: r.height } });
      }
      void api.pinViews({ viewport: { x: v.left, y: v.top, width: v.width, height: v.height }, cards });
    });
  }
  async function loadPins() {
    // Never re-render under a card drag (the dragged node would lose its pointerup).
    if (pinCards.busy()) { pinsStale = true; return; }
    const reply = await api.pins();
    if (!reply || !reply.ok) return;
    pinState = reply;
    renderPins();
  }

  function updateStrokeBounds(item) {
    const xs = item.points.map((p) => p.x);
    const ys = item.points.map((p) => p.y);
    item.x = Math.min(...xs); item.y = Math.min(...ys);
    item.w = Math.max(1, Math.max(...xs) - item.x); item.h = Math.max(1, Math.max(...ys) - item.y);
  }

  // ── paste + drop ──────────────────────────────────────────────────────────
  function fitBox(natural, size, at, fraction = 0.7) {
    const maxW = Math.max(60, size.width * fraction);
    const maxH = Math.max(60, size.height * fraction);
    const scale = Math.min(1, maxW / Math.max(1, natural.width), maxH / Math.max(1, natural.height));
    const w = Math.max(30, natural.width * scale);
    const h = Math.max(30, natural.height * scale);
    const x = at ? clamp(at.x - w / 2, 0, size.width - w) : (size.width - w) / 2;
    const y = at ? clamp(at.y - h / 2, 0, size.height - h) : (size.height - h) / 2;
    return { x, y, w, h };
  }
  function pasteImage(dataUrl, natural, at) {
    const box = fitBox(natural, canvasSize(), at);
    addItem({ id: newId(), type: "image", dataUrl, name: "pasted image", ...box });
  }
  function pasteText(text, at) {
    const size = canvasSize();
    const lines = String(text).split("\n").slice(0, 40);
    const widest = Math.max(...lines.map((line) => line.length), 1);
    const w = Math.min(size.width * 0.8, Math.max(140, widest * 8 + 16));
    const h = Math.min(size.height * 0.8, lines.length * 22 + 12);
    const box = fitBox({ width: w, height: h }, size, at, 0.8);
    addItem({ id: newId(), type: "text", text: String(text).slice(0, 4000), color: "#111827", size: 14, ...box });
  }
  async function pasteFromClipboard() {
    if (board.kind !== "board" || editing) return;
    const reply = await api.paste();
    if (!reply || !reply.ok) { toast(reply && reply.reason ? reply.reason : "nothing to paste"); return; }
    if (reply.kind === "image") pasteImage(reply.dataUrl, { width: reply.width, height: reply.height });
    else pasteText(reply.text);
  }

  function readFile(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => resolve(null);
      if (String(file.type || "").startsWith("image/")) reader.readAsDataURL(file);
      else reader.readAsText(file);
    });
  }
  async function dropFiles(files, at) {
    const list = Array.from(files || []).slice(0, 20);
    for (const file of list) {
      const data = await readFile(file);
      if (data == null) { toast(`${file.name} — could not be read`); continue; }
      if (String(file.type || "").startsWith("image/")) {
        const img = new Image();
        img.onload = () => pasteImage(data, { width: img.naturalWidth, height: img.naturalHeight }, at);
        img.src = data;
      } else {
        pasteText(String(data).slice(0, 4000) || file.name, at);
      }
    }
  }
  canvas.addEventListener("dragover", (event) => event.preventDefault());
  canvas.addEventListener("drop", (event) => {
    event.preventDefault();
    if (board.kind !== "board") return;
    const p = pos(event);
    void dropFiles(event.dataTransfer && event.dataTransfer.files, p);
  });
  window.addEventListener("dragover", (event) => event.preventDefault());
  window.addEventListener("drop", (event) => event.preventDefault());

  // ── keyboard: paste, Esc-hold put-away ────────────────────────────────────
  document.addEventListener("keydown", (event) => {
    if (!board) return;
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "v") {
      if (board.kind === "board" && !editing) { event.preventDefault(); void pasteFromClipboard(); }
      return;
    }
    if (event.key === "Escape" && !editing) {
      if (escTimer) return;
      escTimer = setTimeout(() => { escTimer = null; void putAway(); }, 700);
      return;
    }
    if (editing && event.key === "Escape") { event.preventDefault(); commitEditor({ cancel: true }); return; }
    if (editing && event.key === "Enter" && (event.ctrlKey || event.metaKey)) { event.preventDefault(); commitEditor(); return; }
    if (escTimer && event.key !== "Escape") { clearTimeout(escTimer); escTimer = null; }
  });
  document.addEventListener("keyup", (event) => {
    if (event.key === "Escape" && escTimer) { clearTimeout(escTimer); escTimer = null; }
  });

  // ── toolbar ───────────────────────────────────────────────────────────────
  for (const button of document.querySelectorAll("#tools button[data-tool]")) {
    button.addEventListener("click", () => {
      tool = button.dataset.tool;
      for (const other of document.querySelectorAll("#tools button[data-tool]")) other.classList.toggle("on", other === button);
    });
  }
  $("color").addEventListener("input", (event) => { color = event.target.value; });
  $("width").addEventListener("input", (event) => { inkWidth = Number(event.target.value) || 3; });
  $("clear").addEventListener("click", () => {
    if (!board.items.length) return;
    const removed = board.items.length;
    lastClear = JSON.parse(JSON.stringify(board.items));
    board.items = [];
    redraw();
    markDirty();
    toast(`Cleared ${removed} ${removed === 1 ? "item" : "items"} — Ctrl+Z restores`);
  });
  // One-step undo for the only destructive action on a board (Clear).
  let lastClear = null;
  document.addEventListener("keydown", (event) => {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z" && !editing && board && board.kind === "board") {
      if (lastClear && board.items.length === 0) { board.items = lastClear; lastClear = null; redraw(); markDirty(); }
    }
  });

  // ── verbs ─────────────────────────────────────────────────────────────────
  async function putAway() {
    if (editing) commitEditor();
    await saveNow();
    await api.putAway();
  }
  async function exportNow() {
    if (board.kind !== "board") return;
    await saveNow();
    const size = canvasSize();
    const out = document.createElement("canvas");
    out.width = Math.round(size.width * dpr);
    out.height = Math.round(size.height * dpr);
    const octx = out.getContext("2d");
    exportReplay(octx);
    const reply = await api.exportPng(out.toDataURL("image/png"));
    toast(reply && reply.ok ? `Saved ${reply.name}` : (reply && reply.reason) || "could not export this board");
  }
  $("putAway").addEventListener("click", () => void putAway());
  $("export").addEventListener("click", () => void exportNow());
  $("close").addEventListener("click", async () => { commitEditor(); await saveNow(); await api.close(); });
  $("title").addEventListener("input", markDirty);
  $("title").addEventListener("keydown", (event) => { if (event.key === "Enter") $("title").blur(); });
  $("noteText").addEventListener("input", markDirty);
  editor.addEventListener("blur", () => commitEditor());

  // ── boot ──────────────────────────────────────────────────────────────────
  async function boot() {
    const reply = await api.init();
    if (!reply || !reply.ok) { toast((reply && reply.reason) || "could not open this board"); return; }
    board = reply.board;
    document.body.classList.toggle("note", board.kind === "note");
    $("kind").textContent = board.kind === "note" ? "Note" : "Whiteboard";
    $("title").value = board.title;
    $("export").style.display = board.kind === "note" ? "none" : "";
    if (board.kind === "note") {
      $("noteText").value = board.text || "";
      setTimeout(() => $("noteText").focus(), 60);
    } else {
      resizeCanvas();
      new ResizeObserver(() => { resizeCanvas(); reportPinViews(); }).observe($("stage"));
      void loadPins();
      // A pin added or moved from aither://canvas (or a tab's "Pin to canvas") lands here too.
      api.onChanged(() => void loadPins());
    }
    window.addEventListener("beforeunload", () => {
      // Best effort: main persists on its own timers; never block a close.
      if (dirty) void api.save(payload());
    });
    for (const img of pendingImages.splice(0)) addOutsideImage(img);
  }
  // Images handed in from outside (the GIF picker's Shift+click, 2026-11-07):
  // main sends {dataUrl, name, width, height}; it lands centred like a paste. One
  // that arrives before boot() has the board is queued, not dropped.
  const pendingImages = [];
  function addOutsideImage(img) {
    if (!img || !/^data:image\//.test(String(img.dataUrl || ""))) return;
    if (!board) { pendingImages.push(img); return; }
    if (board.kind !== "board") return;
    const box = fitBox({ width: Number(img.width) || 240, height: Number(img.height) || 180 }, canvasSize(), null, 0.5);
    addItem({ id: newId(), type: "image", dataUrl: img.dataUrl, name: String(img.name || "image").slice(0, 120), ...box });
  }
  if (typeof api.onAddImage === "function") api.onAddImage(addOutsideImage);
  boot();
})();
</script>
</body>
</html>
