<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>GargBot goblin</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; -webkit-app-region: drag; }
  #goblin { width: 232px; height: 232px; image-rendering: auto; filter: drop-shadow(0 8px 10px rgba(0,0,0,.45)); transform-origin: 50% 100%; }
  #label { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font: 600 11px/1 system-ui, sans-serif; color: #e8f4ff; text-shadow: 0 1px 3px #000; opacity: 0; transition: opacity .25s; pointer-events: none; }
  body:hover #label { opacity: .9; }
</style>
</head>
<body>
<div id="wrap"><img id="goblin" alt="GargBot" draggable="false" /></div>
<div id="label">GargBot - right-click to send him back</div>
<script>
(function () {
  var img = document.getElementById("goblin");
  var state = { weapon: "sword", mood: "idle" };
  var tick = 0;
  var params = new URLSearchParams(location.search);
  if (params.get("weapon") === "noodle") state.weapon = "noodle";
  var IDLE = 12, TALK = 4;
  function frame() {
    var w = state.weapon, m = state.mood, i = tick;
    if (m === "idle") return w + "/idle/frame_" + String(i % IDLE).padStart(2, "0") + ".png";
    if (m === "talking") return w + "/talking-" + (i % TALK) + ".png";
    return w + "/" + m + ".png";
  }
  function paint() { img.src = "goblin/" + frame(); }
  paint();
  setInterval(function () { tick += 1; paint(); }, 110);
  var api = window.goblinApi;
  if (api && api.onState) api.onState(function (s) {
    if (s && s.weapon) state.weapon = s.weapon === "noodle" ? "noodle" : "sword";
    if (s && s.mood) state.mood = s.mood;
    paint();
  });
  window.addEventListener("contextmenu", function (e) { e.preventDefault(); if (api && api.dismiss) api.dismiss(); });
})();
</script>
</body>
</html>
